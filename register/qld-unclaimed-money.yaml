faq:
- q: What is in each row?
  a: Each row is one amount of unclaimed money held by the Public Trustee of Queensland, with the account number, the owner's name as recorded, the amount in dollars, who sent the money, the date it was received and the owner's postcode where known.
- q: How do I claim money listed here?
  a: Claims are made to the Public Trustee of Queensland, which checks the claimant's identity and entitlement. This copy of the register cannot be used to make a claim.
- q: What does a postcode of 0 mean?
  a: The publisher gives 0 or leaves the cell blank where it has no postcode for the owner. Both are kept as published.
summary: Each amount of unclaimed money held by the Public Trustee of Queensland, with the owner's name, amount, sender and date received.
description: The unclaimed money register of the Public Trustee of Queensland, which holds money from deceased estates it administers and unclaimed money received from other sources, such as superannuation funds, companies and government agencies. Each row gives the account number, the owner's name as the sender recorded it, the amount, the sender's name, the date the Public Trustee received it and the owner's last known postcode. Names are kept as published, in whichever order the sender gave them.
