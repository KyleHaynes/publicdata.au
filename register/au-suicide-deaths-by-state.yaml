faq:
- q: What is in each row?
  a: Deaths by suicide for one sex, one year from 1979 and one state or territory, as the number of deaths,
    the age-standardised rate per 100,000 or the crude rate per 100,000, whichever the measure column
    names. The Australia column of the Institute's table is kept as a state value named Australia.
- q: Where do the figures come from?
  a: The Institute's Suicide and self-harm monitoring data tables, built from the National Mortality Database,
    which holds the causes of death the ABS codes from registrations. The Institute writes n.p. where
    a figure is not published because the count is small, and those cells are null here with a suppressed
    flag. Year of death is the year the death was registered.
- q: Why does the attribution say "based on" AIHW material?
  a: The Institute publishes its data tables under CC BY 4.0 and asks that material adapted from them,
    which republishing in other formats is, carry the words "Based on Australian Institute of Health and
    Welfare material". Every file here carries them. The Institute has not endorsed this site.
summary: Deaths by suicide and age-standardised suicide rates for each state and territory by sex and
  year since 1979, from the AIHW National Mortality Database tables. Updated yearly.
description: Table NMD 3a of the Australian Institute of Health and Welfare's Suicide and self-harm monitoring
  data tables, deaths by suicide by state or territory, sex and year, one row per sex, year, measure and
  state, with the number of deaths, the age-standardised rate or the crude rate per 100,000 population. The Institute
  publishes the table with a column per state; it is one row per state here.
