faq:
- q: What is in each row?
  a: One type of organisation the Office of Fair Trading registers, such as incorporated associations,
    charities, community purpose fundraising authorities, cooperatives and limited liability partnerships,
    with the number in each office region on the count date and a Grand Total row and column.
- q: What does a blank cell mean?
  a: The office leaves a cell blank where a region has none of that type in its table. Those cells are
    null here.
- q: When is the count taken?
  a: The office counts registrations in April and October each year. The first version here is the count
    as at 21 April 2026.
summary: The number of incorporated associations, charities, fundraising authorities, cooperatives and
  partnerships registered with the Queensland Office of Fair Trading, by office region, on the newest
  count date.
description: Counts of the organisations registered with the Queensland Office of Fair Trading, one row
  per organisation type, with one column for each office region and a Grand Total. The office publishes
  a count in April and October each year, and this table follows the newest.
