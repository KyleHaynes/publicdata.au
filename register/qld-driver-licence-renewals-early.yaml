slug: qld-driver-licence-renewals-early
title: Driver licence renewals by how early they were paid, Queensland
status: live
topics:
- roads
order: 216
temporal_start: '2013-05-01'
search_title: Queensland driver licence renewals paid early by month (Transport and Main Roads)
also_known_as:
- Driver licence renewal timing Queensland
- QLD licence renewals paid early or late
- TMR driver licence renewals monthly
keywords:
- driver licence
- licence renewals
- renewal timing
- transactions
- Queensland
faq:
- q: What is in each row?
  a: One month, one transaction type and one lead time in days, with the number of driver licence renewals
    paid that many days before the licence expired, and the band the department groups that lead time
    into, such as 03 Days Early. A late renewal is labelled separately.
summary: The monthly number of Queensland driver licence renewals by how many days before expiry they
  were paid, from the Department of Transport and Main Roads.
description: Driver licence renewals processed by the Department of Transport and Main Roads, one row
  per month, transaction type and lead time in days, with the department's band for the lead time and
  the number of renewals. The monthly counts run from May 2015. Four earlier rows, dated from May 2013,
  hold one to three renewals each. The department replaces the file with a longer one from time to time.
