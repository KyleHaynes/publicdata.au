faq:
- q: What is in each row?
  a: One month and one jurisdiction the licence came from, another state or territory or overseas, with
    the number of licences transferred to the ACT.
- q: Does this measure people moving to the ACT?
  a: It counts licence transfers, which usually follow a move. A person who arrives
    without a licence, or keeps another licence, is not counted.
summary: The number of driver licences from other states and from overseas transferred to the ACT each
  month since January 2019, by the jurisdiction they came from.
description: Monthly counts of interstate and overseas driver licences transferred to the ACT, from
  January 2019, as Access Canberra records them. Each row carries the month, the jurisdiction the licence
  was transferred from and the number transferred.
