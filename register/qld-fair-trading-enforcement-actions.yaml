faq:
- q: What is in each row?
  a: One legal or enforcement action by the Office of Fair Trading, such as a warning, an infringement
    notice, an administrative disciplinary action or a court prosecution, with the industry, the type
    of trader, the dates it began and ended, any fine, compensation, costs, penalty amount and conviction,
    the region and the sections of the law breached.
- q: What does a dot mean?
  a: The office writes a full stop where an amount or count does not apply, such as the fine for a warning.
    Those cells are null here.
- q: Are traders named?
  a: No. The office identifies each action by a reference number and the trader by type only.
summary: Each legal and enforcement action taken by the Queensland Office of Fair Trading in the newest
  published period, with industry, outcome, fines, penalties and sections breached.
description: Legal and enforcement actions taken by the Queensland Office of Fair Trading, one row per
  action, for the newest period the office has published. Each row has the action reference and type,
  the industry group, trader type, the dates initiated and finalised, fines, compensation and costs awarded,
  the conviction recorded, the office region, the penalty amount, the sections of the law breached and
  the number of breaches.
