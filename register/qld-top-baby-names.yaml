collection_description: |
  The Queensland Registry of Births, Deaths and Marriages, part of the Department of Justice, publishes yearly counts of the births and deaths registered in Queensland and the names given to babies. The registry publishes a separate file for each year.

  These tables follow the registry's newest file for each series. Each version here is one release, so the archive keeps each year as the registry replaces it. The counts are of registrations, and a birth or death can be registered in a later month or year than it happened.
faq:
- q: What is in each row?
  a: One rank from 1 to 100, with the girl name at that rank and the number of girls registered with it,
    and the boy name at that rank and its count. The registry lists names in descending order of count.
    Names that tie at the last place are all listed, so the 2025 file has 101 boy names and its last row
    has no girl name.
- q: Which year does it cover?
  a: The newest year the registry has published, which is 2025 in the first version. The registry adds
    a file each year, and this table follows the newest one. The 1960 to 2005 table holds the earlier
    years.
summary: The 100 most registered girl and boy names in Queensland in the newest year the registry has
  published, with the number of babies given each name.
description: The Queensland Registry of Births, Deaths and Marriages counts the first names given to babies
  whose births are registered in Queensland each year. This table is the newest year's top 100, one row
  per rank, with the girl name and boy name at that rank and the count of each.
