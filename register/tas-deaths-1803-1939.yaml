faq:
- q: What is in each row?
  a: One record from the deaths and burials part of the Tasmanian Names Index, with the person's name,
    the year and date of death or burial, the age, gender, place and year of registration, and the
    names of parents or spouse where the source gives them. Each row links to the record on the
    Libraries Tasmania site.
- q: Why do some cells hold two values?
  a: Where a record names a person more than once, or gives two years, the values are kept in the
    publisher's order and joined with a vertical bar.
- q: Where are the links to the scanned pages?
  a: The publisher's file nests the archive reference and the address of the scanned page inside each
    record. They are not carried here. The record address in each row leads to the same record on the
    Libraries Tasmania site, which shows the scanned page.
- q: Is it complete?
  a: The publisher describes it as people who died in Tasmania including some burial records, with
    burials for 1900 to 1939 only. Some records were compiled by the Tasmanian Family History Society,
    and the remarks say so on those rows. The series is closed.
summary: More than 205,000 death and burial records for Tasmania from 1803 to 1939 from the Tasmanian
  Names Index, one row per record, with name, date, age, gender and place of registration.
description: The deaths and burials records of the Tasmanian Names Index kept by Libraries Tasmania,
  covering 1803 to 1939, one row per index record. Each row carries the record number and address, the
  name of the person, the year and date of death, the age, gender, place and year of registration, the
  burial date and cemetery where known, and, for some records, the parents, spouse, ship of arrival,
  military rank, will number or remarks. The publisher's XML file is read one row per record.
