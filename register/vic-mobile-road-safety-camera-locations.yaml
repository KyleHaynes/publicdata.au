faq:
- q: What does each row hold?
  a: One road on which a mobile road safety camera is approved to operate, with the suburb, the
    publisher's reason code for the location and the month the location was last audited. Mobile cameras
    run from unmarked vehicles, and from 2026 trailers, at more than 2,000 approved locations.
- q: Does a row mean a camera is there today?
  a: No. The list is of approved locations. A camera may be set up at any of them at any time, and the
    publisher does not say when.
- q: What are the reason codes?
  a: Each location carries one or more of the letters A to D, which the publisher uses for the grounds the
    location was approved on. The file does not give a key to the letters, so they are kept as published.
- q: How often is it updated?
  a: The publisher releases the list about monthly, and each release becomes a version here.
summary: Every road and suburb where a mobile road safety camera is approved to operate in Victoria, with
  the reason code and audit month for each, about 2,250 locations.
description: The mobile camera location description report from the Victorian road safety camera
  program, one row per approved location with the road, suburb, reason code and the month of its last
  audit. The list is of approved locations and does not show when a camera is present.
