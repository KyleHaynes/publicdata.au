faq:
- q: What is in each row?
  a: The median weekly rent of the new tenancies that began in one Queensland suburb in one quarter for
    one dwelling type, such as a two bedroom flat or a three bedroom house, as the RTA works it out from
    the bonds lodged with it. The series runs from the September quarter 2017.
- q: Why are many medians blank?
  a: The RTA leaves a cell empty where it gives no median for a suburb, dwelling type and quarter, which
    is usually because few bonds were lodged. A cell holding an empty string is a null value here, and a
    cell the workbook leaves wholly empty gives no row.
- q: How are the dates given?
  a: As the month that ends the quarter and its year, in two columns, as the RTA's workbook heads them.
    A row for June 2026 covers tenancies that began from April to June 2026.
summary: The median weekly rent of new tenancies in each Queensland suburb by dwelling type and number of
  bedrooms, each quarter since September 2017, from the Residential Tenancies Authority.
description: The Median rents by Suburb sheet of the RTA's bond statistics workbook. Each row is one suburb,
  dwelling type and quarter, with the median weekly rent in dollars paid for new tenancies commencing in that
  quarter, as recorded from the bonds lodged with the RTA. The dwelling types include an All dwellings
  row for each suburb.
