faq:
- q: What is in each row?
  a: One location code a mobile safety camera may report from, with the street and suburb it names. The code is
    the one in the Location Code column of the camera offence and camera detection tables.
- q: Does a code mean a camera was there?
  a: No. The list names places a mobile camera can be set up. Where cameras were used is in the offence and
    detection tables.
summary: The location codes South Australia Police uses for mobile safety camera sites, each with its street and
  suburb, for reading the camera offence tables.
description: The Mobile Camera Location Codes list from South Australia Police's Expiation Notice System Data. Each
  row is one location code with the street and suburb it names. One street and suburb can carry several codes, one
  for each direction or position.
