faq:
- q: What is in each row?
  a: One obituary the State Library of Western Australia indexed, with its title, a short summary, the
    subject headings for the person, the year it was printed, the newspaper, newsletter or journal it
    appeared in, the volume, date and page, and links to the library catalogue record.
- q: Is the obituary text included?
  a: No. Each row is an index entry that points to where the obituary was printed. The full text is in
    the publication the row names, held by the library.
- q: Is the record number unique?
  a: No. A few record numbers appear on more than one row in the published file, so rows are kept as
    published and no key is declared.
- q: Will it grow?
  a: Library staff created the records between 1997 and 2014, and the file was
    last changed in January 2021. This site checks it for changes and adds a dated version if it changes.
summary: More than 10,000 obituaries printed in Western Australian newspapers, newsletters and journals
  from the mid-1800s to the early 2010s, indexed by the State Library of Western Australia, one row per
  obituary.
description: An index of obituaries in Western Australian newspapers, newsletters and journals from the
  mid-1800s to the early 2010s, created by State Library of Western Australia staff between 1997 and 2014.
  Each row carries the library's record number, the obituary's title and summary, subject headings that
  name the person with their years of birth and death, the year it was printed, the publication, the
  volume, date and page reference, and links to the entry and its source on the library catalogue.
