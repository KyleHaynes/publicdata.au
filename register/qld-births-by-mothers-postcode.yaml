faq:
- q: What is in each row?
  a: One postcode of the mother's usual residence, with the number of births registered in the newest
    year the registry has published. The registry lists postcodes from the most births to the fewest.
- q: Why are some postcodes missing?
  a: The registry publishes only counts of 5 or more, so a postcode with fewer than 5 births in the year is
    left out of its file. A missing postcode does not mean no births.
- q: Why are there New South Wales postcodes?
  a: The postcode is the mother's usual residence. A birth in Queensland to a mother who lives in northern
    New South Wales is counted under her own postcode, such as 2486 for Tweed Heads.
summary: The number of births registered in Queensland in the newest published year for each postcode
  of the mother's usual residence, where the count is 5 or more.
description: Births registered with the Queensland Registry of Births, Deaths and Marriages in the newest
  year it has published, one row per postcode of the mother's usual residence. The registry leaves out
  postcodes with fewer than 5 births. It adds a file for each year, and this table follows the newest one.
