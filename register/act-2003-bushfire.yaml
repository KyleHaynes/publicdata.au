faq:
- q: What is in each row?
  a: One shape with the publisher's description of it. One shape is the total burn area of the January
    2003 fires in the ACT, and the others are land parcels marked as uninhabitable, for property
    redevelopment, or with damage to a primary dwelling or a habitable outbuilding.
- q: Will it change?
  a: The publisher marks the data as never updated. It is the record of one event.
- q: Where is the publisher's file?
  a: The portal serves the layer as a table with each shape as text. This site reads the portal's GeoJSON
    export of the same rows, ordered by the portal's row identifier, and keeps that file as the source of
    every version.
summary: The burn area of the January 2003 Canberra bushfires and the land parcels whose homes or
  outbuildings were destroyed or damaged, one shape per area.
description: The ACT Government's spatial record of the January 2003 bushfires, from the Office of the
  Surveyor-General. It holds the total burn area and the parcels affected, each with a description of its
  status (uninhabitable, property redevelopment, habitable primary dwelling damage or habitable outbuilding
  damage). The shapes are served as GeoParquet, GeoJSON, a GeoPackage and map tiles.
