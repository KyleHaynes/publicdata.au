faq:
- q: What is in each row?
  a: Each row is one month with the publisher's count of passenger injuries for every 10,000 trips on each
    of the three modes.
- q: How far back does it go?
  a: At review the file held about 30 months, starting in late 2023. Each fetch here is kept as a version,
    so a month the publisher later drops stays in an earlier version.
summary: Passenger injuries per 10,000 trips on SEQ bus, tram and Citytrain services, by month.
