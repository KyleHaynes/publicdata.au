collection_description: |
  The Queensland Government publishes the production returns and reserves reports that holders of petroleum and gas permits lodge with the department responsible for resources. Production is reported each half year for every field and reservoir unit within a permit. Reserves and contingent resources are reported each year for every field.

  Both tables here are the publisher's cleaned compilations, in which field names and product types have been standardised and duplicate reports removed. The publisher notes the data may be revised as further returns are lodged.
