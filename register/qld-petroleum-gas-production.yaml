faq:
- q: What is in each row?
  a: Each row is one half-year reporting period, one permit and one field and reservoir unit, with the permit holder and basin, the volumes of gas, oil, LPG, condensate and water produced and used, and the number of wells producing.
- q: What period does it cover?
  a: The publisher's cleaned table, which is the one kept here, covers 2025. Its as-submitted table for 2020 to 2024 is under review by the publisher and is not included.
- q: What units are the volumes in?
  a: Gas is in million cubic metres, oil and condensate in millions of barrels, LPG in kilotonnes and water in megalitres, as the column names say.
summary: Gas, oil, LPG, condensate and water produced from each Queensland petroleum and gas field and permit, by half year.
description: One row per half-year reporting period, petroleum permit and field and reservoir unit, from the publisher's cleaned compilation of production returns. Each row gives the production type (coal seam gas or conventional), the authorised holder, the basin and stratigraphic unit, the volumes of raw gas, gas flared and vented, gas used, oil, LPG, condensate and water, and the number of wells on production. This is the pg_prod_cleaned sheet of the petroleum and gas production statistics workbook.
