faq:
- q: What is in each row?
  a: One licence class held by one licensee, with the licence number, the licensee's name, ACN or ABN
    where given, business address, whether the licensee is an individual or a company, the financial category
    and the licence grade and class, such as a trade contractor licence for plumbing and drainage. A licensee
    with several classes has several rows under one licence number.
- q: Are cancelled licences included?
  a: No. The commission includes active licences and suspended ones, and leaves out cancelled licences.
    It points readers to its online licence search for the status of an individual licensee on a given
    day.
- q: How current is it?
  a: The commission states the file is current as at the date it was generated, 23 September 2026 in the
    first version here, and replaces it from time to time.
summary: Every active and suspended licence on the Queensland Building and Construction Commission register,
  one row per licence class, with the licensee's name, ABN or ACN, business address and licence grade.
description: The Queensland Building and Construction Commission register of licensed builders, trade
  contractors, building designers, nominee and site supervisors and occupational licence holders, one
  row per licence class held. Each row has the licence number, licensee name, ACN, ABN and business address,
  the licence type, financial category, licence grade and licence class. Cancelled licences are left out.
