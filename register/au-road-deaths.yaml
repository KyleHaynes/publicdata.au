faq:
- q: Does this include the road toll for the current year?
  a: Yes. The database is updated monthly and runs to the latest month the publisher has released. Deaths
    from recent months are preliminary and the publisher revises them, so a later version can change a
    recent count.
- q: Why do some crashes appear on more than one row?
  a: Each row is one person killed. A crash that killed three people appears as three rows with the same
    crash_id. Count distinct crash_id values to count fatal crashes.
- q: Why do many rows say Unknown for remoteness area, council area and road type?
  a: The publisher codes remoteness area, SA4, council area and road type only for recent years. Earlier
    rows carry Unknown in those columns, which is the publisher's own value and is kept as published.
summary: Every person killed in a road crash in Australia since 1989, one row per death, with state,
  date, time, road user, age, gender, speed limit and vehicles involved.
description: The Australian Road Deaths Database lists each road crash death reported by police to the
  state and territory road safety authorities since January 1989. Each row is one person killed, with
  the crash date and time, state, crash type, the vehicles involved, the speed limit, the road user,
  gender and age, and for recent years the remoteness area, SA4, council area and road type.
