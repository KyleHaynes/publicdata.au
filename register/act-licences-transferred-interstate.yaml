faq:
- q: What is in each row?
  a: One month, with the number of ACT driver licences transferred to another Australian state or
    territory in that month.
- q: Does this measure people leaving the ACT?
  a: It counts licence transfers, which usually follow a move. A person who leaves
    without a licence, or does not transfer it, is not counted.
summary: The number of ACT driver licences transferred to another state or territory each month since
