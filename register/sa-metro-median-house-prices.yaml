faq:
- q: What is in each row?
  a: One figure for one suburb of metropolitan Adelaide, with its council area. The measure column names the
    figure as the publisher heads it, either Sales, the number of house sales in the quarter, or Median, the
    median sale price in dollars, followed by the quarter, such as Sales 2Q 2026.
- q: Which quarters does the table cover?
  a: The newest quarterly file, which compares one quarter with the same quarter a year earlier, 2Q 2025 and
    2Q 2026 at the first version. The publisher adds a file each quarter, and each becomes a version here. The
    files back to 2015 stay on the portal.
- q: Why is the median change column missing?
  a: The publisher's Median Change column is the percentage change between the two medians, worked out from
    figures already in the table, so it is left out.
- q: Why do some suburbs have no figure?
  a: The publisher leaves the cells blank for a suburb with no house sales in the quarter, and a suburb with no
    figure in either quarter has no rows here.
summary: The number of house sales and the median sale price in each suburb of metropolitan Adelaide for the
  newest quarter and the same quarter a year earlier. Updated quarterly.
description: Quarterly median house sale prices for metropolitan Adelaide by suburb from the Department for
