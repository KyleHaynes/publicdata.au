faq:
- q: What is in each row?
  a: Each row is one crocodile sighting reported to the department in January to March 2017. It gives the date,
    the place and coordinates, the species, the number and estimated size of the crocodiles, what the animal
    was doing, nearby public use and food sources, whether the department declared it a crocodile of concern,
    and the outcome.
- q: Why are so many cells n/a or no data?
  a: The publisher writes n/a where a question did not apply and no data where nothing was recorded. Several
    questions were added or dropped part way through, as the publisher's legend explains, so they are blank
    for some years. These words are kept as published, except in the coordinate columns where no data is null.
- q: Is every sighting a confirmed crocodile?
  a: No. Most rows are reports from the public. The confirmed by a departmental officer column says whether
    an officer or delegate confirmed the animal or its presence.
- q: Why does n/a appear in the middle of sentences?
  a: The publisher's file has n/a wherever the free text once read off, so 100m offshore reads 100m
    n/ashore. The text is kept as published.
summary: Each crocodile sighting reported to the Queensland Government through CrocWatch in January to March
  2017, with location, size, behaviour and outcome.
description: 'One row per crocodile sighting reported to the Queensland environment department in January to
  March 2017. Each row gives the year, the department''s reference number, the date sighted and the date the
  department was contacted, whether the animal was declared a crocodile of concern and whether that was resolved,
  the management plan zone and council area, the species, the number of crocodiles and the estimated size of
  the largest, the place and its latitude and longitude, the habitat, nearby public use, the animal''s behaviour,
  nearby food sources and the outcome.


  The publisher''s column names were shortened to snake_case names. The original header of every column is
  kept in schema.json.

  The publisher released this period as its own file, with the same questions as the 2010 to 2015 file, and
  has not added a later one.

  '
