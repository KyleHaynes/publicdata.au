faq:
- q: What is in each row?
  a: One public hospital with its name, street address, suburb, postcode and type, whether it has an emergency department or an emergency service, and its location.
- q: Which coordinates are these?
  a: Longitude and latitude in GDA2020 (EPSG:7844), from the GDA2020 file the publisher ships beside a GDA94 copy.
