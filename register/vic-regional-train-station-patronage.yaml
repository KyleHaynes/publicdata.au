faq:
- q: What does each row hold?
  a: One regional train station for one financial year, with its stop id, name, coordinates and the
    estimated number of station entries in the year.
- q: How are the figures estimated?
  a: At myki stations they come from ticketing data scaled by a transaction rate from conductor and
    barrier counts, and elsewhere from conductor counts. The publisher rounds each to the nearest 50 and
    rounds anything under 50 up to 50. Southern Cross counts only the gates to platforms 1 to 8.
- q: Which years are here?
  a: Each version is the newest financial year the department has released, starting with 2024-25. The
    portal also lists earlier years back to 2018-19 as separate files.
summary: Estimated station entries at each Victorian regional train station for the financial year, rounded
  to the nearest 50, with each station's coordinates.
description: Annual regional train station patronage from the Department of Transport and Planning, one
  row per V/Line station with its stop id, name, coordinates and total station entries for the financial
  year. Estimates come from myki data and conductor counts and are rounded to the nearest 50.
