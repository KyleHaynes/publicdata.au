faq:
- q: What is in each row?
  a: One NSW government school, with its code, name, address and contacts, the level of schooling and
    the kinds of classes it offers, its latest full-time equivalent enrolment, the share of Aboriginal
    and Torres Strait Islander students and of students from a language background other than English,
    the areas it falls in and its latitude and longitude.
- q: What does a null percentage mean?
  a: The Department writes np where five or fewer students are counted, so the percentage is not published.
    Those cells are null here with a suppressed flag.
- q: Are the fields all current?
  a: The file carries the date it was extracted, but the fields come from different collections. Enrolments
    are as at August of the latest year, language background as at March, and the index of disadvantage
    as at May, each updated once a year.
- q: Why is the ICSEA value not here?
  a: The Department's file carries each school's ICSEA value, which it sources from ACARA. ACARA's terms
    for My School allow its content to be reproduced for non-commercial educational use only, so the
    column is left out until the Department confirms that its CC BY 4.0 licence covers it. Every other
    column is published.
summary: Every NSW government school with its address, contacts, school type, latest enrolment, student
  background shares, electorates, council area and coordinates. Updated monthly.
description: The NSW public schools master dataset from the NSW Department of Education, one row per government
  school. It holds the school code and name, street address, phone, email and website, the level of schooling,
  selective, opportunity class, speciality and distance education flags, the latest FTE enrolment, the
  per cent of Aboriginal and Torres Strait Islander students and of students with a language background
  other than English, the family occupation and education index, the date the school opened, and the
  council area, state and federal electorates, departmental regions, health district, remoteness and
  latitude and longitude.
omit:
  ICSEA_value: ACARA's My School terms allow ICSEA values to be reproduced for non-commercial educational
    use only, and the Department has been asked whether its CC BY 4.0 licence covers them.
source_withheld: The ICSEA value column is left out because ACARA licenses ICSEA for non-commercial
  educational use only, and the Department has been asked whether its CC BY 4.0 licence covers it. The
  publisher's own file includes that column, so it is not kept beside each version.
