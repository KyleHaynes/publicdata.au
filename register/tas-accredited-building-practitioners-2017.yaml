faq:
- q: What is in each row?
  a: One accreditation of a building practitioner held on 10 May 2017, with the accreditation number,
    the practitioner's gender, suburb, state and postcode, the publisher's region code and the date
    the accreditation expires. A practitioner with more than one address has a row for each, under
    one accreditation number.
- q: What do the region codes mean?
  a: The publisher gives the code as a number from 1 to 4 and does not say which region each number
    names. In the data, 4 is on every address outside Tasmania. Hobart addresses carry 1, Launceston
    addresses 2, and Burnie and Devonport addresses 3.
- q: Is it current?
  a: No. It is a single extract from the Department of Justice occupational licensing database as at
    10 May 2017, and the series is closed. The publisher's resource is named for electrical, plumbing
    and gas fitting licences, and its description and contents are of accredited building
    practitioners. Eleven rows hold only a postcode, as published.
- q: Does the postcode match the suburb?
  a: Often it does not, as published. None of the 45 Devonport rows carries Devonport's postcode 7310,
    and 8 of the 54 Launceston rows carry 7250. The suburb and the region code agree with each other, so
    the suburb is the better guide to where a practitioner is.
summary: The building practitioners accredited in Tasmania on 10 May 2017, one row per accreditation and
  address, with accreditation number, gender, suburb, postcode and expiry date.
description: A point in time extract of accredited building practitioners from the Tasmanian Department
  of Justice occupational licensing database, as at 10 May 2017. Each row carries the accreditation
  number, gender, suburb, state and postcode, the publisher's region code and the accreditation expiry
  date. Practitioners based in other states who hold a Tasmanian accreditation are included.
