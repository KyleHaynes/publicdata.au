faq:
- q: What is in each row?
  a: One suburb or locality of Victoria, with Geoscape's identifiers for the polygon and the locality, the
    date the record was created, the locality's name, its class, such as Gazetted Locality, and the state.
    Its shape is in the GeoParquet, GeoJSON, GeoPackage and PMTiles files. A locality made of separate
    pieces, such as one with islands, has a row for each piece.
- q: How do these differ from the ABS suburbs and localities?
  a: These follow the official locality boundaries in the Victorian cadastre and change each quarter as
    localities are named or moved. The ABS Suburbs and Localities layer is built from mesh blocks for one
    census, so its edges differ from these.
- q: Can I use it for a commercial product?
  a: The Commonwealth released Administrative Boundaries under CC BY 4.0. The release notes ask that use is
    consistent with the Australian Privacy Principles and that adapted material carry the words in the
    attribution here, which every file carries. Geoscape Australia has not endorsed this site.
summary: The current boundary of every suburb and locality in Victoria, with its name and class, from
  Geoscape Administrative Boundaries, updated each quarter.
description: The Victoria suburb and locality layer of Geoscape Administrative Boundaries, read from the
  GDA2020 Esri shapefile release on data.gov.au. Each row is one locality polygon with Geoscape's polygon and
  locality identifiers, its creation date, name, class and state. The newest quarterly release is followed.
