faq:
- q: What is in each row?
  a: One offence on an expiation notice or formal caution written by a police officer, with the incident date and
    time, the offence code and description, the notice and offence status, the police district, the vehicle, the
    speed and limit, the blood alcohol reading, and the penalty, levy, corporate fee and total.
- q: Why is the speed or blood alcohol 0?
  a: The publisher writes 0 where no speed was recorded or no breath test was conducted. The value is kept as
    published.
- q: Which period does the table cover?
  a: The financial year of the newest report, 2026-27 at the first version, which the publisher replaces as the
    year goes on. Each new file becomes a version here.
- q: Why are the amounts text?
  a: The publisher writes each amount with a dollar sign and a thousands separator, such as $1,002. The amounts
    are kept as published.
summary: Every offence on an expiation notice or caution written by a South Australia Police officer in the newest
  financial year, one row per offence with its status, vehicle and penalty.
description: The Manual Notice Offence Report from South Australia Police's Expiation Notice Branch, covering
  notices and cautions written by officers rather than raised from cameras. Each row is one offence, with the notice
  type, the notice and offence status and any withdrawal reason, the incident date and time, the offence code and
  description, the issue date, the police district, the vehicle and the states of licence and registration, the
  speed and limit, the blood alcohol content and the amounts. Unlike the camera report it carries no event or notice
  identifier.
