faq:
- q: What is in each row?
  a: One ABS Statistical Area 2 in one month, with the number of venues approved and operating, the number of gaming machines approved and operating, and the metered win, which is the amount players lost on the machines.
- q: Why is the metered win blank for many areas?
  a: The publisher marks the metered win Not Released for an area in a month when it does not publish the figure. It is kept as a null with a suppressed flag. The venue and machine counts are still given.
- q: Which SA2 boundaries are used?
  a: The publisher says it uses the areas of the Australian Statistical Geography Standard 2011. The areas are named, with no code.
summary: Monthly counts of gaming venues and machines in each Queensland SA2 area since October 2016, with the amount players lost where the publisher releases it.
description: One row per ABS Statistical Area 2 per month from October 2016, with the venues approved and operating electronic gaming machines, the machines approved and operating on the last day of the month, and the metered win in dollars. The metered win is withheld for many areas and is kept as suppressed. Areas are ASGS 2011 SA2 names.
