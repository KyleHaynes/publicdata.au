collection_description: |
  The Office of Liquor and Gaming Regulation (OLGR) publishes monthly figures on electronic gaming machines in Queensland hotels and clubs and on what players spend across every form of gambling.

  The release is seven tables. Two count venues, machines and metered win by ABS area, at SA2 and SA4 level. Three give the same counts for hotels, for clubs and for the whole state. One gives player expenditure by gambling stream, and one counts venues by how many machines they operate.
