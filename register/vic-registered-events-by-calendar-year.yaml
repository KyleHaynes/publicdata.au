faq:
- q: What does each row hold?
  a: The number of births, of marriages or of deaths the registry registered in one calendar year. An
    event is counted in the year the registry registers it, which may differ from the year it happened.
- q: Why does a year's count differ from other published figures?
  a: Counts by registration date can run ahead of or behind counts by the date of the event, for example
    when registrations are delayed. Other agencies, such as the ABS, may count by the date of the event.
