faq:
- q: What is in each row?
  a: One category of one breakdown, such as aluminium in the material breakdown or 5000 in the postcode breakdown,
    with the number of new boat registrations in the financial year and the number of boats registered at its end.
    The breakdowns are the sheets of the publisher's workbook, from hull type and make to engine, length, fee group,
    postcode and where the boat is used.
- q: What are the Totals and RBA011 rows?
  a: Each breakdown ends with the publisher's total row and a footer row naming the report and page. Both are kept
    as published, and the footer's page marker is a null.
- q: Why are the percentage columns missing?
  a: The publisher's percentage columns divide each count by the total, so they are left out.
- q: Which year does the table cover?
  a: The newest financial year, 2025-26 at the first version, with boats registered at 30 June 2026. The publisher
    adds a workbook each July, and each becomes a version here.
summary: The number of new boat registrations in the newest financial year and of boats registered at its end in
  South Australia, by hull, material, length, engine, fee group, postcode and place of use. Updated yearly.
description: The Analysis of Registered Motor Boats workbook (RBA011) from the Department for Infrastructure and
  Transport. Each sheet breaks the boats down one way, and each row here is one category of one sheet, with the
  number of new boat registrations between 1 July and 30 June and the number of registrations current at 30 June.
