faq:
- q: What does each row hold?
  a: Each row is one kind of enforcement action, with the number Consumer Affairs Victoria finalised
    in each financial year from 2012-13 to 2018-19. The kinds are prosecutions finalised, parties to
    civil proceedings and parties who signed enforceable undertakings.
- q: Is the series still updated?
  a: The publisher's file ends at 2018-19. A new year would arrive as a new column, which would be held
    for review before it is published.
summary: The number of prosecutions, civil proceedings and enforceable undertakings Consumer Affairs
  Victoria finalised in each financial year from 2012-13 to 2018-19.
description: Enforcement outcomes from Consumer Affairs Victoria, one row per kind of action with a count
  for each financial year from 2012-13 to 2018-19. Prosecutions and civil proceedings are counted when
  finalised, and enforceable undertakings by the parties who signed them.
