faq:
- q: What is in each row?
  a: 'Each row is one property with a registered regulated pool: its lot and plan, street address, suburb,
    postcode, the number of pools, the local government area and whether the pool is shared, such as in
    a unit complex.'
- q: How current is it?
  a: The publisher's file is current as at 1 August 2024. Pool owners are responsible for registering
    their pool correctly, and the publisher asks owners to contact QBCC to correct errors.
summary: Every Queensland property with a registered regulated swimming pool, by address and lot and plan,
  with its number of pools.
description: One row per property on the Queensland pool safety register, giving the lot and plan, unit
  and street address, suburb, postcode, number of pools, local government area and whether the pool is
  a shared pool. The file is current as at 1 August 2024. Addresses are kept as entered, so capitalisation
  and street type abbreviations vary.
