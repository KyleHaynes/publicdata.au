collection_search_title: Queensland pool safety register
collection_description: 'The Queensland Building and Construction Commission (QBCC) keeps the pool safety
  register under the state''s pool safety laws. Every property with a regulated swimming pool must be
  on it, and a pool safety certificate is needed before a property with a pool is sold or leased.


  The publisher releases three tables: the properties with registered pools, the properties that have
  been issued pool safety certificates and the licensed pool safety inspectors. Each is a snapshot current
  at the date the publisher gives, which for these files is 1 August 2024. The publisher says the content
  of the registers is being reviewed.'
