faq:
- q: What is in each row?
  a: Each row is one bounded locality, which in a city is a suburb, with its official name, locality code, the local government area it is in, its area in square kilometres and its boundary as a polygon.
- q: How do these differ from the ABS suburbs and localities?
  a: These are the Queensland Government's official locality names and boundaries used for addressing, kept up to date as localities are named or changed. The ABS layer is a statistical approximation of them built for one census.
summary: The official boundary, name and code of every suburb and locality in Queensland, with its local government area.
description: The spatial representation of the bounded localities of Queensland, including suburbs, which are the official locality names and boundaries used for addressing. Each feature carries the locality name, its code, its local government area and its area in square kilometres. The layer is read from the Queensland Government's administrative boundaries map service.
