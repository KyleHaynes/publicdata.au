faq:
- q: What does each row hold?
  a: The neighbourhood zone of one government primary school for the 2027 school year, with the school
    and campus name and the department's code, as a shape in the GeoParquet, GeoJSON, GeoPackage and
    PMTiles files. A child whose permanent address is inside the zone has a right to enrol at that school.
- q: Does every government school have a zone?
  a: No. The zones are for designated neighbourhood schools. Specialist schools, selective entry schools,
    English language schools and community schools have their own enrolment criteria and no zone.
- q: Can a child enrol outside their zone?
  a: Yes. The publisher states that a zone does not restrict a family's choice to seek a place at another
    government school, and that a school outside the zone may take the child if it has room.
- q: Is this the zone for this year?
  a: It is the zone the department published in March 2026 for enrolments starting in 2027. Each year's
    zones are a separate release, and the layer here follows the 2027 release.
summary: The 2027 neighbourhood zone of each of about 1,270 Victorian government primary schools, one
  shape per school, from the Department of Education.
description: Victorian Government School Zones for 2027, primary layer. Each row is the zone of one
  designated neighbourhood government primary school, Prep to Year 6, with the school, campus and
  department code. The release also holds secondary zones for each year level and standalone junior,
  senior and single sex zones, and the Year 7 layer is served as its own dataset.
