faq:
- q: What is in each row?
  a: One day, one type of new registration transaction, such as a light vehicle or a trailer, and one
    service channel, with the number of new registrations processed. Channels include customer service
    centres, motor dealers, online services and Queensland Government Agent and police offices.
- q: Does it count every new vehicle sold?
  a: It counts the new registration transactions the department processed, trailers included. A registration
    is new to the Queensland register, and the file does not say whether the vehicle was new or used.
summary: The daily number of new vehicle registrations processed by the Department of Transport and Main
  Roads in Queensland since January 2016, by transaction type and service channel.
description: New vehicle registration transactions processed by the Department of Transport and Main Roads,
  one row per day, transaction type and service channel, from 2 January 2016. The department replaces
  the file with a longer one from time to time.
