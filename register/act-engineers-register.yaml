collection_description: |
  Access Canberra keeps public registers of the people it licenses or registers to work in the ACT.

  The collection holds two tables. The engineers register lists every active professional engineer registration under the Professional Engineers Act 2023. The automatic mutual recognition register lists the people working in the ACT on a licence from another state.
