faq:
- q: What is in each row?
  a: One active registration of a professional engineer in the ACT, with the registration identifier, the
    engineer's name, the start and end of the registration period, its status, the areas of engineering
    it covers and any condition on it.
- q: Who is not listed?
  a: Engineers working in the ACT under the Automatic Mutual Recognition scheme are not in this register.
    They are in the automatic mutual recognition register in this collection.
summary: Every active professional engineer registration in the ACT under the Professional Engineers Act
  2023, one row per registration with the engineer's name, period and areas of engineering.
description: The public register of professional engineers Access Canberra keeps under the Professional
  Engineers Act 2023. Each row carries the registration identifier, the name, the start and end dates of
  the registration period, the status, the class of engineering (such as civil or structural, with several
  separated by semicolons), any condition and the verification status.
