faq:
- q: What does each row hold?
  a: One Victorian postcode, the land transfer duty the State Revenue Office collected on property
    transfers there in the 2021-22 financial year, in dollars, and the number of dutiable transactions.
- q: Is land transfer duty the same as stamp duty?
  a: Yes. Land transfer duty is the Victorian name for the stamp duty paid when land or property changes
    hands.
- q: Where are other years?
  a: The State Revenue Office publishes each financial year as its own dataset, from 2013-14 to 2021-22,
    and their columns differ from year to year. This entry holds 2021-22, the latest year published.
