faq:
- q: What is in each row?
  a: An amount the department spent on maintenance or modifications to its social housing in one suburb and
    postcode, for one property type, in one financial year. Each row also names the council area and the state
    and federal electorates.
- q: Which year does a version cover?
  a: The publisher adds one file for each financial year, and this entry follows the newest. The file holds
    no year column, so the year is the one named in the file's title on the portal. Each year is kept here
    as its own version.
- q: Why do some suburbs have two rows for the same property type?
  a: The file gives some suburb, property type and category combinations more than once with different amounts,
    and does not say why. The rows are kept as published, so add them to get a total.
summary: What the Queensland Government spent maintaining and modifying its social housing in each suburb,
  by property type, in the latest financial year.
description: Spending on maintenance and modifications of government owned social housing in Queensland for
  one financial year, one row per suburb, postcode, property type and category, with the total invoice cost
  in dollars and the council area, state electorate and federal electorate. The publisher's file opens with
  a line giving the year's total, which is left out here.
