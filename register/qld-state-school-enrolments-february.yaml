faq:
- q: What is in each row?
  a: Each row is one state school, one year and one year level, with the number of full-time students enrolled
    at the February census, and the school's region, council area, remoteness area, category and type.
- q: Why does a school have enrolments before it opened?
  a: The publisher combined the history of schools that were amalgamated, using the school structure as at
    February 2019, so a school created by amalgamation can show enrolments for earlier years.
- q: Why is there a small Year 12 group in 2019?
  a: A half cohort entered Prep in 2007 when the school starting age changed, and that cohort was in Year 12
    in 2019.
summary: Full-time enrolments at each Queensland state school by year level at the February census, 2015 to
  2019.
description: One row per Queensland state school, collection year and year level from February 2015 to February
  2019, with the number of full-time students enrolled at the February census. Each row also gives the school
  code, the Department of Education region, local government area, remoteness area, school category and school
  type. The school structure is as at February 2019, with amalgamated schools' history combined. This is Table
  2 of the publisher's workbook.
