faq:
- q: What is in each row?
  a: The number of vehicles registered in South Australia at 30 June that share one make, body type, year of
    manufacture and colour.
- q: Why do so many vehicles date from 1900?
  a: The publisher appears to use 1900 where the year of manufacture is not known. That year holds far more
    vehicles than any year before the 1920s, most of them trailers with no make listed or a homemade make. The
    chart and the sample leave it out.
- q: Which date does the table cover?
  a: The newest file, vehicles registered at 30 June 2026 at the first version. The publisher adds a file each
    July, and each becomes a version here.
summary: The number of vehicles registered in South Australia at 30 June, counted by make, body type, year of
  manufacture and colour. Updated yearly.
description: Registered vehicles by colour from the Department for Infrastructure and Transport, which refers to the
  report as TRLB07. Each row is one vehicle make, body type, year of manufacture and colour, with the count of
  registered vehicles that share them.
