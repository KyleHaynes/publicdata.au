collection_description: |
  Queensland Government agencies publish a contract disclosure report listing each contract worth $10,000 or more that they award, with the supplier, value, award date and procurement method. Each agency publishes its own report on the Queensland open data portal, and most add a file for each financial year.

  These tables cover four agencies' current reports. The columns follow the government's disclosure template, with small differences between agencies that are kept as each publishes them.
faq:
- q: What is in each row?
  a: One contract the Department of Transport and Main Roads awarded or varied, with its reference, description,
    award date, value, supplier name, ABN and postcode, whether it was varied, the procurement method
    and the extra fields for large contracts. The supplier ABN is blank in almost every row.
- q: Why do some award dates fall years before the report's financial year?
  a: Those rows are marked as varied. The report lists older contracts that the department varied during
    the year under their original award date.
- q: What is a contract disclosure report?
  a: Queensland Government agencies must publish details of each contract they award worth $10,000 or
    more, including GST. Contracts over $500,000 carry extra fields such as the form of contract, evaluation
    criteria and deliverables, so those columns are blank for smaller contracts.
- q: Which year does it cover?
  a: The newest financial year file the department has published, 2026-27 in the first version here. The
    department adds a file each year and updates it during the year, and this table follows the newest.
summary: Every contract worth $10,000 or more that the Queensland Department of Transport and Main Roads
  awarded or varied in the current financial year, with supplier, value, date and procurement method.
description: The contract disclosure report of the Department of Transport and Main Roads for the newest
  financial year, one row per contract, with the reference, category, parent arrangement, description,
  award date, value, supplier ABN, name and postcode, variation, confidentiality, procurement method,
  limited tender reason and the fields required for contracts over $500,000.
