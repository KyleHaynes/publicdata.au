faq:
- q: Are the factor flags complete for recent crashes?
  a: No. The publisher can only assign contributing factors to a crash once the investigation is finalised,
    so recent crashes can be missing a factor and the counts with a factor flag rise in later releases.
    The number of crashes in each year matches the crash locations table.
summary: Crash and casualty counts by year, police region and severity, split by whether drink driving,
  speed, driver fatigue or a defective vehicle was involved.
description: Aggregate counts of reported Queensland road crashes from 1 January 2001 by contributing
  factor. Each row is one combination of year, police region, crash severity and four yes or no factor
  flags. The publisher can only supply full contributing factors for finalised crashes, so the factor
  flags for the most recent months are less complete than they will be. Property damage only crashes stop
  after 31 December 2010.
