faq:
- q: What is in each row?
  a: One reservoir on the last business day of the month, with its capacity, the volume held that day and on the
    same day a year earlier, the average volume for the month, all in megalitres, and its location. The list
    holds the reservoirs supplying metropolitan Adelaide and also Middle River Reservoir on Kangaroo Island.
- q: Which month does the table cover?
  a: The newest month the publisher has released, August 2026 at the first version. SA Water adds a file each month,
    and each becomes a version here. The files from May 2018 stay on the portal.
- q: Why might a new month fail to load?
  a: The publisher has renamed the reservoir name column between files, so a month whose header differs is held
    for review before it is published.
summary: The capacity and volume of each reservoir supplying metropolitan Adelaide, and of Middle River Reservoir on
  Kangaroo Island, on the last business day of the newest month, with the volume a year earlier and the month's average. Updated monthly.
description: Reservoir Volumes from SA Water. The publisher captures the volume of each reservoir daily and releases
  the reading from the last business day of each month. Each row is one reservoir with its capacity, the volume that
  day, the volume on the same day a year earlier and the average volume for the month in megalitres, and its
  latitude and longitude.
