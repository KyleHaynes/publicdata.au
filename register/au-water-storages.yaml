faq:
- q: What is this list?
  a: Every station that reports a storage volume to the Bureau of Meteorology's Water Data Online, about 570
    stations on dams, weirs and reservoirs, with the owner as the Bureau labels it, the state, coordinates,
    the full and dead storage volumes in megalitres and the full and dead storage levels in metres where the
    owner supplied them, and the regulation clause the data is reported under. A large dam can have more
    than one station, as Lake Argyle has several.
- q: Why do some storages have no capacity?
  a: About a third of the stations carry no full storage volume in the Bureau's attributes, mostly small
    or minor storages. The cells are null. The daily volumes for every station are in the companion dataset
    of daily water storage levels.
summary: The dams, weirs and reservoirs whose storage volumes the Bureau of Meteorology publishes, with owner,
  state, coordinates and full storage volume. About 570 storages, updated weekly.
description: The stations of the Bureau of Meteorology's Water Data Online that report the Storage Volume
  parameter, one row per storage, with the Bureau's station number and name, the data owner and its state or
  territory, latitude and longitude, the full and dead storage volumes and levels the owner supplied, and the
  Water Regulations 2008 clause the reporting falls under.
