collection_description: |
  The Rental Deposit Authority in the Tasmanian Department of Justice holds the bond on residential
  tenancies in Tasmania. The department published one month of its bond records, November 2016, as two
  tables. One lists the bonds lodged in the month and the other the bonds closed in the
  month, each with the suburb, bond amount, weekly rent, dates, bedrooms, dwelling type and length of
  tenancy. The department has published no later month on the portal.
