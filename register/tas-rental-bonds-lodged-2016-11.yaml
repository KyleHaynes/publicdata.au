faq:
- q: What is in each row?
  a: One bond lodged in November 2016, with the suburb and postcode of the rented home, the
    bond amount and weekly rent in dollars, the dates the bond was lodged and made active, the number of
    bedrooms, the dwelling type and the length of the tenancy in months.
- q: Why is the number of bedrooms blank on some rows?
  a: The publisher leaves it blank where it was not recorded, on 260 of the 1,368 bonds. The dwelling type
    reads UNSPECIFIED on 207 bonds, and 150 of those also have no bedroom count.
- q: Is there a later month?
  a: No. The department published November 2016 only. The series is closed.
summary: Every Tasmanian rental bond lodged in November 2016, one row per bond, with suburb,
  bond amount, weekly rent, bedrooms, dwelling type and tenancy length.
description: The rental bonds lodged with the Rental Deposit Authority in November 2016, one row per
  bond. The publisher's sheet is named for active bonds, and 82 of them became active in early December.
  Each row carries the suburb, state and postcode of the rented home, the bond
  amount and weekly rent in dollars, the bond lodgement and activation dates, the number of bedrooms,
  the dwelling or premises type, and the length of the tenancy in months.
