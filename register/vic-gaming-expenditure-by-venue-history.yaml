faq:
- q: What does each row hold?
  a: One hotel or club venue with gaming machines and one financial year from 2008-09 to 2021-22, with
    the venue's region, council area and type and the amount players lost on its machines in that year, in
    dollars. Each sheet of the publisher's workbook is one year, and its name is kept in the financial
    year column.
- q: What is in the publisher's file that is not here?
  a: The workbook also gives each venue's number of machines, under a column whose name changes every
    year, so it is left out. The row with no venue name is the publisher's total for the state. Each sheet
    ends with notes on venues that changed name or closed, which are not rows of data. Venues closed
    from March 2020 under the COVID-19 restrictions, so 2019-20 to 2021-22 are lower.
summary: The amount players lost on poker machines at every Victorian hotel and club venue in each
  financial year from 2008-09 to 2021-22, with the venue's council area and type.
description: Historical gaming expenditure by venue from the Victorian Gambling and Casino Control
  Commission. Each row is one gaming venue and one financial year, with the venue name, metro or country
  region, local government area, venue type and electronic gaming machine expenditure in dollars. The
  latest years are in the companion dataset of current expenditure by venue.
