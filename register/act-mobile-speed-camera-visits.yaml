faq:
- q: What is in each row?
  a: One stay of a mobile speed camera at one site on one day, with the hours it was there, the site and
    street, the number of vehicles it checked, the posted speed limit, and the highest and average speed
    of the vehicles that were fined.
- q: Why are the highest and average speeds 0 in many rows?
  a: The publisher states that highest and average speeds from 18 May 2018 are not displayed, and many
    rows from then on show 0 for both. The zeros are kept as published.
- q: Where are the camera sites?
  a: The camera location code matches the ACT traffic camera locations table in this collection, which
    gives each site's latitude and longitude.
summary: Every visit of an ACT mobile speed camera since July 2016, one row per stay, with the site, hours
  on site, vehicles checked and posted speed limit.
description: The visits Access Canberra's mobile speed cameras make to sites around the ACT, from 1 July
  2016. Each row carries the date, the time at the site in hours, a description of the site, the camera
  location code, the street, the number of vehicles checked, the highest and average speed of the vehicles
  that were fined and the posted speed limit.
