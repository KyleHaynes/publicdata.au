faq:
- q: What is in the homelessness services dataset?
  a: 'Every figure in the section 19 attachment tables: government expenditure on homelessness services,
    clients and support periods by age, sex, Indigenous status and remoteness, the reasons people seek
    help, unmet demand, and outcomes such as clients achieving independent housing, each for every state
    and territory and for Australia. The service figures cover the financial years 2020-21 to 2024-25,
    and the Census estimates of people who are homeless are for 2011, 2016 and 2021.'
- q: What is the Report on Government Services?
  a: The Productivity Commission's yearly report on the equity, effectiveness and efficiency of government
    services, compiled for the Council of Australian Governments and its successors since 1995. Each section's
    dataset holds every figure in the section's attachment tables in one long table, with a column for
    each state and territory and for Australia.
- q: What do np, na and .. mean?
  a: The Commission writes np where a figure is not published, na where it is not available and .. where
    it is not applicable. Not published is kept here as a null with a suppressed flag on the row; the
    other two are kept as plain nulls.
- q: Where do the figures come from?
  a: Each row names its data source, usually a state or territory government, the ABS or the Australian
    Institute of Health and Welfare, as the Commission states it. The Commission publishes the dataset
    under CC BY 4.0 with third party content excepted, and the source column is how that content is identified.
summary: 'Every figure in the Report on Government Services section on homelessness services, by state
  and territory: expenditure, clients, support periods, unmet demand and outcomes from 2020-21 to 2024-25,
  and Census estimates of homelessness for 2011, 2016 and 2021. Updated yearly.'
