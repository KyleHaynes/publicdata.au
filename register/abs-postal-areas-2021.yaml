faq:
- q: What is in each row?
  a: One of the Postal Areas, the ABS's approximation of Australia Post's postcodes from mesh blocks, with its code,
    name and the other columns the ABS publishes, and its shape in the GeoParquet, GeoJSON, GeoPackage and PMTiles
    files. The CSV, Excel and other table files hold the columns without the shape.
- q: What coordinate system are the shapes in?
  a: GDA2020 (EPSG:7844), the file the ABS publishes in that datum. GDA2020 differs from WGS84 by well under a metre,
    so web maps can use it as it is.
- q: How does this join to other datasets here?
  a: Each dataset here with point coordinates carries the code and name of the area each point falls in, matched
    by location against this layer. Those columns name the layer and its version in the dataset's schema, and the
    ABS's attribution is in every file.
summary: The 2,641 postal areas of Australia, the ABS's census approximation of postcodes for 2021, one shape each,
  in GDA2020.
description: The ABS digital boundary file POA_2021_AUST_GDA2020_SHP.zip, from the Australian Statistical Geography
  Standard (ASGS) Edition 3. Each row is one area with the columns the ABS publishes. The ABS adds rows for no usual
  address, migratory, offshore and shipping, which have no shape. They are kept, with a null geometry, so every
  ABS code is in the table.
