faq:
- q: What are these rates?
  a: Advertised rates at the end of each month for transaction accounts of $5,000, savings accounts of
    $10,000 and $50,000, and bank term deposits of $10,000 for one month to three years, as the RBA collects
    them from a sample of institutions. The RBA describes them as indicative and likely to be revised.
    The series began at different dates, so early rows have many null cells.
- q: Why do some series stop?
  a: The RBA stopped collecting building society and credit union rates separately when the sector consolidated,
    and the cash management trusts series, sourced from the ABS, ended in March 2009. The RBA publishes
    a Series Breaks table on the same page that explains each break.
- q: Under what licence is RBA data republished here?
  a: The RBA excludes its numerical data from the CC BY 4.0 licence that covers the rest of its site,
    and instead permits it to be used, reproduced, published and communicated to the public for personal
    or commercial use under sections 4 and 5 of its copyright notice, with attribution and no claim of
    endorsement. The RBA does not endorse this site or any use of this data, and it publishes the same
    figures free of charge at rba.gov.au. Every file here carries that attribution.
summary: 'Advertised retail deposit and investment rates at the end of each month since December 1981:
  transaction and savings accounts and bank term deposits from one month to three years. Updated monthly.'
description: Statistical table F4, Retail Deposit and Investment Rates, from the Reserve Bank of Australia.
  One row per month end from 31 December 1981 with the advertised rate, per cent per annum, on transaction
  accounts of $5,000 at banks, building societies and credit unions, on bonus, online and cash management
  savings accounts of $10,000 and $50,000, on cash management trusts, and on bank term deposits of $10,000
  for one, three and six months and one and three years and the average across terms.
