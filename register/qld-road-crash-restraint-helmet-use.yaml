faq:
- q: What is in casualty_restraint_helmet_use?
  a: The publisher's category for whether the person was wearing a seatbelt, a child restraint or a
    helmet, or was not, or it was not applicable or unknown. The values are kept exactly as published.
summary: Casualty counts by year, police region, severity, age group, gender, road user type and whether
  a restraint or helmet was used.
description: Aggregate counts of casualties from reported Queensland road crashes from 1 January 2001,
  by restraint use for vehicle occupants and helmet use for motorcycle and bicycle riders and pillions.
