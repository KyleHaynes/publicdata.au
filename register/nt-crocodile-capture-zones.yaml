faq:
- q: What is in each row?
  a: One capture zone, with its name, its code and the date the boundary was created, and the zone's
    shape. The zone code matches the zone code on each capture in the crocodile captures table.
- q: How often does it change?
  a: The boundaries in the October 2026 version were all created on 9 June 2021. This site checks the
    file weekly and adds a dated version when it changes.
summary: The boundaries of the nine zones where the Northern Territory removes crocodiles, one row per
  zone, with name, code and shape.
description: The nine crocodile capture zones of the Northern Territory, from Upper Harbour, Lower
  Harbour and Shoal Bay around Darwin to Katherine, Borroloola, Litchfield and Nhulunbuy, with the
  Management Zone and the area outside it. Each row carries the zone name, its code and the date the
  boundary was created, with the zone's shape.
