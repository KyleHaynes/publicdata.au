faq:
- q: What is in each row?
  a: One public dental clinic and one waiting list, such as General care or Priority 2, with the number
    of adults waiting at the end of the quarter in each of six waiting-time bands, the number treated
    from the list in the quarter in the same bands, and the percentage within the recommended waiting
    time for each.
- q: What are the bands?
  a: They are months waiting and differ by list. For General care they are under 12, 12 to 24, 24 to 36,
    36 to 48, 48 to 60 and over 60 months. For Priority 3 they are under 6, 7 to 12, 13 to 18, 19 to 24,
    25 to 30 and over 30. For Priority 2 they are under 3, 4 to 6, 7 to 9, 10 to 12, 13 to 15 and over
    15. For Clinical Assessment, Priority 1 and General Anaesthetic Category 1 they are under 1, 1 to
    2, 2 to 3, 3 to 4, 4 to 5 and over 5. General Anaesthetic Categories 2 and 3 follow Priority 2 and
    Priority 3.
- q: Which quarter is it?
  a: The newest quarter Queensland Health has published, October to December 2025 in the first version
    here. The publisher adds a workbook each quarter in a package for each financial year, and this table
    follows the newest. It notes all figures are preliminary.
summary: Adults waiting for public dental care and treated from the lists at each Queensland Health dental
  clinic in the newest quarter, by waiting list and months waited.
description: The Data sheet of Queensland Health's quarterly public dental waiting list workbook, one
  row per dental clinic and waiting list. Each row has the clinic, its Hospital and Health Service, the
  number of clients waiting at the quarter's end in six waiting-time bands, the number treated from the
  list during the quarter in the same bands, and the percentage within the recommended time for each.
  The workbook's Notes sheet, which defines the lists and bands, is described in the FAQ.
