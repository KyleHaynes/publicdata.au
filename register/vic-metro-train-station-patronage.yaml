faq:
- q: What does each row hold?
  a: One metropolitan train station for one financial year, with its total station entries for the year,
    its average daily entries on weekdays, school holiday weekdays, Saturdays and Sundays, and its average
    weekday entries in each time band from before the morning peak to late evening.
- q: How exact are the figures?
  a: The publisher rounds each estimate to the nearest 50 and rounds anything under 50 up to 50. The
    estimates come from myki data scaled by a transaction rate, so the department says they are less
    precise at station level than for the network as a whole.
- q: Does Southern Cross include V/Line passengers?
  a: No. Entries through the gates to platforms 1 to 8, where regional trains leave, are in the regional
    station dataset. Other metropolitan stations do count people entering to board a regional train.
- q: Which years are here?
  a: Each version is the newest financial year the department has released, starting with 2024-25. The
    portal also lists earlier years back to 2018-19 as separate files.
summary: Station entries at every Melbourne metropolitan train station for the financial year, in total
  and as daily averages by day type and time of day, rounded to the nearest 50.
description: Annual metropolitan train station patronage from the Department of Transport and Planning,
  one row per station with its stop id, name and coordinates, total station entries for the financial
  year, and average daily entries by day type and by time band. Estimates are derived from myki data and
  barrier counts and rounded to the nearest 50.
