collection_description: |
  The Queensland Office of Fair Trading, part of the Department of Justice, publishes the consumer complaints it receives, the legal and enforcement actions it takes against traders, and counts of the licences and registered organisations it administers. Each series is a file per period on the Queensland open data portal.

  These tables follow the newest file of each series, so each version is one release and the archive keeps each period as the office replaces it.
faq:
- q: What is in each row?
  a: One complaint the Office of Fair Trading received, with its case number, the date it was opened,
    how it arrived, the industry and product it was about, the office region and whether the complainant
    gave a vulnerable group.
- q: Which period does it cover?
  a: The newest file the office has published, which is 1 January to 31 March 2026 in the first version
    here. The office publishes a file for each calendar year and a partial file for the current year.
- q: Does a complaint mean the trader did something wrong?
  a: No. Each row records a complaint received. The file does not record the outcome.
- q: Why is the date text?
  a: The office changed the order of day and month between files, and a date such as 2/05/2026 cannot
    be read safely without knowing which. The date is kept exactly as published.
summary: Each consumer complaint received by the Queensland Office of Fair Trading in the newest published
  period, with date, channel, industry, product and region.
description: Complaints received by the Queensland Office of Fair Trading, one row per complaint, for
  the newest period the office has published. Each row has the case number, the date and time the complaint
  was initiated, the channel it came through, the industry and product, the office region and whether
  a vulnerable group was given. The office names no trader in this file.
