collection_description: The SA Housing Trust's Private Rent Report, built from the rental bonds lodged with Consumer
  and Business Services each quarter. It gives the number of new bonds and the median weekly rent by dwelling
  type and number of bedrooms. One table gives the figures by suburb and the other by postcode.
