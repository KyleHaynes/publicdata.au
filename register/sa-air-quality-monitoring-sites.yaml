faq:
- q: What is in each row?
  a: One air quality monitoring site of the Environment Protection Authority, with its name, the parameters it
    measures, whether it is active, the link to its readings where it has one, and its location.
- q: Where are the readings?
  a: The EPA publishes each station's hourly readings as separate portal datasets, one zip of monthly files per
    year. This table lists the sites.
summary: The Environment Protection Authority's air quality monitoring sites in South Australia, active and inactive,
  with the parameters each measures and its location.
description: Air Quality Monitoring Sites from the Environment Protection Authority. Each row is one site with its
  name, the parameters it measures, such as PM10, PM2.5, NO2, O3 and meteorology, its status, a link to its data
  page and its point location.
