faq:
- q: Can I add the rows to get the total number of crashes?
  a: Within one year, police region and severity, yes. Across the driver flags, no. A crash with a young
    male provisional driver is counted under each flag that is true, so summing across flags counts it
    more than once.
summary: Crash and casualty counts by year, police region and severity, split by whether a male, female,
  young, senior, provisional, overseas licensed or unlicensed driver was involved.
description: Aggregate counts of reported Queensland road crashes from 1 January 2001 by the kinds of
  driver involved. Each row is one combination of year, police region, crash severity and seven yes or
  no driver flags, with the number of crashes and casualties. The publisher's Yes and No are typed as
  booleans. Property damage only crashes stop after 31 December 2010.
