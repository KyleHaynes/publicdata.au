collection_search_title: Queensland social housing data
collection_description: |
  The Queensland Department of Housing and Public Works publishes data on the people waiting for social housing and on the homes the state owns.

  Social housing register has one row per application on the register at the end of a quarter. Social housing maintenance and modification expenditure has the department's spending on its own homes in a financial year.
