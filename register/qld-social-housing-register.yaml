faq:
- q: What is in each row?
  a: One application on the social housing register at the date of the release. It gives the level of assessed housing need, the housing service centre, the council area and state electorate of the first preferred location, the bedrooms needed, the housing programs applied for, when the application was approved, months on the register, the family type, the number of people and up to six preferred letting areas.
- q: What does a suppressed value mean?
  a: The publisher writes n.a. where a value is unavailable or withheld for confidentiality. Every n.a. in this file is in a text column, such as the interview language, the letting areas and the yes or no flags, and it is kept there as the text n.a.
- q: Does each release replace the last?
  a: Yes. The publisher adds a new file every quarter, and this entry follows the newest. Each quarter is kept here as its own version. The row_id numbers each release and does not follow an application from one release to the next.
summary: Every application on the Queensland social housing register at the end of the latest quarter, with the household's assessed need, preferred locations and time waiting.
description: One row per application on the Queensland social housing register at the end of a quarter, with the level of housing need (Very High or High), active or inactive status, the housing service centre, council area and state electorate of the first locational preference, bedrooms required, the programs applied for, the month the application was approved, the months on the register, family type, people on the application, up to six preferred letting areas, and flags for disability, homelessness risk and Aboriginal and Torres Strait Islander households. The department changed its systems in 2019-20, which changed some coding.
