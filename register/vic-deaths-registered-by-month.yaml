faq:
- q: What does each row hold?
  a: The number of deaths the registry registered in one calendar month. Doctors, funeral directors and
    the Coroner notify the registry of a death, and the death is counted in the month the registry
    registers it, which may be later than the month it occurred.
- q: How far back does it go?
  a: Each release covers about the last seven years of months, with the newest month first. Earlier
    months drop off the publisher's file as new ones are added, and the versions kept here hold them.
summary: The number of deaths the Victorian registry registered in each month, for about the last seven
  years. Updated monthly.
description: Deaths registered per month by the Registry of Births, Deaths and Marriages Victoria. Each
