collection_description: |
  The Registry of Births, Deaths and Marriages Victoria publishes counts of the life events it registers. Each count is by the month or year the registry registered the event, which can differ from the month or year it happened.

  This collection holds the monthly counts of deaths and of marriages, and the yearly totals of every registrable event by calendar year and by financial year.
