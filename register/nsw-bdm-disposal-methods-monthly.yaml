faq:
- q: What is in each row?
  a: One month since January 2015, with the number of registered deaths in which the body was cremated,
    buried or disposed of another way.
- q: What does other method cover?
  a: The Registry counts repatriation, body donation, alkaline hydrolysis and bodies not recovered as other
    methods.
- q: Are these the deaths that happened in the month?
  a: No. They are the deaths the Registry registered in the month, which can be later than the death.
summary: The number of registered deaths in New South Wales each month since January 2015 by whether the
  body was cremated, buried or disposed of another way. Updated monthly.
description: The REGISTERED Monthly Disposal Methods table from the NSW Registry of Births Deaths and Marriages.
  Each row is one month, with the number of deaths registered in it whose body was cremated, buried or
  disposed of by another method. Other methods are repatriation, body donation, alkaline hydrolysis and
  bodies not recovered.
