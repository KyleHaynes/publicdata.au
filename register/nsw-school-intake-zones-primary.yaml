collection_title: School intake zones (catchment areas) for NSW government schools
collection_description: The local enrolment areas of NSW government schools from the NSW Department of Education,
  as polygon layers. Every child is entitled to enrol at the school whose zone covers their home address. The
  Department publishes one layer for primary schools, one for high schools and one for zones set to start in
  a coming year.
