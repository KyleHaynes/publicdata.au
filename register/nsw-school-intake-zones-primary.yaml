faq:
- q: What is in each row?
  a: One polygon, the local enrolment area of one NSW government primary, infants or central school for its
    primary years, with the school code and name, the catchment type, the date the zone was added and a yes
    or no flag for each school year from Kindergarten to Year 12.
- q: Can I rely on a zone for buying or renting a home?
  a: The Department states that zones change as schools open and close and as populations shift, and that it
    takes no responsibility where the zones are relied on for real estate purchases or rentals. Check a home
    address with the school or the Department's School Finder.
- q: How often is it updated?
  a: The Department updates its zones nightly and refreshes the file on the portal from time to time. Each
    version here is one file the Department published.
summary: The intake zone polygons for NSW government schools in the primary layer, with the school, catchment
  type and the school years each zone covers.
description: The catchments_primary layer of the NSW Department of Education's School intake zones (catchment
  areas) for NSW government schools. Each row is one zone polygon, the local enrolment area of one NSW government
  primary, infants or central school for its primary years, with its school code and name, catchment type,
  date added and a flag for each school year from Kindergarten to Year 12. The shapes are published in GDA94
  and served here in GDA2020.
