faq:
- q: What is in each row?
  a: One residential rental bond refunded by NSW Fair Trading in 2025, with the payment date, the postcode
    of the rented premises, the dwelling type, the number of bedrooms, the amounts paid to the agent and to
    the tenant, and the number of days the bond was held.
- q: What do the dwelling type codes mean?
  a: Fair Trading defines F as a flat or unit, H as a house, T as a terrace, townhouse or semi-detached, O
    as other and U as unknown. Thirteen rows carry other codes, such as 1, G and P, which the definitions
    sheet in the source file does not define.
- q: What does a null bedroom count mean?
  a: Fair Trading writes U where the bedroom count was not given. It is a null value here.
summary: Every residential rental bond refunded by NSW Fair Trading in 2025, one row per bond, with the postcode,
