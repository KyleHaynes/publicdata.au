faq:
- q: What is in each row?
  a: One section of a state road, drawn as a line, with the road number, carriageway, the start and end of the
    section in kilometres along the road, its annual average daily traffic in both directions, the year it was
    counted and the year it was last updated, the share and number of commercial vehicles, counts by vehicle
    class, and the publisher's traffic score.
- q: What is annual average daily traffic?
  a: The publisher defines it as the traffic travelling in both directions past a roadside point over a full
    year, divided by the number of days in the year.
- q: Which year does it cover?
  a: The newest yearly snapshot, Traffic Volume Estimates 2026 at the first version. The publisher adds a snapshot
    each financial year, and each becomes a version here. Each section carries the year it was counted and the
    year its estimate was last updated, and both can be years before the snapshot.
summary: The estimated annual average daily traffic on each section of South Australia's sealed state roads, with
  commercial vehicle counts by class, from the newest yearly snapshot.
description: Traffic Volume Estimates from the Department for Infrastructure and Transport. Each row is one section
  of a sealed road the Department manages, with its road number and carriageway, its start and end in road running
  kilometres, the annual average daily traffic (AADT), the year of the count and of the last update, the percentage
  and number of commercial vehicles, the numbers in vehicle classes 3 to 5, 6 to 9, 10 and 11, and the traffic score,
  which the publisher derives from AADT and commercial vehicles.
