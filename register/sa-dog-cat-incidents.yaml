faq:
- q: What is in each row?
  a: The number of incidents recorded on Dogs and Cats Online in one financial year that share a type of location,
    time of day, season, leash status of the offending animal, incident type and victim type.
- q: Which years does the table cover?
  a: Every financial year in the newest extract, from 2018-19 to 2024-25 at the first version, taken on 30 May 2025,
    so 2024-25 stops short of 30 June. Incidents recorded before 30 June 2018 are grouped under one value,
    bef 30 Jun 2018. Each new extract becomes a version here.
summary: The number of dog and cat attacks and harassment incidents recorded on South Australia's Dogs and Cats
  Online register, by location type, time of day, season, leash, incident and victim. Updated yearly.
description: Incident counts from Dogs and Cats Online (DACO), from the Department for Environment and Water. Each row
  is one financial year, location type, time of day, season, leash status of the offending animal, incident type,
  such as attack or harassment, and victim type, such as human or animal, with the number of incidents recorded.
