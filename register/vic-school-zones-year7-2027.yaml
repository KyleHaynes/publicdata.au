faq:
- q: What does each row hold?
  a: The neighbourhood zone of one government secondary school for students entering Year 7 in 2027,
    with the school and campus name and the department's code, as a shape in the GeoParquet, GeoJSON,
    GeoPackage and PMTiles files. Two schools have a zone in two parts, so they have two rows.
- q: Why Year 7 only?
  a: The department publishes a layer for each secondary year level, and the Year 7 layer is the one a
    family uses when choosing a secondary school. The other year levels, and the standalone junior,
    senior and single sex zones, are in the same release on the portal.
- q: Can a child enrol outside their zone?
  a: Yes. The publisher states that a zone does not restrict a family's choice to seek a place at another
    government school, and that a school outside the zone may take the child if it has room.
summary: The 2027 Year 7 neighbourhood zone of each of about 320 Victorian government secondary schools,
  one shape per zone part, from the Department of Education.
description: Victorian Government School Zones for 2027, Year 7 layer of the integrated secondary zones.
  Each row is a zone, or one part of a zone, of a designated neighbourhood government secondary school,
  with the school, campus and department code. Selective entry, specialist and other schools with their
  own enrolment criteria have no zone.
