faq:
- q: Is each row one crash?
  a: No. Each row is one location where crashes happened in the five years, with the number of crashes
    there and counts by severity, crash type and road user. The publisher's separate Road Crash Data
    files on the portal have one row per crash, without coordinates.
- q: Why does the file cover only five years?
  a: The publisher releases a new five-year file each year and keeps the earlier files on the portal.
    This dataset follows the newest file, so each release becomes a version here.
- q: Which coordinates are these?
  a: The publisher supplies the same file in GDA94 and GDA2020. This dataset uses the GDA2020 file,
    which is the current national datum.
summary: Every location where a crash was reported on a South Australian road from 2020 to 2024, one row
  per site, with counts of crashes by severity and type and of casualties.
description: 'One row per location where a road crash was reported to South Australia Police from 2020
  to 2024. Each row carries the site''s coordinates, the number of crashes there, and counts of those
  crashes by severity (property damage, injury, serious injury, fatal), by type (rear end, hit fixed
  object, head on and others), at night, and involving a bicycle or a pedestrian, with the numbers of
  casualties, serious injuries and deaths.


  The Department for Infrastructure and Transport releases a new five-year file each year.'
