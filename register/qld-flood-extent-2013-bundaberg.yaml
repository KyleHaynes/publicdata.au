faq:
- q: What is in each row?
  a: One polygon of mapped flood extent, with the feature type, the location name, the source the outline
    was drawn from and the reliability dates the department records for the shape and its attributes.
- q: Is this the peak of the flood?
  a: Not always. The department describes the polygons as the approximate inundation when the source imagery
    or survey was captured, and recommends them for use at about 1:5,000 to 1:10,000.
- q: Can I use it to tell whether a property will flood?
  a: No. It shows one past flood. Councils publish flood planning maps for present risk.
summary: The mapped extent of the January 2013 Bundaberg flood that followed ex-tropical cyclone Oswald,
  drawn from aerial imagery, as polygons from the Queensland Flood extent series.
description: The 2013 Floodline Bundaberg layer of the Queensland Flood extent series, one row per polygon
  of mapped inundation for the January 2013 Bundaberg flood that followed ex-tropical cyclone Oswald,
  drawn from aerial imagery. Each row has the feature type, location, source and the reliability dates
  for the feature and its attributes. The polygons are read from the state's map service in WGS84 and
  published in GDA2020.
