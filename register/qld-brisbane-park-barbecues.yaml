faq:
- q: What is in each row?
  a: Each row is one barbecue in a Brisbane City Council park. It gives the asset numbers, the barbecue type,
    the park name and number, the suburb, how it is powered, how many plates it has and its coordinates.
- q: Does it cover all of Queensland?
  a: No. It covers parks run by Brisbane City Council only.
summary: Every public barbecue in Brisbane City Council parks, with its park, suburb, power type, number of
  plates and coordinates.
description: 'One row per barbecue in a Brisbane City Council park, from the council''s asset system. Each
  row gives the object id, the asset and location numbers, the item description and type, the park name and
  number, the suburb, the power type, the number of plates, and the longitude and latitude.

  '
