collection_description: 'Brisbane City Council publishes the facilities in its parks as separate layers from
  its asset system. This collection holds two of them. The barbecue layer has one row per barbecue with its
  park, power type and number of plates. The dog off-leash layer has one row per off-leash area with its fencing,
  lighting and equipment.

  '
