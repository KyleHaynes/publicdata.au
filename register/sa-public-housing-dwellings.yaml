faq:
- q: What is in each row?
  a: One council area, with the publisher's counts of dwellings and their characteristics in the columns named.
- q: What does n.p. mean?
  a: The publisher replaces every count for a council area with n.p. where the area has one to three dwellings. Those
    cells are nulls here, flagged as suppressed.
- q: Are the counts exact?
  a: No. The publisher rounds counts to the nearest multiple of 5, so rows and columns may not add to the totals.
    The publisher's Total and percentage of total rows are kept as published at the end of the table, and
    because the percentage row holds fractions, every count column is typed as a number.
- q: Which date does the table cover?
  a: The newest file the publisher has released, 30 June 2021 at the first version. The files for 2019-20 stay on the portal,
    and each new file becomes a version here.
summary: The number of public housing dwellings the SA Housing Trust held in each South Australian council area at 30 June, with tenancy, occupancy, rent, bedrooms and dwelling type.
description: Public housing dwellings by Local Government Area from the South Australian Housing Trust, from South Australia's contribution to the national Public Housing data collection. Each row is one council area with the number of dwellings, the publisher's rate per 10,000 residential dwellings, the numbers tenantable, untenantable and occupied, the share of tenantable dwellings occupied, the average market rent, and the dwellings by number of bedrooms and by dwelling type.
