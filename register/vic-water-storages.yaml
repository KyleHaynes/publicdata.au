faq:
- q: What is this list?
  a: The reservoirs whose monthly levels the department reports, with the supply system each belongs to,
    its total capacity in megalitres, the water corporation's page about it and any note on a change to the
    capacity figure. It is the second sheet of the monthly storage levels spreadsheet.
- q: How do I get a percentage full?
  a: Join the monthly storage levels dataset to this one on the reservoir name and divide the month's
    volume by the total capacity. Both are as the publisher states them, and a capacity can change when a
    storage is resurveyed, which the note column records.
summary: The reservoirs in Victoria's monthly storage report with their supply system, total capacity in
  megalitres and the water corporation's page. About 65 storages, updated with the monthly report.
description: The storage information sheet of the Department of Energy, Environment and Climate Action's
