faq:
- q: What is in each row?
  a: Each row is the number of passenger trips on one mode of Translink public transport in South East Queensland
    in one month.
- q: How far back does it go?
  a: At review the file held about 30 months, starting in late 2023. Each fetch here is kept as a version,
    so a month the publisher later drops stays in an earlier version.
summary: Monthly passenger trips on Translink bus, train, tram and ferry services in South East Queensland.
