faq:
- q: What does each row hold?
  a: The number of one kind of life event the registry registered in one financial year, from 2009/10.
    The kinds are births, changes of name, marriages, deaths, registered and revoked relationships,
    adoptions and stillbirths, and the publisher's own total of them all, kept as published.
- q: Have past figures changed?
  a: The publisher states it found and corrected an issue with the registrations first published for
    2022-23. Earlier versions kept here show the figures as they were published at the time.
summary: The number of births, deaths, marriages, changes of name, registered relationships, adoptions
  and stillbirths registered in Victoria in each financial year from 2009/10.
description: Registrable events by financial year from the Registry of Births, Deaths and Marriages
  Victoria. Each row is one kind of event and one financial year, with the number the registry
  registered in it. Events are counted when registered, which may differ from when they occurred. The
  publisher's Total row is kept.
