faq:
- q: What is in each row?
  a: Each row is one calendar year and one coal type, with the state's total net output of saleable coal in
    tonnes.
- q: How does this differ from the production by mine table?
  a: This table is by calendar year and gives state totals. The production by mine table is by financial year
    and names each mine.
- q: Why does PCI start in 2022?
  a: The publisher reports PCI coal as its own type from 2022. The years before have rows for coking and
    thermal coal only.
summary: Queensland's total saleable coal production in tonnes by calendar year since 2010, for coking, PCI
  and thermal coal.
description: One row per calendar year and coal type from 2010, with the total net output of saleable coal
  from Queensland mines in tonnes. This is the Saleable Coal Production sheet of the annual coal statistics
  production workbook.
