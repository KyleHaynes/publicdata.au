collection_description: Council food safety inspections and enforcement in South Australia, from the tables of
  SA Health's Annual Food Act Report. Each table covers one sector of food business and counts, for each kind of
  business, how many there are, how many councils inspected and the notices, orders, expiations and
  prosecutions that followed.
