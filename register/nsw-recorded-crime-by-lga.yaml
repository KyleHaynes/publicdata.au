faq:
- q: Why is this one row per month when the publisher's file has one column per month?
  a: The publisher's workbook has a column for every month since January 1995 and gains three columns
    each quarter. Each cell here is one row, with its council area, offence category, subcategory and
    month, so a new release adds rows instead of columns and every version has the same fields. No count
    is changed.
- q: Are these counts of offences or of people?
  a: They are criminal incidents recorded by NSW Police in each month. One incident can involve more than
    one person and more than one offence category. The publisher's notes on the portal explain how
    incidents are counted.
- q: How often is it updated?
  a: BOCSAR releases this dataset every quarter. Recent months can change when police records are
    updated, so a later version can revise an earlier month.
summary: Criminal incidents recorded by NSW Police in each council area, month by month since January 1995,
  for 21 offence categories and their subcategories.
description: Recorded criminal incidents for each NSW local government area, by offence category and
  subcategory, for every month since January 1995. BOCSAR publishes it as a workbook with one column per
  month; each cell is one row here, keyed by council area, offence category, subcategory and month.
