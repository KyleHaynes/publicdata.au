faq:
- q: Does it include every crash?
  a: No. The publisher includes crashes reported to Victoria Police in which a person was killed or
    injured, consolidated with hospital injury records. A crash with no injury that nobody reported
    is not here.
- q: Why do recent months have fewer crashes?
  a: The publisher adds crashes as police reports and hospital records are matched, which can take
    months. Recent months rise in later releases, and each release becomes a version here.
- q: What are the other files on the portal?
  a: The publisher also releases person, vehicle, event, node and condition tables that join to this one
    on accident_no. This dataset is the flattened file the publisher provides with one row per crash
    and its coordinates.
summary: Every crash reported to Victoria Police since 2012 in which someone was killed or injured, one
  row per crash, with its coordinates, road, lighting, speed zone and counts of people and vehicles.
description: 'One row per crash on a Victorian road in which a person was killed or injured, from 2012 to
  the latest month released. Each row carries the date and time, the crash movement (DCA) code, light
  condition, road geometry, severity, speed zone, road and council area, coordinates, and counts of
  people killed and injured by road user and age group, and of vehicles by type.


  The publisher consolidates Victoria Police reports with hospital injury records and releases the
  file monthly.'
