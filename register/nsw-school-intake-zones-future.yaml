faq:
- q: What is in each row?
  a: One polygon, a local enrolment area the Department has set to take effect for a coming enrolment year,
    with the school code and name, the catchment type, the date the zone was added and, for each school year
    from Kindergarten to Year 12, the enrolment year from which the zone applies, or 0 where it does not apply.
- q: Can I rely on a zone for buying or renting a home?
  a: The Department states that zones change as schools open and close and as populations shift, and that it
    takes no responsibility where the zones are relied on for real estate purchases or rentals. Check a home
    address with the school or the Department's School Finder.
- q: How often is it updated?
  a: The Department updates its zones nightly and refreshes the file on the portal from time to time. Each
    version here is one file the Department published.
summary: The intake zone polygons the NSW Department of Education has set for a coming enrolment year, with
  the school, catchment type and the year each zone applies from for each school year.
description: The catchments_future layer of the NSW Department of Education's School intake zones (catchment
  areas) for NSW government schools. Each row is one zone polygon, a local enrolment area the Department has
  set to take effect for a coming enrolment year, for a new school or a changed zone, with its school code
  and name, catchment type, date added and, for each school year from Kindergarten to Year 12, the enrolment
  year the zone applies from. The shapes are published in GDA94 and served here in GDA2020.
