faq:
- q: Why five-year periods?
  a: Counts by age group and state are small, so the Institute publishes them over rolling five-year periods,
    2001–2005 through to the latest, as age-specific rates per 100,000 and numbers of deaths. Each row
    is one state or territory, age group, measure and period.
- q: Where do the figures come from?
  a: The Institute's Suicide and self-harm monitoring data tables, built from the National Mortality Database,
    which holds the causes of death the ABS codes from registrations. The Institute writes n.p. where
    a figure is not published because the count is small, and those cells are null here with a suppressed
    flag. Year of death is the year the death was registered.
- q: Why does the attribution say "based on" AIHW material?
  a: The Institute publishes its data tables under CC BY 4.0 and asks that material adapted from them,
    which republishing in other formats is, carry the words "Based on Australian Institute of Health and
    Welfare material". Every file here carries them. The Institute has not endorsed this site.
summary: Deaths by suicide and age-specific rates for each state and territory by age group over rolling
  five-year periods since 2001–2005, from the AIHW National Mortality Database tables. Updated yearly.
description: Table NMD 4a of the Australian Institute of Health and Welfare's Suicide and self-harm monitoring
  data tables, deaths by suicide by state or territory and age group over five-year periods, one row per
  state, age group, measure and period, with the number of deaths or the age-specific rate per 100,000
  population. The Institute publishes the table with a column per period; it is one row per period here.
