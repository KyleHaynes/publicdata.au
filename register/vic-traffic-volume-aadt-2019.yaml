faq:
- q: What does each row hold?
  a: One road segment of the Victorian declared road network in one direction of travel, with the
    average number of vehicles and of heavy vehicles that used it each day in 2019, as a line in the
    GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: Are the volumes counted or estimated?
  a: Both. The publisher marks each row Actual where the volume comes from a traffic count and Estimated
    where it was worked out by its own data processes. About one row in six is Actual.
- q: Why only 2019?
  a: The publisher's historical series has one file for each year from 2001 to 2019. This entry holds the
    2019 file, the newest in the series. Local roads that councils manage are not in the network it covers.
- q: What is the percentage of heavy vehicles?
  a: The publisher's own share of the daily volume that is heavy vehicles, as a fraction, so 0.07 is
    7 per cent. It is published as given.
summary: The average daily traffic and heavy vehicle volume in 2019 on each segment and direction of
  Victoria's declared arterial roads and freeways, as about 14,700 mapped lines.
description: Annual average daily traffic (AADT) volumes for 2019 from the Department of Transport and
  Planning, one row per road segment and direction of travel on the declared road network, with the road
  name, section description, council area, whether the volume is actual or estimated, and the daily
  volume of all vehicles and of heavy vehicles. The publisher's historical series runs from 2001, one
  file a year.
