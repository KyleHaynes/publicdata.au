faq:
- q: What is in each row?
  a: One ABS Statistical Area 4 region in one month, with the number of venues approved and operating, the
    number of gaming machines approved and operating, and the metered win, which is the amount players lost
    on the machines.
- q: Which SA4 boundaries are used?
  a: The publisher says it uses the areas of the Australian Statistical Geography Standard 2011. Regions are
    named, with no code.
summary: Monthly counts of gaming venues and machines and the amount players lost on them in each Queensland
  SA4 region since July 2004.
description: One row per ABS Statistical Area 4 region per month from July 2004, with the venues approved and
  operating electronic gaming machines, the machines approved and operating on the last day of the month, and
  the metered win in dollars. Regions are ASGS 2011 SA4 names.
