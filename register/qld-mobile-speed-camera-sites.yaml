collection_description: |
  The Queensland Police Service Road Safety Camera Office lists the sites where its portable, marked and covert mobile speed cameras and its road safety camera trailers may operate. The two lists are published together and updated quarterly.

  A site is a stretch of road described by a road name and locality. A camera is not at every site at once.
faq:
- q: What is in each row?
  a: One approved mobile speed camera site, with its site number, whether it is a primary or secondary
    site, whether it is active or parked, and a description of the road and locality.
- q: Does it show where cameras are today?
  a: No. It lists the sites where a mobile camera may be set up. The police do not publish which sites
    are in use on a given day.
- q: Are there coordinates?
  a: No. The publisher describes each site by road and locality only, and several sites can share one
    road and locality.
summary: Every approved site for mobile speed cameras in Queensland, with its site number, type, status
  and road and locality, from the Queensland Police Service.
description: The list of sites where the Queensland Police Service may operate portable, marked and covert
  mobile speed cameras, one row per site. Each row has the site number, the site type, whether it is active
  or parked, and the road and locality. The police update the list quarterly.
