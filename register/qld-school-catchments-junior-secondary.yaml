faq:
- q: What is in each row?
  a: Each row is the catchment area of one Queensland state school for junior secondary students (Years 7 to
    10), with the school's name, the publisher's description text and the boundary as a polygon.
- q: Where is the school code?
  a: The publisher puts the centre name and centre code in an HTML table inside the description of each area.
    The text is kept as published in the description field.
- q: Does living in a catchment guarantee a place?
  a: The department's enrolment management rules give students living in a school's catchment an entitlement
    to enrol there. Check the school's own enrolment management plan for the rules that apply.
summary: The junior secondary catchment area of each Queensland state school for the current school year, as
