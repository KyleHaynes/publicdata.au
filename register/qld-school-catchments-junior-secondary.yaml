description: One polygon per Queensland state school with a junior secondary catchment (Years 7 to 10), from
  the Department of Education's state schools geographic information. Each area carries the school name and
  a description holding the centre name and centre code. The publisher replaces the file for each school year,
  and this entry follows the newest.
