faq:
- q: What is in each row?
  a: One mapped fire scar, the area burnt by a bushfire or a prescribed burn, with its incident name and
    number, the fire date, financial year, calendar year and season, the area in hectares, and the
    publisher's codes for how reliable the date is and how the shape was captured. The shape itself is in
    the GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: Does it cover every fire in South Australia?
  a: No. The Department maps major bushfires across the state and prescribed burns on land managed by state
    agencies. It says the mapping may be incomplete for a given reserve or region, and burn-offs on private
    land are left out.
- q: Why is the incident number 0 in some rows?
  a: The publisher writes 0 where a fire has no incident number on record. Every fire before 2000 has 0, and so
    do about two in three bushfires since then. Most prescribed burns since 2000 carry a number. The value is
    kept as published.
summary: The mapped extent of major bushfires and of prescribed burns on state-managed land in South Australia,
  one shape per fire scar with its date, type and area.
description: 'State-wide fire scar mapping from the Department for Environment and Water. Each row is one area
  burnt by a bushfire or by a prescribed burn on land managed by state agencies, with the incident name and
  number, the date, financial year, calendar year and season of the fire, the area in hectares, comments, and
  the publisher''s codes for date reliability, imagery, feature source and capture method.


  The publisher notes that a landscape approach is used, so the mapping may be incomplete for a given reserve
  or region, and that burn-offs on private land are excluded.'
