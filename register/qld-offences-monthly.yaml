faq:
- q: What is in each row?
  a: One month from July 1997, with the number of offences reported to the Queensland Police Service across
    the state in that month, one column per offence category. Some columns, such as Assault and Offences
    Against the Person, are groups that include other categories, so adding every column counts some offences
    more than once.
- q: Is this the number of crimes committed?
  a: It is the number of offences the police recorded as reported. An offence nobody reported is not counted,
    and police activity drives some categories, such as drug and good order offences.
- q: Why are some newer categories zero in early years?
  a: Categories such as Coercive Control, Voluntary Assisted Dying and E-mobility began when the law created
    them, and the publisher writes 0 for the months before.
summary: The number of offences reported to the Queensland Police Service each month since July 1997,
  statewide, with one column for each of about 90 offence categories. Updated monthly.
description: Monthly counts of offences reported to the Queensland Police Service for the whole state
  from July 1997, one row per month. Each of about 90 columns is an offence category or a group of categories,
  from homicide and assault to fraud, drug, traffic and good order offences. The publisher updates the
  file each month.
