collection_description: |
  The Queensland Government publishes coal production and sales statistics from the returns that coal mine operators lodge with the department responsible for resources. Two releases are kept here. The coal industry review tables are by financial year from FY2010 and name each mine. The annual coal statistics are by calendar year from 2010 and give state totals, with export tonnes and sales values by destination country.

  The publisher notes that the figures may be revised as operators lodge new or corrected returns, so a later release can change earlier years.
