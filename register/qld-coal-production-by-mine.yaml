faq:
- q: What is in each row?
  a: Each row is one mine, one financial year and one coal type or activity, with the tonnes of discards, gross raw feed, gross raw output and net output the operator reported.
- q: What is net output?
  a: Net output is the saleable coal a mine produced after washing, in tonnes. Gross raw output is the coal mined before processing. A row usually carries a figure in only some of the four columns, and the rest are zero as published.
- q: Is the latest financial year complete?
  a: The publisher updates the tables during the year, so the newest financial year can be part of a year. The title row of the workbook gives the month it was updated.
summary: Tonnes of raw and saleable coal from each Queensland coal mine by financial year since FY2010, by coal type.
description: One row per Queensland coal mine, financial year and coal type or activity from FY2010, with the mine type (open cut or underground) and the tonnes of discards, gross raw feed, gross raw output and net output reported to the department. This is the Coal production by mine sheet of the coal industry review statistical tables.
