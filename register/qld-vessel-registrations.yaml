faq:
- q: What is in each row?
  a: One recreational vessel on the Queensland register on 30 June 2020, with the postcode, suburb and
    state of its owner's address, its registration category, term and purpose of use, make, model, colour,
    body shape, length and draught in metres, whether it is fitted with sails, and the type, make and
    model of up to two engines. No registration mark or owner is included.
- q: Are commercial vessels included?
  a: No. The department's extract covers recreational vessels only.
- q: How current is it?
  a: The department states the extract is the register as at 30 June 2020, and the portal record was last
    changed in March 2026.
summary: Every recreational vessel registered in Queensland on 30 June 2020, one row per vessel, with
  the owner's postcode and suburb, make, model, length and engines.
description: An extract of the Queensland recreational vessel register as at 30 June 2020 from the Department
  of Transport and Main Roads, one row per registered vessel. Each row has the postcode, suburb and state
  of the registered address, the registration category, term and purpose of use, the make, model, colour
  and body shape, length and draught, whether it has sails, and up to two engines. Commercial vessels
  are not included.
