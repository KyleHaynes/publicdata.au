collection_search_title: Queensland crocodile sightings data (CrocWatch)
collection_description: 'The Queensland environment department publishes the crocodile sightings the public
  reported to it through CrocWatch, and the results of its own crocodile distribution surveys. The sightings
  tables give each report with its location, the crocodile''s size and behaviour, and what the department decided
  about it. The survey table lists each crocodile seen on surveys of rivers from 2000 to 2012.


  The sightings come in three files whose columns differ: 2010 to 2015, 2016, and January to March 2017. Each
  is its own table here.

  '
temporal_start: '2010-01-01'
search_title: Queensland crocodile sightings 2010 to 2015 (CrocWatch)
