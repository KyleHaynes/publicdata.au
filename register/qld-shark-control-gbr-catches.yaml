faq:
- q: What is in each row?
  a: Each row is one animal caught by Shark Control Program gear inside the Great Barrier Reef marine parks,
    with the date, area, beach, marine park, species, fate and the reason for the fate.
- q: Which period does it cover?
  a: The publisher adds one file per financial year. This entry follows the newest, which covered July 2025
    to April 2026 at the time of review. Earlier years are on the same portal page.
summary: Each animal caught by Queensland shark control gear inside the Great Barrier Reef marine parks in
  the current financial year, by date and beach.
description: 'One row per animal caught by the Queensland Shark Control Program inside the Commonwealth Great
  Barrier Reef Marine Park or the Great Barrier Reef Coast Marine Park. Each row gives the date of capture,
  the area and beach, the marine park, the common and scientific names, the fate and the reason for it.


  The publisher adds a new file for each financial year and extends the current one as the year goes on. This
  entry follows the newest.

  '
