faq:
- q: What is in each row?
  a: Each row is one pool safety inspector licensed by QBCC, with the licence number, the licensee's name and
    business address, the licence grade and the licence class.
- q: How current is it?
  a: The publisher's file is current as at 1 August 2024. QBCC's online licence search shows whether a licence
    is current today.
