faq:
- q: What is in each row?
  a: One open gauging station in the Queensland Government's surface water quantity monitoring network, with
    its identifier, name, drainage basin, the latitude and longitude of its instrument hut, and links to its
    pages on the Water Monitoring Information Portal.
- q: Where are the water level and flow readings?
  a: This table lists the stations only. The readings for each station are on the Water Monitoring Information
    Portal, which the station link in each row opens.
summary: The location, name and drainage basin of every open stream gauging station in Queensland's surface
  water monitoring network.
description: One row per open gauging station in the surface water quantity monitoring network run by the Department
  of Local Government, Water and Volunteers, with the station identifier, its name, its drainage basin, the
  latitude and longitude of the instrument hut in GDA94, and links to the station's and basin's pages on the
  Water Monitoring Information Portal. The file is read from the department's map service for the layer the
  dataset describes.
