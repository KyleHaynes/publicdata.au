faq:
- q: What does each row hold?
  a: One school registered in Victoria, government, Catholic or independent, with its school number,
    name, type, street and postal address, phone number, the department's region and area, the council
    area and the coordinates of the school. The publisher collects it as part of the registration of
    schools, as at the February census.
- q: Which schools are included?
  a: Primary, secondary, combined primary and secondary, specialist and English language schools of every
    sector. A school with more than one campus is listed once, at its administration campus, and the
    region and area follow that campus.
- q: What do the status and entity type codes mean?
  a: The status is O for an open school and C for a closed one, as published. The entity type is 1 for a
    government school and 2 for a non-government school, and a school number is unique within its
    entity type.
summary: Every registered school in Victoria in 2025, about 2,300 government, Catholic and independent
  schools, with type, address, phone number, region, council area and coordinates.
description: The Department of Education's School Locations list for 2025, one row per school with
  its sector, school number, type, status, street and postal addresses, phone number, departmental region
  and area, council area and longitude and latitude. Government and non-government schools are both
  included. The department publishes a new list each year.
