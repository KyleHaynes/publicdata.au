collection_description: |
  The Department of Education publishes where every registered school in Victoria is and, for each government school with a neighbourhood zone, the area whose children have a right to enrol there.

  School locations has one row per school with its sector, type, address and coordinates, for government, Catholic and independent schools. The school zone layers hold the zone boundaries for the next school year, one layer for primary schools and one for Year 7 entry to secondary schools.
