collection_description: Transport for NSW publishes the dates of NSW public holidays and the start and end
  of each public school term as two tables. The public holiday table
  covers 2019 to 2023 and the school term table covers 2019 to 2025. Transport for NSW has said it no longer
  updates the school term table.
