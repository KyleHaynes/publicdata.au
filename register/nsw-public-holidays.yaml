faq:
- q: What is in each row?
  a: One public holiday in New South Wales, with its date and the name of the day.
- q: Which years are covered?
  a: The file runs from New Year's Day 2019 to the end of 2023. Transport for NSW publishes later years
    only in a PDF guide, which is not read here.
summary: The date and name of every New South Wales public holiday from 2019 to 2023, as Transport for
