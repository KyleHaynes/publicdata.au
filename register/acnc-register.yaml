faq:
- q: Which charities are in the file?
  a: Every charity registered with the ACNC on the day the file was made. Each row is one charity with its
    ABN, legal name and other names, business address, website, registration date, size, the number of
    responsible persons, the states and countries it operates in, its registered charitable purposes and
    the groups of people it says it helps.
- q: What do the blank cells in the purpose and beneficiary columns mean?
  a: The publisher writes Y where a purpose, subtype, state or beneficiary group applies to a charity and
    leaves the cell blank otherwise. The Y is kept here as true and the blank as null.
- q: Why is the address blank for some charities?
  a: A charity may ask the ACNC to withhold its address, for example a refuge, and the publisher then leaves
    the address columns blank. The state column holds whatever the charity entered, so a few rows carry a
    full state name or another value in place of the abbreviation.
- q: Are revoked charities included?
  a: No. The file is the charities registered on the day it was made. A charity whose registration the
    ACNC revokes leaves the file, and earlier versions here keep the rows as they were.
summary: Every charity registered with the ACNC, with ABN, names, address, size, registration date, where
  it operates, its charitable purposes and who it helps. About 66,000 charities, updated weekly.
description: The ACNC Register of Australian charities as the Commission publishes it each week, one row
  per registered charity. Each row carries the ABN, legal and other names, business address and website,
  registration and establishment dates, charity size, number of responsible persons, financial year end,
  the states and countries it operates in, its registered charitable purposes and subtypes, and the
  beneficiary groups it names.
