faq:
- q: What period does each year cover?
  a: Each year is the twelve months ending in the month named in year_ending. A year of 2026 with a year_ending
    of June covers July 2025 to June 2026. Every row of one release uses the same month.
- q: Where do the rates come from?
  a: The CSA publishes a rate per 100,000 people for each police service area and each council area beside
    the count. Both rates are copied as published. This site does not calculate them.
- q: How often is it updated?
  a: The CSA releases new tables every quarter, in March, June, September and December. Each release covers
    ten years and can revise earlier years, so every release is kept here as its own version.
summary: Offences recorded by Victoria Police in each council area and police service area, by offence
  subgroup, for each of the last ten years, with the publisher's rates per 100,000 people.
description: Offences recorded by Victoria Police for each police service area and local government
  area, by offence division, subdivision and subgroup, for the ten years to the end of the latest quarter.
  This is table 2 of the Crime Statistics Agency's workbook of recorded offences by local government area.
