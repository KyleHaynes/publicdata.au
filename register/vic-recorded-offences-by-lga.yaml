collection_title: Victorian recorded offences
collection_description: |
  The Crime Statistics Agency (CSA) publishes Victoria's crime statistics from Victoria Police records every quarter. Each release is a workbook of tables that covers the ten years to the end of the latest quarter.

  Two of its tables are here. Recorded offences by council area and offence has one row per police service area, local government area and offence subgroup for each year. Recorded offences by suburb has one row per suburb or town and offence subgroup for each year.
