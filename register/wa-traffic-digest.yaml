faq:
- q: What is in each row?
  a: One Main Roads traffic count site, with its site number, road, location description, the financial
    year of its latest count, the average number of vehicles per day across the week, on weekdays and on
    weekends, the percentage of heavy vehicles in each, whether it is a continuously monitored network
    performance site, and its local government and region.
- q: Is this every year of counts?
  a: No. Each site carries only its latest year of traffic data, so the year differs between sites. A
    new count replaces the old one in the publisher's layer, and this site keeps each changed layer as
    a dated version.
- q: How were the counts taken?
  a: Main Roads monitors strategic locations continuously and samples the wider network with portable
    equipment over short periods. The publisher focuses on roads it manages, with many local government
    roads counted as well.
- q: Where is the publisher's file?
  a: This site downloads the CSV the Main Roads open data portal builds from its Traffic Digest layer.
summary: The latest average daily traffic and share of heavy vehicles at about 2,400 Main Roads traffic
  count sites across Western Australia, one row per site, with road, location, coordinates, local
  government and region.
description: Main Roads Western Australia's Traffic Digest, one row per traffic count site, each with
  its latest year of data. Each row carries the site number, road name, location description,
  financial year of the count, collection type, the average number of vehicles per day from Monday to
  Sunday, Monday to Friday and Saturday to Sunday, the percentage of heavy vehicles in each of those
  periods, whether it is a network performance site, the local government and the Main Roads region,
  and its coordinates.
