faq:
- q: What is in each row?
  a: One month of the newest year the registry has published, numbered 1 to 12, with the number of births
    registered in Queensland in that month.
- q: Is this the month the baby was born?
  a: No. The registry counts registrations, and it notes that the month a birth was registered may differ
    from the month the baby was born.
summary: The number of births registered in Queensland in each month of the newest year the Registry of
  Births, Deaths and Marriages has published.
description: Births registered with the Queensland Registry of Births, Deaths and Marriages, one row per
  month of the newest year the registry has published. The registry adds a file for each year, and this
  table follows the newest one. Counts are by month of registration.
