faq:
- q: What is in each row?
  a: One school year, with the average number of students per class in NSW government primary schools for Kindergarten,
    each of Years 1 to 6, and Kindergarten to Year 6 together.
- q: Why do some years not appear?
  a: The Department's file has the years it published averages for, from 1997. Years it did not report are
    not rows.
summary: The average class size in NSW government primary schools for each grade from Kindergarten to Year
  6, for each year the Department has reported since 1997.
description: The Average class size by year table from the NSW Department of Education. Each row is one year,
