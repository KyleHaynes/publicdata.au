faq:
- q: What is in each row?
  a: Each row is one dog off-leash area in a Brisbane City Council park. It gives the location code, the park
    name and number, the suburb, whether it is fenced and lit, whether it has a small dog enclosure and agility
    equipment, a point for the area, and its area and perimeter.
- q: Is the point the whole area?
  a: No. The publisher maps each off-leash area as a shape and gives one longitude and latitude for it. Only
    that point is published here.
summary: Every dog off-leash area in Brisbane City Council parks, with its park, suburb, fencing, lighting,
  small dog enclosure and agility equipment.
description: 'One row per dog off-leash area in a Brisbane City Council park, from the council''s asset system.
