collection_description: |
  The State Revenue Office Victoria holds money that businesses could not return to its owners, such as forgotten bank accounts, uncashed cheques and unpaid wages, and pays it out to people who claim it.

  The office publishes two yearly series from 2004-05: the number of claims it processed and the amount it paid out.
