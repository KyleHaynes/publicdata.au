faq:
- q: What is in each row?
  a: One bond closed in November 2016, with the suburb and postcode of the rented home, the bond amount
    and weekly rent in dollars, the dates the bond was lodged, made active and closed, the number of
    bedrooms, the dwelling type and the length of the tenancy in months as recorded at lodgement.
- q: Why do some bonds date from years earlier?
  a: A bond is closed when its tenancy ends, so a bond closed in November 2016 may have been lodged in
    any earlier year.
- q: Is there a later month?
  a: No. The department published November 2016 only. The series is closed.
summary: Every Tasmanian rental bond closed in November 2016, one row per bond, with suburb, bond amount,
  weekly rent, lodgement and closing dates, bedrooms and dwelling type.
description: The rental bonds held by the Rental Deposit Authority that were closed in November 2016,
  one row per bond. Each row carries the suburb, state and postcode of the rented home, the bond amount
  and weekly rent in dollars, the bond lodgement, activation and closing dates, the number of bedrooms,
  the dwelling or premises type, and the length of the tenancy in months.
