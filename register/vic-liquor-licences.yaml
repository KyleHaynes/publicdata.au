faq:
- q: What does each row hold?
  a: One liquor licence active at the end of the month the release names, with its number, the
    licensee and trading name, the licence category, trading hours, patron capacity where one applies,
    the premises address, council area, region and coordinates, and the licensee's postal address.
- q: How accurate are the addresses and coordinates?
  a: The publisher states that addresses are as given on the licence application, need not follow the
    Australian address standard and may be outdated or inaccurate. About one licence in twenty has no
    coordinates, and some licences, such as remote sellers, have no premises the public can visit.
- q: How often does it change?
  a: Liquor Control Victoria publishes a new stocktake of every active licence each month. Each version
    here is one month's stocktake, so a licence that has lapsed is absent from later versions.
summary: Every active Victorian liquor licence, about 23,000, with its category, trading hours, premises
  address, council area and coordinates, from a monthly stocktake.
description: Current Victorian liquor licences by location from Liquor Control Victoria. Each row is
  one active licence at the end of the month, with the licence number, licensee, trading name, licence
  category, trading hours, patron capacity, premises street address, suburb, postcode, council, region,
  metropolitan or regional class, latitude and longitude, and postal address. The publisher states the
  addresses are as supplied on the application and may be inaccurate.
