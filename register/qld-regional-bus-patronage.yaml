faq:
- q: What is in each row?
  a: Each row is one regional bus contract area outside South East Queensland and its operator, with a point
    for the town and the number of passenger trips in each financial year from 2012/13 to 2022/23.
- q: Is there a breakdown by route?
  a: The publisher also gives one file per contract area with patronage by route. Those files are on the same
    portal page and are not part of this table.
- q: Why does a year look low for some areas?
  a: The publisher's notes record part-year figures and operator changes for some areas, such as a contract
    that ended or a ticketing problem. Read the Regional Bus Patronage Notes file on the portal page before
    comparing years.
summary: Passenger trips on each regional urban bus service in Queensland outside the south-east, by contract
  area and operator, for each financial year from 2012/13 to 2022/23.
description: 'One row per regional urban bus contract area and operator in Queensland outside South East Queensland,
  with the latitude and longitude of the town and the number of passenger trips in each financial year from
  2012/13 to 2022/23. Each financial year is its own column, as the publisher lays it out.


  The publisher''s notes file on the same page records part-year figures and operator changes.

  '
