faq:
- q: What is in each row?
  a: One contract eHealth Queensland, the Queensland Health division that runs its digital systems, awarded
    or varied, with its reference, category, description, award date, value, supplier ABN, name and address,
    whether it was varied, the procurement method and the extra fields for large contracts.
- q: What is a contract disclosure report?
  a: Queensland Government agencies must publish details of each contract they award worth $10,000 or
    more, including GST. Contracts over $500,000 carry extra fields such as the procurement method, evaluation
    criteria and deliverables, so those columns are blank for smaller contracts.
- q: Which year does it cover?
  a: The newest financial year file eHealth Queensland has published, 2026-27 in the first version here.
    This table follows the newest.
- q: Why is the contract value text?
  a: The publisher writes values with a dollar sign and thousands separators, such as $24,200,000.00,
    so the column is kept as published.
- q: Why do some contracts appear twice?
  a: The publisher's file repeats some rows exactly, with the same reference, supplier, date and value.
    They are kept as published, so check for exact copies before counting or adding up contracts.
