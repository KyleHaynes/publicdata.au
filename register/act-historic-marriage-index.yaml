faq:
- q: What is in each row?
  a: One marriage registered in the ACT, with the registration number, the surname and given names of
    each party and the date of the marriage.
- q: Why are recent marriages missing?
  a: The publisher's index holds only marriages registered in the ACT more than 75 years ago. Later
    marriages are added as they pass that age.
- q: Is this a marriage certificate?
  a: No. It is an index with limited details. A certificate is ordered from the ACT Registry of Births,
    Deaths and Marriages.
summary: An index of marriages registered in the ACT more than 75 years ago, from 1930, one row per
  marriage with the names of both parties and the date.
description: The historic marriage index Access Canberra keeps for marriages registered in the ACT more
  than 75 years ago. Each row carries the registration number, the surname and given names of each of the
  two parties and the date of the marriage.
