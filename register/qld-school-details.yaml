collection_title: 'Queensland schools: locations, enrolments and catchments'
collection_search_title: Queensland schools data
collection_description: 'The Queensland Department of Education publishes a list of every state and non-state
  school in Queensland with its address and location, the full-time enrolments of each state school by
  year level from its February census, and the catchment boundaries that set which state school a student
  is entitled to attend.


  The tables come from separate releases and carry different dates. The school list was last replaced in
  September 2022 and its student counts are from July 2019. The enrolment table covers February 2015 to 2019. The catchment boundaries are for the 2026 school year.'
