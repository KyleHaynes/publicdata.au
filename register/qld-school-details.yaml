faq:
- q: What is in each row?
  a: Each row is one open Queensland school, state or non-state, with its centre code, type, year levels,
    contact details, street and postal address, education region, electorates, council area, ABS SA2,
    remoteness, a student count and its latitude and longitude.
- q: How current is it?
  a: The file was last replaced in September 2022 and its student counts are from the July 2019 census.
    The department's online Schools Directory is kept current.
- q: Why are the student counts blank for some schools?
  a: The department gives student counts for state schools only. Non-state schools have a blank count,
    and so do a few state schools.
summary: Every Queensland state and non-state school with its address, year levels, contacts, region,
  electorates and coordinates.
description: One row per Queensland school, state and non-state, from the Department of Education's list.
  Each row gives the centre code and name, the school type and sector, the lowest and highest year levels,
  contact details, street and postal addresses, the education region, federal and state electorates, local
  government area, ABS SA2 and remoteness area, the July 2019 student count and the ABN for state schools,
  and latitude and longitude.
