faq:
- q: What is in each row?
  a: One type of registration in one month, with the number of registrations the ACT Registry of
    Births, Deaths and Marriages processed in that month. The types are births, deaths, marriages, civil
    partnerships, changes of name and changes of sex.
- q: Why are some months or types missing?
  a: The publisher leaves out any registration type with a count of 5 or less in a month, so a missing
    row means a small count, never zero.
- q: Is this the number of births in the ACT?
  a: It counts registrations by the month they were processed. A birth can be registered weeks or months
    after it happens, so the counts follow the registry's workload rather than the date of each event.
summary: The number of births, deaths, marriages and other life events the ACT registry registered each
  month since July 2017, one row per registration type and month.
description: Monthly counts of registrations processed by the ACT Registry of Births, Deaths and
  Marriages, part of Access Canberra, from July 2017. Each row carries the month, the registration type
  (birth, death, marriage, civil partnership, change of name or change of sex) and the number of
  registrations. The publisher omits any count of 5 or less.
