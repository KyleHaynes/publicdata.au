faq:
- q: What is in each row?
  a: One residential rental bond lodged with NSW Fair Trading in 2023, with the lodgement date, the postcode
    of the rented premises, the dwelling type, the number of bedrooms and the weekly rent.
- q: What do the dwelling type codes mean?
  a: Fair Trading defines F as a flat or unit, H as a house, T as a terrace, townhouse or semi-detached, O
    as other and U as unknown. Other can include rented rooms, garages and car spaces. Every row in this year's
    file carries one of these five codes.
- q: What does a null bedroom count or rent mean?
  a: Fair Trading writes U where the agent or landlord did not give the figure. It is a null value here. A
    bedroom count of 0 can be a studio or bedsitter, or premises such as a garage.
summary: Every residential rental bond lodged with NSW Fair Trading in 2023, one row per bond, with the postcode,
  dwelling type, bedrooms and weekly rent.
description: The Residential Rental Bond Lodgements workbook for 2023 from NSW Fair Trading. Each row is one
  bond lodged in the year, with the date it was lodged, the postcode of the rented premises, the dwelling type
  and number of bedrooms as the agent or landlord gave them, and the weekly rent. Two bonds with the same details
  are two rows, as published.
