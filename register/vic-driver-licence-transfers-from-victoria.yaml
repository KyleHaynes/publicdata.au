faq:
- q: What does each row hold?
  a: One calendar quarter from the first quarter of 2023, with the number of Victorian driver licences
    the department recorded as transferred to another jurisdiction in that quarter.
- q: Is this a count of people leaving Victoria?
  a: It counts licences transferred away, which is one sign of people moving. People who do not hold a
    licence, or who do not transfer it, are not counted. The file gives no breakdown by destination.
- q: How often is it updated?
  a: Quarterly. Each release adds a quarter to the file and becomes a new version here.
summary: The number of Victorian driver licences transferred to another jurisdiction in each quarter
  since the start of 2023.
description: Quarterly driver licence transfers from Victoria, published by the Department of Transport
  and Planning, one row per calendar quarter with the count of licences transferred away from Victoria.
  The companion table of transfers to Victoria gives the origin of licences coming in.
