faq:
- q: What is in each row?
  a: One footprint of a heritage place, with its heritage number and identifier, address, council, description,
    heritage class (state, local or contributory), the listing criteria and dates, the land parcels, and for state
    heritage places the register status, extent of listing and statement of significance where given. The shape
    is in the GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: Why does one place have several rows?
  a: The publisher splits a parcel that carries more than one heritage item, and some items have more than one
    footprint, so one heritage number can appear on several rows. The polygon type column says how each footprint
    was drawn.
- q: How exact are the shapes?
  a: The publisher gives an indicative footprint and rates the location of each as high or low confidence, or
    unable to locate, in the accuracy columns. A low confidence footprint may not match the building on the ground.
- q: Where are the places without a footprint?
  a: The publisher's point layer of the same places has a few more rows than the footprints. This table holds the
    footprint layer.
summary: The footprints of State Heritage Places on the South Australian Heritage Register and Local Heritage
  Places in the Planning and Design Code, along with contributory items, with address, class and listing details.
description: 'SA Heritage Places from the Department for Housing and Urban Development, the polygon layer giving an
  indicative footprint for each State Heritage Place on the South Australian Heritage Register and each Local
  Heritage Place in the Planning and Design Code. Each row carries the heritage number and identifier, the address,
  suburb and council, the description, the heritage class, the land use code, the criteria for listing, the interim
  and authorisation dates and references, the plan, parcel and title references, the location accuracy, and for
  state places the register status and date, the extent of listing and the statement of significance.'
