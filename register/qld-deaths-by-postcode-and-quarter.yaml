faq:
- q: What is in each row?
  a: One quarter of registration and one Queensland postcode of the person's residence, with the number
    of deaths registered. The newest year's file grows by a quarter as the registry adds to it.
- q: Why are some postcodes missing?
  a: The registry publishes only counts of 5 or more and only Queensland postcodes, so a postcode with
    fewer than 5 deaths in a quarter is left out, as are residents of other states.
- q: Is this the date of death?
  a: No. The registry counts deaths by the date they were registered.
summary: Deaths registered in Queensland in the newest published year by quarter of registration and residential
  postcode, where the count is 5 or more.
description: Deaths registered with the Queensland Registry of Births, Deaths and Marriages, one row per
  quarter of registration and Queensland residential postcode, for the newest year the registry has published.
  The registry leaves out counts below 5 and postcodes outside Queensland. It adds a file for each
  year and updates it during the year, and this table follows the newest one.
