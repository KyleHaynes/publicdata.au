collection_title: Vehicle registrations and driver licence transfers in the ACT
collection_search_title: ACT vehicle registration and driver licence data
collection_description: |
  Access Canberra publishes monthly counts of the vehicles registered in the ACT and of the driver licences that move between the ACT and other places.

  The collection holds three tables. Vehicles registered gives the number of registered vehicles on the first day of each month by body type and motive power, which tracks the uptake of electric and other zero emission vehicles. The two licence tables count ACT driver licences transferred to another state and licences from other states and overseas transferred to the ACT, by month.
