faq:
- q: What is in each row?
  a: One vehicle body type and motive power on the first day of one month, with the number of vehicles
    registered in the ACT. Motive power is the fuel source, such as petrol, diesel, electric or hybrid.
- q: Why do the body types change over time?
  a: The publisher reclassified heavy and light vehicles with no motive power as Trailers in May 2023,
    and split Trailers into Heavy Trailer and Light Trailer in May 2024. It corrected and re-uploaded the
    whole series on 22 July 2025.
- q: Is it the number of new registrations?
  a: No. It is the total on register at the start of each month, so the change from one month to the
    next is the net change in the fleet.
summary: The number of vehicles registered in the ACT on the first day of each month since July 2015, by
  body type and motive power, one row per body type, fuel and month.
description: Monthly totals of the vehicles registered in the ACT as at the first day of each month, from
  July 2015, as Access Canberra counts them. Each row carries the date, the vehicle body type (light
  vehicle, heavy vehicle, motorcycle or trailer), the motive power and the count.
