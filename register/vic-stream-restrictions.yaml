faq:
- q: What does each row hold?
  a: The restriction status on taking water from one unregulated stream at the end of one month, from
    January 2010, such as No restriction, a numbered stage, Restricted or Ban. Water corporations set the
    stages in each catchment's local management plan, so a stage number means different things on
    different streams.
- q: Does the status cover the whole month?
  a: No. It is the status on the last day of the month the department recorded, so a change during the
    month is not shown. The department marks n/a where no status was available, and those cells are
    null. The status words are kept in the publisher's own spelling and case.
- q: Which water corporation manages each stream?
  a: The workbook's Lookups sheet names the corporation and basin of each stream. It is not part of this
    table.
summary: The restriction status on diversions from about 250 unregulated Victorian streams at the end of
  each month since January 2010, from no restriction through rostered stages to a ban.
description: Stream restrictions from the Department of Energy, Environment and Climate Action, one row
  per stream and month end from January 2010. The status is the one Goulburn-Murray Water, GWMWater,
  Melbourne Water and Southern Rural Water applied to licence holders' diversions on the last day of the
  month under each catchment's local management rules.
