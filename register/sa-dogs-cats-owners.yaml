faq:
- q: What is in each row?
  a: The number of owners on Dogs and Cats Online who live in one council area, share a sex and age group, and keep
    the same number of dogs and of cats with the status At Home.
- q: Why do the dog and cat counts read >5?
  a: The publisher groups owners with more than five dogs or cats under >5. The value is kept as text.
- q: Which council is it?
  a: The council where the owner lives, which may differ from the council where an animal is housed.
- q: Which year does the table cover?
  a: The newest extract from Dogs and Cats Online, taken on 30 May 2025 at the first version. The publisher releases
    a new portal dataset each year, and each extract becomes a version here.
summary: The number of dog and cat owners on South Australia's Dogs and Cats Online register in each council, by
  sex, age group and how many dogs and cats they keep. Updated yearly.
description: Owner counts from Dogs and Cats Online (DACO), from the Department for Environment and Water. Each row is
  one council, owner's sex, age group, number of dogs and number of cats, with the count of owners of animals
  recorded with the status At Home.
