faq:
- q: What is in each row?
  a: One public holiday in one state or territory, with its date, its name, a sentence about it and a link
    to the state or territory page the department took it from. A holiday kept in every state has one row
    for each.
- q: Is this kept up to date?
  a: The department marked the dataset inactive in January 2026 and said it will release no further updates,
    so the last year here is 2025. It points readers to each state and territory government's own public
    holiday page for later years.
- q: How are states named?
  a: By the lower-case abbreviation the department uses, such as act, nsw or vic.
- q: Why does one holiday have no date?
  a: The department listed the 2025 Friday before the AFL Grand Final in Victoria before the date was set,
    and never added it. The row is kept with a blank date.
summary: Every gazetted public holiday in each Australian state and territory from 2021 to 2025, one row
  per holiday and state, from the Department of the Prime Minister and Cabinet.
description: The combined 2021 to 2025 file of the Australian Public Holidays Dates Machine Readable Dataset.
  Each row is one public holiday in one jurisdiction, with its date, name, a description and the source
  link the department gives. The department no longer maintains the dataset.
