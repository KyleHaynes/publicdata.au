faq:
- q: What is in each row?
  a: Each row is one reporting year, permit, field and product, with the holder, basin, reservoir type, sales
    unit, the date the estimate took effect, the estimation method, and the proved (1P), proved and probable
    (2P) and proved, probable and possible (3P) reserves split into developed and undeveloped, with the best
    estimate of contingent (2C) resources.
- q: What units are the reserves in?
  a: The sales_unit column gives the unit for each row, so check it before adding rows up. Gas is in petajoules.
    Most oil and condensate rows are in millions of barrels, and a few are in millions of barrels of oil
    equivalent. LPG is in kilotonnes, apart from one row in megatonnes.
- q: Why does this start in 2025?
  a: The 2025 report is the first compilation the publisher standardised under its data quality program. Its
    earlier compilation for 2020 to 2024 has different column names and is not included here.
summary: Proved, probable and possible petroleum and gas reserves and contingent resources reported for each
  Queensland field and permit.
description: One row per reporting year, petroleum permit, field and product type, from the publisher's compilation
  of reserves and resources reports. Each row gives the authorised holder, basin, reservoir unit type, product,
  sales unit, effective date and estimation method, and the 1P, 2P and 3P reserves as developed, undeveloped
  and total, with 2C contingent resources and a standardised field name.
