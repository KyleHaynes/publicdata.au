faq:
- q: What is in each row?
  a: The number of vehicles registered at 30 June to owners in one postcode that share one make, body type, number
    of cylinders and year of manufacture. Trailers and caravans are counted with the other vehicles and have no
    cylinders.
- q: Which date does the table cover?
  a: The newest file, vehicles registered at 30 June 2026 at the first version. The publisher adds a file each
    July, and each becomes a version here. The files back to 2014 stay on the portal.
- q: Why do so many vehicles date from 1900?
  a: The publisher appears to use 1900 where the year of manufacture is not known. That year holds far more
    vehicles than any year before the 1920s, most of them trailers. The chart leaves it out.
- q: Why do some postcodes have three digits?
  a: The publisher gives some Northern Territory postcodes without their leading zero, such as 835. They are kept
    as published.
summary: The number of vehicles registered in South Australia at 30 June, counted by owner postcode, make, body
  type, cylinders and year of manufacture. Updated yearly.
description: 'Registered vehicles by postcode from the Department for Infrastructure and Transport, which refers to
  the report as TRLB04. Each row is one owner postcode, vehicle make, body type, number of cylinders and year of
  manufacture, with the count of registered vehicles that share them.'
