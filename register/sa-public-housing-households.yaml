faq:
- q: What is in each row?
  a: One council area, with the publisher's counts of households and their characteristics in the columns named.
- q: What does n.p. mean?
  a: The publisher replaces every count for a council area with n.p. where the area has one to three households. Those
    cells are nulls here, flagged as suppressed.
- q: Are the counts exact?
  a: No. The publisher rounds counts to the nearest multiple of 5, so rows and columns may not add to the totals.
    The publisher's Total and percentage of total rows are kept as published at the end of the table, and
    because the percentage row holds fractions, every count column is typed as a number.
- q: Which date does the table cover?
  a: The newest file the publisher has released, 30 June 2021 at the first version. The files for 2019-20 stay on the portal,
    and each new file becomes a version here.
summary: The number of households living in public housing in each South Australian council area at 30 June, by composition, tenure length, main source of income and other characteristics.
description: Public housing households by Local Government Area from the South Australian Housing Trust, from South Australia's contribution to the national Public Housing data collection. Each row is one council area with the number of households and household members, Aboriginal households and households with a person with disability, average market and charged rents, the households paying less than market rent, and counts by household composition, children and older members, match of dwelling to household size, tenure length and main source of income.
