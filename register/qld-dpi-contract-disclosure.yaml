faq:
- q: What is in each row?
  a: One contract the Department of Primary Industries awarded or varied from July 2025, with the agency,
    description, award date, value, supplier name, address and ABN, whether it was varied, the procurement
    method, the commence and finish dates and the extra fields for large contracts.
- q: What is a contract disclosure report?
  a: Queensland Government agencies must publish details of each contract they award worth $10,000 or
    more, including GST. Contracts over $500,000 are meant to carry extra fields such as the evaluation
    criteria and deliverables. In the versions held so far the department leaves those columns
    blank in every row, the large contracts included, and gives no commence dates.
- q: Which period does it cover?
  a: The department's running report from July 2025, which it adds to each quarter. Its earlier quarterly
    reports are separate files in the same portal dataset.
summary: Every contract worth $10,000 or more awarded by the Queensland Department of Primary Industries
  since July 2025, with supplier, value, date and procurement method.
description: The running contract disclosure report of the Department of Primary Industries from July
  2025, one row per contract, with the agency, description, award date, value, supplier, variation, confidentiality,
  procurement method, the fields required for contracts over $500,000, the contract reference, category,
  parent arrangement, commence and finish dates and supplier ABN. The department adds to the workbook
  each quarter.
