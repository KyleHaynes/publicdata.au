faq:
- q: What is in each row?
  a: Each row is one stop or station that appears in the origin-destination trips, with its id, name, type
    and coordinates.
- q: What is a virtual stop?
  a: The publisher lists about 3,600 stops of type Virtual beside bus, rail, busway, ferry and light rail stops.
    They are kept as published.
summary: The id, name, type and coordinates of each stop used in Translink's origin-destination trip counts.
description: 'One row per stop in Translink''s origin-destination trip data, with the stop id, its name, its
  type (bus, busway, rail, ferry, light rail or virtual) and its latitude and longitude. The stop id matches
  the origin and destination stop columns of the trips table.

  '
