faq:
- q: What is in each row?
  a: One suburb, with the number of deaths registered in the newest year the registry has published. The
    registry lists suburbs from the most deaths to the fewest.
- q: Is the suburb where the person lived?
  a: The registry does not say. The suburbs with the largest counts, such as Southport and Chermside,
    hold large hospitals, so the suburb may be the place of death. The postcode and quarter table is by
    residential postcode.
- q: Why are some suburbs missing?
  a: The registry publishes only counts of 5 or more, so a suburb with fewer than 5 deaths in the year
    is left out.
summary: The number of deaths registered in Queensland in the newest published year for each suburb with
  5 or more, from the Registry of Births, Deaths and Marriages.
description: Deaths registered with the Queensland Registry of Births, Deaths and Marriages in the newest
  year it has published, one row per suburb. The registry leaves out suburbs with fewer than 5 deaths. It
  adds a file for each year, and this table follows the newest one.
