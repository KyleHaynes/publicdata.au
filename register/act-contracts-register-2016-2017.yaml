faq:
- q: What is in each row?
  a: One contract an ACT Government directorate or agency entered, with the contract number, title and
    description, the procurement method and type, the contractor and ABN, the original and current
    amounts, the execution and expiry dates, and flags for confidential text, prequalification, small and
    medium enterprises and exemptions.
- q: Why does it stop in 2017?
  a: The portal's copy was last changed in July 2017 and holds contracts executed up to June 2017, with
    one dated October 2017.
    The publisher keeps the current register on the Tenders ACT website, which this table does not cover.
summary: The ACT Government contracts register as the open data portal last held it in July 2017, mostly
  contracts executed from 2012 to June 2017, one row per contract with the contractor, amount and dates.
description: A copy of the ACT Government Contracts Register held on the ACT open data portal, last
  changed in July 2017. Most rows were executed from 2012 to June 2017 and a few reach back to 2003.
  Contracts made under a panel are mostly from before July 2016, and other contracts mostly from after it. Each row carries the contract number, title and description, the
  contract and procurement types, panel details, the procurement method, the contractor's name and ABN,
  the original and contract amounts, GST treatment, execution and expiry dates, confidentiality flags,
  up to three UNSPSC classifications, the directorate, and flags for prequalification, small to medium
  enterprises, whole of government contracts, exemptions, active certification and industrial relations
  obligations. The publisher's free-text reason for an exemption is left out.
