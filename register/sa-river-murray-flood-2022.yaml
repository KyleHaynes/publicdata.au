faq:
- q: What is in each row?
  a: One polygon of land that was under water in South Australia during the 2022 to 2023 River Murray flood,
    with the date of the imagery it was mapped from. The shapes are in the GeoParquet, GeoJSON, GeoPackage and
    PMTiles files.
- q: Which coordinates are these?
  a: The publisher supplies the layer in GDA2020 South Australia Lambert (EPSG:8059). The shapes here have been
    moved to GDA2020 longitude and latitude (EPSG:7844), as every polygon layer on this site is.
summary: The mapped extent of land flooded along the River Murray in South Australia during the 2022 to 2023
  flood, one polygon per mapped area with the date of the imagery.
description: The boundary of the land flooded along the River Murray in South Australia during the 2022 to 2023
  flood event, as mapped by the Department for Environment and Water. Each row is one polygon with the
  acquisition date of the imagery it was drawn from.
