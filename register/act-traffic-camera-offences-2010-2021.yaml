faq:
- q: What is in each row?
  a: One offence in one month at one camera location, for one registration state and client category,
    with the number of infringements and the sum of their penalties in dollars.
- q: Why does it stop in June 2021?
  a: The publisher moved to a daily series from July 2021, which is the ACT traffic and camera fines
    table in this collection. This table is closed.
summary: Camera-detected traffic infringements in the ACT by month from July 2010 to June 2021, one row
  per offence, camera location, registration state and client category, with the count and penalty total.
description: Monthly counts of the offences detected by ACT road safety cameras from July 2010 to June
  2021. Each row carries the month, the registration state, the client category, the camera type, the
  location code and its description, the offence description, the number of infringements and the sum of
  their penalty amounts.
