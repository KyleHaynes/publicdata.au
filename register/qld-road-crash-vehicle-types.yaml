faq:
- q: Are cars in this table?
  a: Every crash in the table involved at least one vehicle, and cars are the majority, but the flags
    only say whether a motorcycle or moped, a truck or a bus was involved. A row with all three flags
    false is a crash with none of those, which is usually cars only.
summary: Crash and casualty counts by year, police region and severity, split by whether a motorcycle
  or moped, a truck or a bus was involved.
description: Aggregate counts of reported Queensland road crashes from 1 January 2001 by the kinds of
  vehicle involved. Each row is one combination of year, police region, crash severity and three yes or
  no vehicle flags. Property damage only crashes stop after 31 December 2010.
