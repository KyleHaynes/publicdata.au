faq:
- q: What is in each row?
  a: One public rental or state owned and managed Indigenous housing dwelling at 30 June of the collection
    year, with its program, dwelling type, bedrooms, postcode, weekly market rent and whether it was tenantable,
    occupied or under major redevelopment.
- q: What do the numbers in the program and status columns mean?
  a: The publisher codes them. Program 1 is public rental housing and 3 is state owned and managed Indigenous
    housing. Dwelling type 1 is a separate house, 2 a semi-detached, terrace or townhouse, 3 a flat or apartment
    and 8 a boarding house unit. For tenantable, occupied and redevelopment the codes are 1 for yes, 2 for
    no and 9 for not stated.
- q: Which year does a version cover?
  a: The department publishes one package of data a year for the Productivity Commission's Report on Government
    Services, and this entry follows the newest. The 2025 report's data describes dwellings at 30 June 2024.
summary: Every Queensland public rental and state owned Indigenous housing dwelling, with its type, bedrooms,
  postcode and market rent, as supplied for the Report on Government Services.
description: One row per dwelling in Queensland's public rental housing and state owned and managed Indigenous
  housing programs at 30 June, as the Department of Housing and Public Works supplies it for the Report on
  Government Services. Each row has the program, dwelling structure, number of bedrooms, postcode, weekly market
  rent and coded flags for whether the dwelling was tenantable, occupied or under major redevelopment. The
  package also holds register, household, community housing and assistance tables that are not in this entry.
