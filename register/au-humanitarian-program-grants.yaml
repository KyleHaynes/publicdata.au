faq:
- q: What does a blank mean?
  a: The publisher shows n/a for some categories in some years. Each n/a is kept here as a null value.
- q: Why are the counts decimals?
  a: One cell in the publisher's table holds a value with a floating point remainder, such as 16193.000000000002.
    Values here are copied as published, so the column is typed as a number.
