faq:
- q: What is in each row?
  a: One place on the National Heritage List, with its place ID and file number, name, class (Indigenous,
    natural or historic), listing status, state, address, area in hectares, the date it was entered on the
    list, the date its record was updated and a link to the department's page for the place. Its boundary is
    in the GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: Is every listed place here?
  a: The department leaves out places subject to confidentiality agreements, and nominations under
    assessment, rejected, ineligible, removed or destroyed. A few places are made of several parcels, each
    its own row. The file also holds places nominated for the list, with the status Nominated place, and
    parts of listed places, with the status Within listed place.
- q: What are the Shape area and length columns?
  a: They are the area and perimeter the map service works out in its own coordinates, kept as published.
    The area in hectares is the department's own figure.
summary: The places on the National Heritage List and the places nominated to it, each with its boundary,
  class, state, address and listing date, from the Department of Climate Change, Energy, the Environment and Water.
description: The public National Heritage List spatial database, read from the department's map service.
  Each row is one place, or one parcel of a place, with its identifiers, name, class, status, state, source of the boundary,
  area, listing and update dates, address and page link, and its boundary as a polygon.
