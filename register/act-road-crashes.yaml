faq:
- q: Does it include every crash in the ACT?
  a: No. The publisher includes crashes reported by police or the public through the AFP Crash Report
    Form. A crash reported another way, or not reported, is not here. The publisher also notes a
    backlog of entries, so recent months rise in later releases.
- q: How accurate are the locations?
  a: The publisher says a crash location is indicative and may not be the exact position of the people
    involved.
- q: How often is it updated?
  a: The publisher adds rows to the portal through the year. This site checks it weekly and adds a
    dated version when the rows change.
summary: Every crash in the ACT since 2015 reported through the AFP Crash Report Form, one row per crash,
  with its coordinates, suburb, severity, type, lighting, road and weather conditions.
description: One row per crash on an ACT road since 1 January 2015, as reported by police or the public
  through the Australian Federal Police Crash Report Form. Each row carries the date and time, suburb,
  coordinates, whether it was at an intersection or midblock, the direction and type of crash, its
  severity, and the lighting, road surface and weather at the time.
