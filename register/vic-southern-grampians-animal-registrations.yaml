faq:
- q: What does each row hold?
  a: One dog or cat on Southern Grampians Shire's register when the file was published, with the
    council's registration reference, type, whether it is microchipped and desexed, sex, the town and the
    ABS mesh block it is registered in. Names, owners and addresses are not in the file.
- q: Which columns are left out?
  a: The file's name column is empty, and its row id, council code, property assessment number and
    feature id are not republished. The assessment number points to a rated property, so it is held back.
- q: Is it current?
  a: The portal dates the file June 2021. It is a single snapshot of the register and has not been updated since.
summary: About 2,800 dogs and cats on the Southern Grampians Shire register, with type, sex, desexing,
  microchip, town and ABS mesh block.
description: Southern Grampians Shire's animal registrations as published on data.gov.au, one row per
  registered dog or cat with its registration reference, type, microchip and desexed flags, sex, town in
  lower case as published and the ABS mesh block code of its registered address.
