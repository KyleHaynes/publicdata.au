faq:
- q: What is in each row?
  a: One fixed or transportable site for the cameras that detect drivers using a mobile phone, with the
    site name, suburb, coordinates, the direction of travel monitored, the site type and the location code.
- q: How do I link it to the fines?
  a: The location code matches the camera location in the ACT traffic and camera fines table in this
    collection, where these cameras' infringements carry the type TRF_MDDC.
summary: The fixed and transportable sites the ACT uses for mobile phone detection cameras, one row per
  site with its coordinates and the direction of travel monitored.
description: The sites of the ACT's mobile distraction cameras, which detect drivers using a mobile phone,
  as Access Canberra lists them. Each row carries the site name, suburb, latitude and longitude, the
  direction of travel monitored, whether it is a fixed or transportable site, and the location code.
