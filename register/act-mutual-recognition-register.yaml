faq:
- q: What is in each row?
  a: One registration of a person working in the ACT under the Automatic Mutual Recognition scheme, with
    their name, licence number, licence category, type and subclass, any conditions, the state that issued
    the home licence and its expiry date.
- q: How accurate is it?
  a: The publisher says the fields reflect what the interstate registrant gave when they applied, and
    recommends checking the home state's public register to confirm a licence.
summary: Every registration of a person working in the ACT on an interstate licence under the Automatic
  Mutual Recognition scheme, one row per registration with the licence category and issuing state.
description: The public register of Automatic Mutual Recognition registrations Access Canberra keeps.
  Each row carries the licensee's name, the licence number, the licence category (such as security,
  professional engineer, agent or architect), the licence type, the subclass, any conditions, the state or
  territory that issued the licence and the expiry date.
