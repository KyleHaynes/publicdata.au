faq:
- q: What is in each row?
  a: One NSW public school term, with the first and last day students attend. The school holidays are
    the gaps between one term's end and the next term's start.
- q: Is this table still updated?
  a: Transport for NSW marks the file as no longer updated, and it ends with Term 4 of 2025. The Department
    of Education sets the term dates for NSW public schools and publishes later years on its own site.
- q: Do the dates include school development days?
  a: The publisher notes that school development days fall at the start of Terms 1, 2 and 3 and on the
    last two days of the school year, and that schools may vary some dates.
summary: The first and last day of each NSW public school term from 2019 to 2025, as Transport for NSW
  lists them.
description: The NSW Public School Days table from Transport for NSW's School and public holidays dataset.
