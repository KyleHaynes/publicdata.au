faq:
- q: What does each row hold?
  a: One Victorian prison or correctional centre, with its address, town, phone number, operational
    capacity, security level, a street directory map reference, a short profile and, for some, a link to
    the department's page about it.
- q: When is the capacity from?
  a: The publisher states the operational capacity as at 30 June 2009. The file was published in 2013 and
    has not changed since, so prisons opened or closed after then are not reflected.
- q: Why is there a row that is not a prison?
  a: The publisher ends the file with its footnote on the capacity date, which is kept as published.
summary: The 14 prisons and correctional centres in Victoria with their address, security level and
  operational capacity as at 30 June 2009.
description: Locations of Victoria's public and private prisons and correctional centres, one row per
  facility, from the Department of Justice. Each row gives the address, town, phone number, security level
  and operational capacity as at 30 June 2009, with a short profile of the prisoners it holds. The links in
  the file point to department pages that have since moved.
