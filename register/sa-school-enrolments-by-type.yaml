faq:
- q: What is in each row?
  a: One type of government school, such as primary, area or special schools, with its full-time equivalent
    enrolments in each year's Term 3 census from 2012 to 2023, one column per year.
- q: What is a full-time equivalent enrolment?
  a: A student enrolled full time counts as one and a part-time student as the fraction of full time they attend,
    so the figures can carry decimals.
- q: Why do primary enrolments fall and high school enrolments rise in 2022?
  a: South Australian government schools moved Year 7 from primary school to high school from 2022, so
    about 12,000 FTE enrolments left primary schools and about 10,000 joined high schools that year.
- q: Why are junior primary enrolments so high in 2012?
  a: The publisher gives 4,900.4 for junior primary schools in 2012 and 488.0 in 2013, about a tenth as many.
    The file gives no reason, and the figure is kept as published.
summary: Full-time equivalent enrolments at South Australian government schools by type of school in each year from
  2012 to 2023, from the Term 3 enrolment census.
description: Enrolments by School Type from the Department for Education. Each row is one type of government school
  with its full-time equivalent enrolments in each year from 2012 to 2023, collected in the annual Term 3 enrolment
  census. The publisher leaves the years blank for a school type with no enrolments, such as rural schools after
  2013.
