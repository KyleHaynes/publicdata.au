faq:
- q: What is in each row?
  a: One postcode, dwelling type and number of bedrooms, with the number of rental bonds lodged in the quarter and
    the median weekly rent of those bonds. Dwelling types are flats and units, houses, and other or unknown.
    Flats and houses run from 1 to 4 or more bedrooms, and other or unknown dwellings have no bedroom count.
- q: What does a star mean?
  a: The publisher writes a star in place of the number of bonds where there are 1 to 5 dwellings. That count is
    a null here, flagged as suppressed, and the median beside it is kept.
- q: Which quarter does the table cover?
  a: The newest quarterly report, April to June 2026 at the first version. The publisher adds a report each
    quarter, and each becomes a version here. The reports back to 2013 stay on the portal.
- q: What are the Total rows?
  a: The publisher's Metro Total, Country Total and Grand Total rows are kept as published, in the postcode column.
    The publisher's total columns across dwelling types are left out, since they sum the other columns.
summary: The number of new rental bonds and the median weekly rent in each South Australian postcode for the newest
  quarter, by dwelling type and number of bedrooms. Updated quarterly.
description: 'The Postcode sheet of the Private Rent Report from the SA Housing Trust, built from the Rental Bond
  Data Set of the Tenancies Branch of Consumer and Business Services. Each row is one postcode, dwelling type and
  number of bedrooms, with the number of bonds lodged in the quarter and their median weekly rent.


  The publisher excludes bonds that were cancelled or unlodged, rounds the flat and house totals to the nearest
  5, and replaces the number with a star where there are 1 to 5 dwellings.'
