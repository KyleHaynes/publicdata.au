faq:
- q: Can I look up my suburb?
  a: Yes. Each row names the suburb or town, its postcode and its council area. A suburb appears only for
    the offence subgroups that had at least one offence recorded in that year.
- q: Why is there no rate for a suburb?
  a: The CSA publishes counts for suburbs and does not publish a population for them, so this table has
    counts only. Rates are published for council areas in the table of offences by council area.
- q: What period does each year cover?
  a: Each year is the twelve months ending in the month named in year_ending. A year of 2026 with a year_ending
    of June covers July 2025 to June 2026.
summary: Offences recorded by Victoria Police in each suburb and town, by offence subgroup, for each of
  the last ten years.
description: Offences recorded by Victoria Police for each suburb or town, with its postcode and local
  government area, by offence division, subdivision and subgroup, for the ten years to the end of the
  latest quarter. This is table 3 of the Crime Statistics Agency's workbook of recorded offences by local
  government area.
