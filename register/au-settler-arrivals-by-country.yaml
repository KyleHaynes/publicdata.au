faq:
- q: Why do country names change between tables?
  a: Each table uses the country classification of its time, and the table column says which one a row comes
    from. Names are kept as published, so a country can appear under a different name or region in another
    table.
- q: What does a suppressed value mean?
  a: The publisher shows fewer than 5 people as "<5", and a small negative figure as "> -5". Each is kept
    here as a null value with a suppressed flag, and never as 0 or 5.
summary: Settlers who arrived in Australia each year from January 1959 to June 1996, by region and country of
  birth.
description: Settler arrivals for each period from January 1959 to June 1996, by region and country of birth, from
  tables 1.2 to 1.4 of Historical Migration Statistics. The publisher's regions and country names change
  between tables, and each row keeps the names of its own table.
