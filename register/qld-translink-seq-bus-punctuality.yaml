faq:
- q: What is in each row?
  a: Each row is one month and the proportion of Translink bus services in South East Queensland that ran on
    time, written as a fraction of 1.
- q: How far back does it go?
  a: At review the file held about 30 months, starting in late 2023. Each fetch here is kept as a version,
    so a month the publisher later drops stays in an earlier version.
summary: The monthly share of Translink bus services in South East Queensland that ran on time.
description: 'One row per month with the overall on-time running of Translink bus services in South East Queensland,
