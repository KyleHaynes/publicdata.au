faq:
- q: Is this the same as net overseas migration?
  a: No. The Migration Program outcome counts permanent visas granted each financial year under the planned
    program. Net overseas migration is the ABS measure of people arriving minus people leaving, and it includes
    temporary residents such as students.
- q: Why do some stream names end in a number?
  a: The numbers are the publisher's footnote markers, kept as published. The footnotes are in the workbook,
    and they explain changes in how each stream was counted.
- q: Are the early years exact?
  a: The publisher notes that figures from 1983-84 to 1994-95 are rounded and reflect changes in reporting.
