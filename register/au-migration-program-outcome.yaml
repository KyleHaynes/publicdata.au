collection_title: Historical Migration Statistics
collection_description: |
  Historical Migration Statistics is the Department of Home Affairs' workbook of migration to Australia since 1945. It brings together the tables the department and its predecessors published over that time, under the classifications each used.

  Five of its tables are here. The Migration Program outcome by stream covers every year since 1984-85, and the Humanitarian Program grants every year since 1977-78. The program outcome by citizenship covers 1996-97 onwards. Settler arrivals by country of birth run from 1959 to 1996, and permanent additions by country of birth from 1996-97 to 2016-17.
