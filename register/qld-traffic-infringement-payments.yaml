faq:
- q: What is in each row?
  a: One day, one transaction type and one service channel, such as Online Services, BPAY or a customer
    service centre, with the number of traffic infringement notice payments made that way.
- q: Is this the value of fines paid?
  a: No. Each row counts payments. The file holds no dollar amounts.
summary: The daily number of traffic infringement notice payments made to the Department of Transport
  and Main Roads in Queensland, by service channel.
description: The number of traffic infringement notice payments the Department of Transport and Main Roads
  processed each day, one row per day, transaction type and service channel. The department replaces the
  file with a longer one from time to time.
