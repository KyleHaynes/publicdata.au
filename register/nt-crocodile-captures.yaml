collection_search_title: NT crocodile capture data
collection_description: |
  The Parks and Wildlife Commission of the Northern Territory removes crocodiles from waters near
  towns inside defined capture zones. This collection holds the record of every crocodile captured,
  from the Croc Capture Database, and the boundaries of the nine capture zones. The publisher does not
  release the location of its traps, so a capture is placed only by its zone, group and location name.
