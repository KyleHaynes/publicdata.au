faq:
- q: What is in each row?
  a: One crocodile captured, with the date, species, capture method, total length, head length and
    snout to vent length in centimetres, sex, whether the tail was complete, and the region, capture
    zone, location group and location where it was caught.
- q: Where exactly was each crocodile caught?
  a: The publisher does not release trap coordinates. Each capture is placed by its zone, a location
    group such as a river or creek, and a location name.
- q: How often is it updated?
  a: The publisher adds captures to the file through the year. The September 2026 file runs to 30
    September 2026. This site checks it weekly and adds a dated version when the file changes.
summary: Every crocodile captured in the Northern Territory's crocodile capture zones since 2002, one
  row per animal, with date, species, size, sex, capture method and zone.
description: The daily capture records of the Parks and Wildlife Commission of the Northern Territory,
  from the Croc Capture Database, one row per crocodile captured since April 2002. Each row carries
  the date of capture, scientific and common name, capture method, total length, head length and snout
  to vent length in centimetres, sex, whether the tail was complete, the region, the capture zone name
  and code, the location group and the location. The publisher ships the table as a workbook inside
  the capture zones download.
