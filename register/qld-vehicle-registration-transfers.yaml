faq:
- q: What is in each row?
  a: One year from 2007, one transfer transaction type, the purpose of use before and after the transfer,
    and one make, model and body shape, with the number of registration transfers.
- q: What do the purposes mean?
  a: The department uses Dealer for a vehicle registered to a dealer to sell it, Private for personal
    use and Non-Private for commercial use. A transfer from Dealer to Private is usually a sale by a dealer
    to a person.
- q: Why are the 2023 counts lower?
  a: The file was last changed in October 2023, so its 2023 counts cover only part of that year. The chart
    stops at 2022 for that reason.
- q: Why are there two transaction types?
  a: The publisher wrote Registration Transfer for 2007 and part of 2008 and Transfer Registration from
    then on. Both name the same transaction.
summary: The number of vehicle registrations transferred in Queensland each year since 2007, by transfer
  type, purpose of use before and after, and make, model and body shape.
description: Yearly counts of vehicle registration transfers processed by the Department of Transport
  and Main Roads, one row per year, transaction type, purpose of use before and after the transfer, make,
  model and body shape. The file runs from 2007 to 2023.
