faq:
- q: What is in each row?
  a: One first name, one sex and one year from 1960 to 2005, with the number of babies registered with
    that name. The registry gives the top 100 names for each sex in each year, so a name appears only
    in the years it was in the top 100.
- q: Why are the names in capitals?
  a: The registry wrote them in capitals in this file. They are kept as published.
summary: The 100 most registered girl and boy names in Queensland for each year from 1960 to 2005, one
  row per name, sex and year, with the count of babies.
description: A closed series from the Queensland Registry of Births, Deaths and Marriages of the top 100
  first names given to girls and to boys whose births were registered in Queensland in each year from
  1960 to 2005, with the number of babies given each name. The registry publishes later years as one file
  each, which the latest year table follows.
