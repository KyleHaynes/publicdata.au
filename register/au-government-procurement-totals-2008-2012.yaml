faq:
- q: What is in each row?
  a: One financial year from 2008-09 to 2011-12, with the total value in dollars of the contracts
    Australian Government agencies reported on AusTender, split into goods and services, the Defence
    share of each, goods and services sourced in Australia and overseas, and the value awarded to small
    and medium enterprises.
- q: Is this updated?
  a: The department published these four years in 2013 and has not added to the file. Later figures are in
    the department's yearly statistics on Australian Government procurement contracts.
summary: The total value of Australian Government contracts reported on AusTender each year from 2008-09
  to 2011-12, by goods and services, Defence, source country and small business share.
description: The Department of Finance's aggregated procurement statistics from the AusTender contract
  system for 2008-09 to 2011-12. Each row is one financial year with the dollar value of contracts reported,
  in total and split by goods and services, Defence, Australian or overseas sourcing, and the value awarded
  to small and medium enterprises.
