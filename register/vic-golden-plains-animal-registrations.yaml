faq:
- q: What does each row hold?
  a: One dog or cat on Golden Plains Shire's register when the file was published, with its name, breed,
    colour, sex, whether it is desexed and microchipped, the council's registration reference, the suburb
    and postcode, and the registration class. Owners and addresses are not in the file.
- q: What is the class?
  a: The council's registration category, such as Category 1, Category 2 or Category 2 Pensioner, which
    sets the fee. Some values carry a trailing space in the file, and the text is kept as published.
- q: Is it current?
  a: The portal dates the file March 2016. It is a single snapshot of the register and has not been updated since.
summary: About 6,400 dogs and cats on the Golden Plains Shire register, with name, breed, colour, sex,
  desexing, microchip, town and registration class.
description: Golden Plains Shire's animal registrations as published on data.gov.au, one row per
