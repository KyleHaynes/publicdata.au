faq:
- q: What is counted?
  a: The number of people who received support from a specialist homelessness agency in each month, by
    state or territory, sex and age group, as agencies report to the Specialist Homelessness Services
    Collection. A person supported in two states in one month is counted in each. The National column
    is the Institute's own national count and is kept as a state value named National.
- q: How current is it?
  a: The Institute releases the monthly tables every few months, each release replacing the workbook with
    a new file that runs to the latest month. Each version here is one release. Recent months are revised
    in later releases as agencies finalise their reporting.
- q: Why does the attribution say "based on" AIHW material?
  a: The Institute publishes its data tables under CC BY 4.0 and asks that material adapted from them,
    which republishing in other formats is, carry the words "Based on Australian Institute of Health and
    Welfare material". Every file here carries them. The Institute has not endorsed this site.
summary: Clients of specialist homelessness services in each month since July 2017, by state and territory,
  sex and age group, from the AIHW monthly data tables. Updated with each release.
description: The Clients sheet of the Australian Institute of Health and Welfare's Specialist Homelessness
  Services monthly data tables, one row per month, sex, age group and state or territory, with the number
  of clients supported. The Institute publishes the sheet with a column per state; it is one row per state
  here.
