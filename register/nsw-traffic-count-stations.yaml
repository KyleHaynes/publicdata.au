faq:
- q: What is in each row?
  a: One traffic counting station, with its station key and ID, its road, nearest intersection, road hierarchy
    and classification, council area and suburb, the counting device, whether it is a permanent station or
    classifies vehicles, its quality rating and its latitude and longitude.
- q: How do I get the counts for a station?
  a: The yearly traffic counts are in the other table of this collection, keyed by the same station key.
summary: Every Transport for NSW traffic counting station, with its road, location, counting device and coordinates.
description: The Road Traffic Counts Station Reference table from Transport for NSW's NSW Roads Traffic Volume
  Counts dataset, as the publisher exports it from its traffic volume API. Each row is one counting station
  with its road and intersection, road classifications, region, council area, suburb and postcode, device type
  and flags for permanent and classifying stations, Lambert coordinates and WGS84 latitude and longitude, and
  the date the record was updated.
