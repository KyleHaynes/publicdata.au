collection: nsw-traffic-volume-counts
collection_title: NSW Roads Traffic Volume Counts
collection_description: Traffic counts from Transport for NSW's permanent and sample counting stations on NSW
  roads. One table describes each counting station and where it is. The other gives the yearly traffic count
  at each station by direction, vehicle class and period of the week. The two join on the station key.
collection_search_title: NSW traffic volume data by road and station (Transport for NSW)
search_title: NSW traffic counter locations (Transport for NSW traffic count stations)
