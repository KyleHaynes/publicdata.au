faq:
- q: What is in each row?
  a: Each row is one financial year, written as 2008-09, with the number of passenger trips on Traveltrain
    long-distance rail services in each of its four quarters. Quarter 1 is July to September. The newest
    financial year leaves a quarter blank until the publisher reports it.
summary: Passenger trips on Queensland's Traveltrain long-distance rail services in each quarter of each financial
  year from 2008-09.
description: 'One row per financial year from 2008-09 with the number of passenger trips on Traveltrain services
  in each quarter, from the Department of Transport and Main Roads. Traveltrain is the state''s long-distance
  passenger rail network. Each quarter is its own column, as the publisher lays it out, and quarter 1 is July
  to September.

  '
