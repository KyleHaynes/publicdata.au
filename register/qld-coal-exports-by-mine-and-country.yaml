faq:
- q: What is in each row?
  a: Each row is one mine, one financial year and one destination country, with the tonnes exported of hard
    coking coal, PCI, semi-soft coking coal and thermal coal, and their total.
- q: What is PCI coal?
  a: PCI is pulverised coal injection coal, which steelmakers inject into blast furnaces. The publisher reports
    it as its own coal type.
summary: Tonnes of coal each Queensland mine exported to each destination country by financial year since FY2010,
  by coal type.
description: One row per Queensland coal mine, financial year and destination country from FY2010, with export
  tonnes of hard coking coal, PCI, semi-soft coking coal and thermal coal and the total. This is the Exports
  by mine and country sheet of the coal industry review statistical tables.
