collection_description: |
  The Queensland Fire Department publishes the locations of its urban fire stations and rural fire stations, and the Queensland Police Service publishes the locations of its police stations. Each list is refreshed monthly.

  Each row is one station with its coordinates. Not every rural fire brigade has a station, so the rural list does not cover every brigade.
faq:
- q: What is in each row?
  a: One urban fire station of the Queensland Fire Department, with its name, address, locality, an alternative
    address where given, its crewing code, its emergency management levy class and its coordinates in
    GDA94 and GDA2020.
- q: What do the crewing codes mean?
  a: The publisher writes P, A or C and does not define them in the file. They are kept as published.
summary: Every urban fire station of the Queensland Fire Department, with address, crewing code, levy
  class and coordinates in GDA94 and GDA2020. Updated monthly.
description: The urban fire stations of the Queensland Fire Department, formerly Queensland Fire and Emergency
  Services, one row per station, with its address, locality, alternative address, crewing code, emergency
  management levy class and longitude and latitude in both GDA94 and GDA2020. The department uploads the
  file automatically each month.
