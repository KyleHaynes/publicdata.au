faq:
- q: What is in each row?
  a: Each row is one correctional centre run by Queensland Corrective Services. It gives the centre's security type, street and postal address, coordinates, phone numbers, the times visits can be booked and held, and transport to the centre.
- q: Why do some text fields contain symbols such as asterisks and hashes?
  a: The publisher writes the visiting, booking and transport text with Markdown or HTML formatting. The text is kept as published, formatting marks included.
summary: The location, security type, contact details and visiting arrangements of each Queensland correctional centre.
description: One row per correctional centre run by Queensland Corrective Services, with its security or centre type, street and postal addresses, latitude and longitude, phone and email contacts, the times visits can be booked and held, visitor arrival rules, transport to the centre and a link to its visitor factsheet. The Updated column is the date the publisher last changed the row.
