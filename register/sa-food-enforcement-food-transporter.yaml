faq:
- q: What is in each row?
  a: One kind of business in the food transporter sector, with the number of such businesses, the number councils inspected in
    the financial year, the number that needed enforcement action, and the improvement notices, prohibition orders,
    expiations and prosecutions councils issued.
- q: Which year does the table cover?
  a: The financial year of the newest Annual Food Act Report, 2024-25 at the first version. The publisher releases a
    new report each year, and each becomes a version here. The columns can change between reports, as when the
    written warnings column was dropped after 2022-23.
summary: The number of food transporters and distributors in South Australia, how many councils inspected and the enforcement actions that followed,
  by kind of business, from the newest Annual Food Act Report.
description: The council enforcement table for the food transporter sector from SA Health's Annual Food Act Report. Each row is one
  kind of business, as the risk classification names it, with the total number of businesses, the number inspected
  by councils in the financial year, the number requiring enforcement action, and the counts of improvement notices,
  prohibition orders, expiations and prosecutions.
