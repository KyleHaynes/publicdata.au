faq:
- q: What does each row hold?
  a: One public place where a person with measles was during their infectious period, with the exposure
    date and time, the location and the date to monitor for symptoms up to, as the Department of Health
    lists it.
- q: Why is the list sometimes empty?
  a: The department removes a site once its symptom monitoring period has passed, so the list holds only
    current sites. When there are none it holds a single row whose location says there are currently no
    measles exposure sites in Victoria.
- q: How is the history kept?
  a: The list is read each day, and each day it changes is kept as a version, so earlier versions hold the
    sites listed on those days. The department's own page is the place to check for current health advice.
summary: The public places in Victoria where people may have been exposed to measles, as currently listed
  by the Department of Health, kept as a version each day the list changes.
description: The Department of Health's list of current public measles exposure sites, identified through
  public health investigations of confirmed cases. Each row is one site with the exposure date and time,
  the location and the date until which people who were there should watch for symptoms. Private addresses
  are not listed, and sites are removed once the monitoring period has passed.
