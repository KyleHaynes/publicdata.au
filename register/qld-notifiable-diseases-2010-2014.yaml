faq:
- q: What is in each row?
  a: One notifiable condition in one quarter, with the number of cases notified to Queensland Health. Quarters
    are counted by the date of onset, and quarter 1 is January to March.
- q: Is this series kept up to date?
  a: No. The publisher released this file for January 2010 to December 2014 and has not extended it. Queensland
    Health reports later notifications elsewhere.
- q: Why are some conditions missing in some quarters?
  a: A condition with no notified cases in a quarter has no row for that quarter.
summary: The number of cases of each notifiable communicable disease reported to Queensland Health in each
  quarter from 2010 to 2014.
description: One row per notifiable condition per quarter from January 2010 to December 2014, with the count
  of cases notified to the Queensland Department of Health, by quarter of onset. Conditions include influenza,
  pertussis, dengue, chlamydia and Ross River virus among 67 named in the file.
