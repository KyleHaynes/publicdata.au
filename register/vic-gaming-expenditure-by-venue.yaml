faq:
- q: What does each row hold?
  a: One hotel or club venue with gaming machines and one financial year, with the venue's region, council
    area and type and the amount players lost on its machines in that year, in dollars. Each sheet of the
    publisher's workbook is one year, and its name is kept in the financial year column.
- q: What is expenditure?
  a: The commission defines gaming machine expenditure as the net amount players lost, which is the
    amount wagered less the winnings paid out. It is the venue's gaming revenue before tax.
- q: What is in the publisher's file that is not here?
  a: The workbook also splits each year into two half years and gives each venue's average number of
    machines. Those columns change name every year, so they are left out, and the half years add up to
    the year's figure. The row with no venue name is the publisher's total for the state, kept as
    published. The Melbourne casino is not in the data.
summary: The amount players lost on poker machines at every Victorian hotel and club venue in each of
  the last three financial years, with the venue's council area and type.
description: Current gaming expenditure by venue from the Victorian Gambling and Casino Control
  Commission. Each row is one gaming venue and one financial year, with the venue name, metro or country
  region, local government area, venue type and electronic gaming machine expenditure in dollars. The
  workbook covers three financial years and is replaced each year.
