collection_description: |
  The Victorian Gambling and Casino Control Commission (VGCCC) publishes the amount players lost on electronic gaming machines, or pokies, at each hotel and club venue in Victoria in each financial year. Expenditure is the amount wagered less the winnings paid out.

  The commission publishes the latest three financial years in one workbook and the years from 2008-09 to 2021-22 in another. Each is its own dataset here, with one row per venue and year.
