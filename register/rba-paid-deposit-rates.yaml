faq:
- q: How do these differ from advertised rates?
  a: These are the weighted average rates banks actually paid on deposits outstanding at the end of each
    month, and on new term deposits taken in the month, split between households and institutions and
    between at-call and term deposits. The advertised rates are in the retail deposit and investment rates
    table.
- q: Where does the data come from?
  a: Banks report to APRA under the Economic and Financial Statistics collection and the RBA compiles
    the averages. The RBA marks the source as APRA and RBA jointly and both are named in the attribution.
- q: Under what licence is RBA data republished here?
  a: The RBA excludes its numerical data from the CC BY 4.0 licence that covers the rest of its site,
    and instead permits it to be used, reproduced, published and communicated to the public for personal
    or commercial use under sections 4 and 5 of its copyright notice, with attribution and no claim of
    endorsement. The RBA does not endorse this site or any use of this data, and it publishes the same
    figures free of charge at rba.gov.au. Every file here carries that attribution.
summary: Weighted average interest rates banks paid on outstanding deposits and on new term deposits each
  month since July 2019, for households and institutions, at-call and term. Updated monthly.
description: Statistical table F4.1, Paid Deposit Rates, from the Reserve Bank of Australia, compiled
  from APRA's Economic and Financial Statistics collection. One row per month end from 31 July 2019 with
  the weighted average rate, per cent per annum, paid on all outstanding deposits, on at-call deposits
  and on term deposits, each in total and for households and institutions, and on new term deposits taken
  in the month.
