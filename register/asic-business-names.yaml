faq:
- q: Why is there no query API for this dataset?
  a: Each weekly version is a table of millions of rows, and this site loads a version's rows into its query
    database only where they fit. The files carry the whole table in every format, and the Parquet file
    answers most questions in one read.
- q: Which business names are in the file?
  a: Every business name registered with ASIC on the day the file was made, and every name deregistered
    in the twelve months before it. Each row is one name with its status, the date it was registered, the
    date it was cancelled if it has been, and the ABN of its holder when ASIC holds one.
- q: Is this the whole ASIC register?
  a: No. ASIC publishes selected public fields from its Business Names register once a week. The holder's
    name, address and the register's other details are not in the file and are found through ASIC Connect.
- q: Why are some names deregistered?
  a: A name is deregistered when its holder cancels it or ASIC cancels it, for example when the renewal
    fee is not paid. The publisher keeps deregistered names in the file for twelve months, with the
    cancellation date.
- q: What are the state registration number and state of registration?
  a: Business names were registered by each state and territory until the national register began in
    2012. A name carried across from a state register keeps the number that state gave it and the state
    that gave it. Names registered nationally since then have neither.
summary: Every business name registered with ASIC, with its status, registration and cancellation dates,
  the holder's ABN and any state registration it was carried over from. About 3.3 million names, updated
  weekly.
description: The ASIC Business Names Dataset, one row per business name on the national Business Names
  register, as ASIC publishes it every Wednesday. Each row has the name as registered, whether it is
  registered or deregistered, its registration date, its cancellation date when it has one, the holder's
  ABN, and for names carried over from a state or territory register before 2012, the number and state of
  that registration. Deregistered names stay in the file for twelve months.
