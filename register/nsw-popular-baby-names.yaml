faq:
- q: What is in each row?
  a: One name in one year's list for boys or for girls, with its rank in that list and the number of babies
    registered with it. Each year's list has the 100 names given most often to each sex.
- q: Which year does a list belong to?
  a: The Registry builds each year's list from the births registered in that calendar year. A baby born
    late in one year and registered early in the next is counted in the later year.
- q: Why can a list have more than 100 names?
  a: Names with the same count share a rank, so a tie at the bottom of a list can carry it past 100 names.
    The rows are kept as the Registry publishes them.
summary: The 100 names given most often to boys and to girls in New South Wales in each year since 1952,
  with each name's rank and the number of babies registered with it. Updated yearly.
description: The Popular Baby Names list from the NSW Registry of Births Deaths and Marriages, which combines
  each year's list since 1952 into one file. Each row is one name, sex and year, with the name's rank
  in that year's list and the number of births registered with it. Names are in capitals as published.
