faq:
- q: What is in each row?
  a: One offence detected by a fixed or mobile safety camera, with the incident date and time, the offence code
    and description, the notice's revision and status, the camera's location, the vehicle, the speed and limit
    where it was a speeding offence, and the penalty, levy, corporate fee and total.
- q: Is each row one fine?
  a: No. Each row is one offence. A notice may hold several offences and may be withdrawn and reissued, so one
    Event ID can appear on several rows, each with its notice revision.
- q: Which period does the table cover?
  a: The financial year of the newest report, 2026-27 at the first version, which the publisher replaces as the
    year goes on. Each new file becomes a version here, and the reports back to 2011-12 stay on the portal.
- q: Why are the amounts text?
  a: The publisher writes each amount with a dollar sign and a thousands separator, such as $1,002. The amounts
    are kept as published.
summary: Every offence detected by a fixed or mobile safety camera in South Australia in the newest financial year,
  one row per offence with its location, vehicle, speed, status and penalty.
description: 'The Camera Offence Report from South Australia Police''s Expiation Notice Branch. Each row is one
  offence from a fixed or mobile camera, such as speeding, a red light or a mobile phone, with the event and
  notice revision it belongs to, the notice and offence status and any withdrawal reason, the incident date and
  time, the offence code and description, the issue date, the camera category and location, the police district,
  the vehicle and the states of licence and registration, the speed and limit, and the amounts.


  The report format changed from 2022-23. Earlier years on the portal follow the publisher''s legacy layout.'
