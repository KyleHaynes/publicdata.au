collection_description: Offences raised by South Australia Police for expiation, from the Expiation Notice Branch's
  offence reports for each financial year. One table lists offences detected by fixed and mobile safety cameras and
  another those on notices written by officers. A third lists camera detections that did not become an offence,
  and a fourth names each mobile camera location code.
