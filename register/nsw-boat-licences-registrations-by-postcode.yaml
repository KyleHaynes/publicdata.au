faq:
- q: What is in each row?
  a: One postcode and one kind of current licence or registration, with the number held by people or
    vessels recorded at that postcode on the day the report was run. The kinds are the general boat
    licence and the personal watercraft (PWC) boat licence, and the registrations of recreational vessels
    (RV) and recreational personal watercraft (PWCR).
- q: Why are some postcodes not Australian?
  a: The postcode column is the address on the customer record as Transport for NSW holds it. It includes
    overseas postcodes and placeholder text such as return to sender, and these rows are kept as published.
- q: What does a blank count mean?
  a: The report leaves a cell blank where a postcode has no current licence or registration of that kind.
    It is a null value here.
- q: How often is it updated?
  a: Transport for NSW runs the report at the start of each month and replaces the file, so each version
    is one month's report.
summary: The number of current NSW boat driver licences and recreational vessel registrations at each
  postcode, by licence and registration type, from Transport for NSW's monthly report.
description: The TRP-RM-15 GLS Licences and Registration Report by display names and postcode from Transport
  for NSW. The report has a column for each licence and registration type; each cell is one row here,
  with the postcode, whether the record is current, the product group (boat driver licence or vessel registration),
  the type and the count. Counts cover recreational boating, the area Maritime NSW deals with.
