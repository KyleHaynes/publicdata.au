faq:
- q: What is in each row?
  a: One Bushfires NT site, either an office headquarters or a volunteer bushfire brigade, with its site
    code, name, fire management zone, street address, land parcel, and latitude and longitude.
- q: Why do two rows share an address?
  a: Where a brigade works from a Bushfires NT office, as in Alice Springs, the publisher lists the
    office and the brigade as two sites at one address.
- q: How often is it updated?
  a: The publisher updates the file when a site changes. This site checks it weekly and adds a dated
    version when the file changes.
summary: The 23 offices and volunteer bushfire brigades of Bushfires NT, one row per site, with
  address, fire management zone and coordinates.
description: The office headquarters and volunteer bushfire brigade sites of Bushfires NT, part of
  Northern Territory Fire and Emergency Services. Each row carries the site code, name and type, the
  fire management zone, the street address, the land parcel, and the latitude and longitude. The
  publisher ships the table as a workbook inside the shapefile download, and that workbook is read
  here.
