faq:
- q: What is in each row?
  a: One postcode, with the number of individuals who lodged a tax return for the 2023-24 income year and,
    for each of taxable income, salary and wages, net rent, total income, deductions, business income and
    expenses, net tax and super balances, the count of individuals with the item and its average and
    median in dollars. Some items also give the share of individuals with the item, as a fraction.
- q: Which individuals are counted?
  a: Counts, averages and medians for taxable income, total income and deductions use every individual,
    including zeroes. Net rent counts everyone who reported at the label. The other items count only
    individuals with a value other than zero. The figures come from 2024 returns processed by 31 October
    2025 and are not necessarily complete.
- q: Where are the other years?
  a: The ATO publishes each income year as its own release with its own columns, so each year is its own
    table.
summary: The count, average and median of taxable income, salary and wages, rent, deductions, business
  income, net tax and super balance for individuals in every Australian postcode, 2023-24, from the ATO.
description: Table 25 of the ATO's Taxation Statistics 2023-24 for individuals, selected items by postcode.
  Each row is one postcode, with the number of individuals who lodged and, for each item, the number with
  the item, the share with it where the ATO gives one, and its average and median in dollars.
