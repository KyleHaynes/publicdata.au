faq:
- q: What is in each row?
  a: One of the three names registered most often for girls in one NSW council area, with its rank there.
    Names with the same count share a rank, so a council area can have more than three rows.
- q: Which year does a version cover?
  a: The Registry publishes one file for each year of registrations and sex. This entry follows the newest
    year's file for girls, so each version holds one year. The year is not a column in the file, and the
    version date and the source file name beside each version say which year it is.
- q: Are the counts published?
  a: No. The Registry's file gives the rank of each name in the council area and not the number of babies.
summary: The three names registered most often for girls in each NSW council area, with their rank, for
  the newest year the Registry has published. Updated yearly.
description: The Top 3 REGISTERED Baby Names by LGA files from the NSW Registry of Births Deaths and Marriages,
  for girls. Each row is one council area and one name, with the name's rank among the girls registered there
  in the year. Council areas are named in capitals as the Registry writes them. The Registry publishes
  a file for each year since 2020, and each version here is the newest of them.
