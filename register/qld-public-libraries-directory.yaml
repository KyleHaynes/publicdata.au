faq:
- q: What is in each row?
  a: Each row is one library branch, mobile library or other service point in Queensland. It gives the branch
    name, the council or service that runs it, the street address, postal and interlibrary loan addresses,
    phone, email, opening hours for each day of the week, whether Wi-Fi is available, and the coordinates.
- q: Why does the directory link look wrong?
  a: In this release the publisher's Directory URL column repeats the start of the web address three times
    before the branch path. It is kept as published.
- q: Is there an older version of the directory?
  a: The publisher keeps earlier directories from 2011 to May 2024 as separate files on the same portal page.
    This entry follows the 2026 file.
summary: Every public library branch and mobile library in Queensland, with its address, opening hours, contacts
  and coordinates.
description: 'One row per public library service point in Queensland as listed in the State Library of Queensland''s
  Public Libraries Connect directory. Each row names the branch and its type (branch, mobile, administration,
  community or local studies), the council or library service that runs it, its street, postal and interlibrary
  loan addresses, phone and email, opening hours for each day, and Wi-Fi availability, with latitude and longitude.


  A dash in an address column means the branch has no separate address of that kind. The Date Created column
  is blank in almost every row of this release.

  '
