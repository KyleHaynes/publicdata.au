collection_search_title: Queensland public library data (State Library of Queensland)
collection_description: 'The State Library of Queensland publishes two sets of data on the state''s public
  libraries. The directory lists every branch, mobile library and library service point with its address, opening
  hours, contacts and coordinates.


  The annual statistics are reported by each council for each financial year. One table holds a row per council
  with its spending, collection, loans, members, staff and programs. The other holds a row per branch with
  its opening hours and floor space.

  '
