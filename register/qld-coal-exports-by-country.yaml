faq:
- q: What is in each row?
  a: Each row is one destination country, one calendar year and one coal type, with the tonnes exported from
    Queensland and their sales value in Australian dollars, and the world region the publisher places the country
    in.
- q: Why do some rows say Unknown?
  a: The publisher uses Unknown for exports whose destination was not reported. Those rows are kept as published.
- q: Why does PCI start in 2022?
  a: The publisher reports PCI coal as its own type from 2022. The years before have rows for hard coking,
    semi-soft coking and thermal coal only.
summary: Tonnes and sales value of Queensland coal exports to each country by calendar year since 2010, by
