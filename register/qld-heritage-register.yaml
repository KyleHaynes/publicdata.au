faq:
- q: What is in each row?
  a: One place entered in the Queensland Heritage Register, with its place reference, name and alternative
    names, street address, suburb, council, the date it was entered in the register, its description and
    history, and the statement for each heritage criterion it meets.
- q: Why do some columns contain HTML tags?
  a: The department exports the description, history and criteria as HTML paragraphs. They are kept as
    published.
- q: Which criteria does a place meet?
  a: The criteria met column names each criterion, such as Criterion A, and the significance column holds
    the register's statement for each, in the same order and joined with a vertical bar.
- q: Are there coordinates or boundaries?
  a: No. The export gives the street address, suburb and council. The department publishes heritage boundaries
    separately as a spatial layer.
summary: Every place entered in the Queensland Heritage Register, with name, address, council, entry date,
  description, history and significance, from the department's export.
description: The export of the Queensland Heritage Register kept by the Department of the Environment,
  Tourism, Science and Innovation, one row per state heritage place. Each row has the place reference
  and site id, the name and any alternative names, street address, suburb, local government area, the
  date of entry in the register, and the department's description, history and statements of significance
  against the heritage criteria. The department states the export was last updated in August 2025.
