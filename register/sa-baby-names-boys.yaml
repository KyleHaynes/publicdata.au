faq:
- q: What is in each row?
  a: One name in the year's list of the 100 names given most often to boys registered in South Australia,
    with its position in the list and the number of babies registered with it.
- q: Which year does the list cover?
  a: The newest list the publisher has released, which is the calendar year named in the resource on the
    portal, Top 100 Baby Names 2025 at the first version. The file holds no year column, so each year's list
    is a version here, dated by the day the publisher released it.
- q: Why can a list run past 100 names?
  a: Names with the same count share a position, so a tie at the bottom of the list can carry it past 100
    rows. The rows are kept as published.
summary: The 100 names given most often to boys born in South Australia in the newest year the publisher has
  released, with each name's position and count. Updated yearly.
description: The Top 100 Baby Names list for boys from the Attorney-General's Department, built from births
  registered with South Australia's Births, Deaths and Marriages registry. Each row is one name with the number
  of babies registered with it and its position in the year's list. Names are in capitals as published. The
  publisher adds a new list each year, early in the following year.
