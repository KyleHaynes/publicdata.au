faq:
- q: What is in each row?
  a: Each row is the number of passenger trips on one mode of Translink public transport outside South East
    Queensland in one month.
- q: How far back does it go?
  a: At review the file held about 30 months, starting in late 2023. Each fetch here is kept as a version,
    so a month the publisher later drops stays in an earlier version.
summary: Monthly passenger trips on Translink services outside South East Queensland, by mode.
description: 'One row per month and mode of the passenger trips on Translink services outside South East Queensland,
  such as regional urban buses, regional ferries and Traveltrain, as published in Translink''s monthly performance
  data. At review the file started in late 2023.

  '
