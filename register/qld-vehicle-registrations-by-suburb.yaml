collection_description: |
  The Department of Transport and Main Roads published an extract of the Queensland vehicle register as it stood on 10 October 2022. It has one row for each registered vehicle, with no plate, owner or address, and a count of vehicles by suburb. Seasonal registrations are left out.

  The department split the vehicle rows into eight files by category. Two are here, the counts by suburb and the motorcycles. The light vehicle and other vehicle files are each over 140 MB, in parts.
faq:
- q: What is in each row?
  a: One postcode and suburb of a recorded garaging address, with the number of vehicles registered in
    Queensland that are garaged there. Of the 6,467 rows, 2,830 are for addresses in other states, with
    22,011 vehicles between them.
- q: How current is it?
  a: The department states the extract is the register as at 10 October 2022 and has not replaced it since.
summary: The number of vehicles registered in Queensland on 10 October 2022 for each suburb and postcode
  of their garaging address, from the Department of Transport and Main Roads.
description: A count of the vehicles on the Queensland register on 10 October 2022 by the postcode, suburb
  and state of each vehicle's recorded garaging address, one row per suburb. It covers cars, trucks, trailers,
  caravans and motorcycles and leaves out seasonal registrations.
