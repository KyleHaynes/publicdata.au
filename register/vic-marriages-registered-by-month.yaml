faq:
- q: What does each row hold?
  a: The number of marriages the registry registered in one calendar month. Celebrants must notify the
    registry within 14 days of the ceremony, and a marriage is counted in the month the registry
    registers it, which may be later than the month of the wedding.
- q: How far back does it go?
  a: Each release covers about the last seven years of months, with the newest month first. Earlier
    months drop off the publisher's file as new ones are added, and the versions kept here hold them.
summary: The number of marriages the Victorian registry registered in each month, for about the last
  seven years. Updated monthly.
description: Marriages registered per month by the Registry of Births, Deaths and Marriages Victoria.
  Each row is one calendar month and the number of marriages registered in it. A marriage is counted in
  the month the registry registers it, which may differ from the month of the ceremony.
