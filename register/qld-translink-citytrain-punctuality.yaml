faq:
- q: What is in each row?
  a: Each row is one month. On-time running is the proportion of Citytrain services in the combined peaks that
    ran on time, and reliability is the proportion of scheduled services that ran. Both are written as a fraction
    of 1.
- q: How far back does it go?
  a: At review the file held about 30 months, starting in late 2023. Each fetch here is kept as a version,
    so a month the publisher later drops stays in an earlier version.
summary: The monthly share of Citytrain services that ran on time in the combined peaks, and the share that
  ran at all.
description: 'One row per month with the on-time running of Citytrain services in the combined peaks and their
  reliability, as published in Translink''s monthly performance data. Both are proportions between 0 and 1.
  At review the file started in late 2023.

  '
