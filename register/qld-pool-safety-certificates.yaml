faq:
- q: What is in each row?
  a: Each row is one property for which a pool safety certificate was lodged, with its lot and plan, street
    address, the date the certificate was submitted, the number of pools, the local government area and whether
    the pool is shared.
- q: Does a row mean the certificate is still valid?
  a: No. The row records that a certificate was submitted on the date shown. A certificate for a non-shared
    pool lasts one year and for a shared pool two years, so an old date may have lapsed.
summary: Queensland properties whose pools have been issued pool safety certificates, with the date each was
  submitted.
description: One row per property on the pool safety register with a pool safety certificate, giving the lot
  and plan, unit and street address, suburb, postcode, the date the certificate was submitted, the number of
  pools, the local government area and whether the pool is a shared pool. The file is current as at 1 August
  2024.
