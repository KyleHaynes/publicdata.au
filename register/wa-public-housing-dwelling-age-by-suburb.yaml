faq:
- q: What is in each row?
  a: One Western Australian suburb or town, with the average age in years of the public housing
    dwellings there that have no separate bedroom, one bedroom, and so on up to ten bedrooms, and the
    average age across all of them, also given rounded to a whole year.
- q: Why are many cells blank?
  a: A blank cell means the suburb had no public housing dwelling with that number of bedrooms. There
    is no column for nine bedrooms in the publisher's file.
- q: When is it from?
  a: The Department of Housing published the file in June 2015 and has not updated it. The ages are as
    the department calculated them then.
summary: The average age in years of public housing dwellings in each Western Australian suburb, by
  number of bedrooms and overall, as the Department of Housing published it in 2015.
description: One row per Western Australian suburb or town with public housing, from the Department of
  Housing's 2015 file. Each row gives the average age in years of the department's dwellings there with
  0, 1, 2, 3, 4, 5, 6, 7, 8 and 10 bedrooms, and the average age of all its dwellings in the suburb, both
  to two decimal places and rounded to the year.
