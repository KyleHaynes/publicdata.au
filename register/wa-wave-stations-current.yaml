collection_description: |
  The Department of Transport measures waves off the Western Australian coast with Datawell wave rider buoys. Older deployments used non-directional buoys and newer ones record wave direction as well.

  The publisher lists its buoys in two layers. One holds the buoys in operation and the other holds past deployments since 1974. Each row links to the publisher's own downloads of that deployment's readings.
