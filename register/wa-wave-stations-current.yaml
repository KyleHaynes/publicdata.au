faq:
- q: What is in each row?
  a: One deployment of a Department of Transport wave rider buoy, with its location name and identifier,
    the dates its data covers, its latitude, longitude and depth, the publisher's links to the data
    readme, deployment metadata, live readings and yearly data download, the licence the publisher
    attaches to the record, the date the record was produced and its status.
- q: Are the wave readings included?
  a: No. The publisher serves each deployment's readings as a zip of yearly workbooks linked from the
    download column, which this site does not copy. Each row here describes a buoy deployment.
- q: Where is the publisher's file?
  a: There is none for the station list. This site reads every feature of the publisher's public map
    service layer in pages, in WGS84, and keeps them as one GeoJSON file, which is the source file
    beside every version.
- q: How current is the list?
  a: The records fetched in October 2026 were produced on 2 July 2021, and the dates of data for every
    buoy end on 31 December 2020, the end of the yearly processed download. The live readings link goes
    to the department's current tide and wave page for the location.
summary: The Department of Transport's wave rider buoys in operation off the Western Australian coast, one row per buoy, with location, depth, the dates of its data and links to its readings.
description: The Department of Transport's list of its wave rider buoys in operation, from the Wave Stations Operational layer of DOT-024 on the Western Australian Government's public map service. Each row carries the location name and identifier, the dates its data covers, its coordinates and depth, and the publisher's links to its readme, deployment metadata, live readings and yearly processed data.
