faq:
- q: What is in each row?
  a: One month, venue type and band of machine numbers, such as clubs with 11 to 20 machines. It gives how
    many venues in that band were operating and how many machines they operated between them.
- q: Why does the series start in 2024?
  a: The publisher replaces the file each month with the latest two years of figures. Earlier months drop out
    of the source, and this archive keeps each version as it was fetched.
summary: How many Queensland clubs and hotels operate gaming machines in each size band each month, with the
  machines they operate, for the latest two years.
description: One row per month, site type (Club or Hotel) and band of operating electronic gaming machines,
  with the number of operating sites in the band and the machines they operate. The publisher's file covers
  about the latest 25 months.
