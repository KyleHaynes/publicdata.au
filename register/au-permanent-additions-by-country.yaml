faq:
- q: What is a permanent addition?
  a: The publisher counts settler arrivals from overseas together with people already in Australia who were
    granted a permanent visa. The workbook's notes set out the definition and the revisions for 2008-09
    to 2013-14.
- q: What does a suppressed value mean?
  a: The publisher shows fewer than 5 people as "<5", and a small negative figure as "> -5". Each is kept
    here as a null value with a suppressed flag, and never as 0 or 5.
summary: People added to Australia's permanent population each financial year from 1996-97 to 2016-17, by
  region and country of birth.
description: Permanent additions for each financial year from 1996-97 to 2016-17, by region and country of birth,
  from tables 2.1 and 2.2 of Historical Migration Statistics. Each row is one year and one country, including
  the publisher's regional totals.
