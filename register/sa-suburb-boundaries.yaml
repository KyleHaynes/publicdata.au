faq:
- q: What is in each row?
  a: One gazetted suburb or locality of South Australia with its name, the postcode the publisher gives it, its
    suburb number and the date its boundary took legal effect where the publisher records one. The shape is in
    the GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: How does this differ from the national localities layer?
  a: This is the South Australian Government's own suburb layer, kept by the Department for Housing and Urban
    Development. The national localities on this site come from Geoscape's Administrative Boundaries, and the
    two may differ at the edges and in naming.
- q: Why is the legal start date blank for some suburbs?
  a: The publisher leaves it blank where it records no date. The blank is kept as a null.
summary: The boundaries of every gazetted suburb and locality in South Australia, one shape each with its name,
  postcode and suburb number, from the state's own layer.
description: South Australian suburb and locality boundaries from the Department for Housing and Urban Development.
  Each row is one suburb or locality with its name in capitals, the postcode, the publisher's suburb number and
  the date the boundary took legal effect.
