faq:
- q: What is in each row?
  a: The average number of young people in detention on a night in one quarter from June 2008 to June 2016,
    for one state or territory or Australia, one age group, Indigenous status, legal status and sex.
    Each of those carries a Total group, so the rows overlap and should not be summed across a group that
    has a Total.
- q: Why does the series stop in 2016?
  a: The Institute published this file with its report Youth detention population in Australia 2016 and
    has not added to it on data.gov.au. Later figures are in the Institute's yearly Youth detention
    population reports. Some figures here may differ from the 2016 report because of later revisions.
- q: Why are adults counted?
  a: Some people aged 18 and over are held in youth detention, mostly because they offended as young
    people. The Institute counts them in the 18+ age group.
summary: The average number of young people in detention each night, each quarter from 2008 to 2016, by
  state, age group, Indigenous status, legal status and sex, from the AIHW.
description: The AIHW Youth Justice Detention Data file, the average nightly population in youth detention
  for each quarter from June 2008 to June 2016. Each row is one quarter, state or territory, age group,
  Indigenous status, legal status and sex. The sex column keeps the Institute's spelling Unknow for
  unknown.
