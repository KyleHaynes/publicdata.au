faq:
- q: What is a moving annual median?
  a: Each figure is the median weekly rent of the new leases that began in the twelve months ending in the
    quarter named, beside the count of those leases. A row dated March 2025 covers leases that began from
    April 2024 to March 2025.
- q: What does a blank median mean?
  a: The publisher shows a dash where it gives no figure for a suburb and property type. The dash is kept
    here as a null value in both the count and the median.
- q: What are the Group Total rows?
  a: Each region ends with the publisher's own total row, named Group Total in the suburb column. It is kept
    as published.
summary: The median weekly rent of new leases in each Victorian suburb and town, by property type, for
  each quarter since March 2000, with the number of leases.
description: Moving annual median weekly rents for new leases in each Victorian suburb group and regional
  town, for one, two and three bedroom flats, two, three and four bedroom houses and all properties. Each
  row is one property type, suburb and quarter, with the count of new leases and their median rent, from
  the Homes Victoria Rental Report.
