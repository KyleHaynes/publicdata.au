faq:
- q: What does each row hold?
  a: One urban centre and locality of more than 7,500 people and dispatch code, Code 1 or Code 2, for the
    2017-18 financial year, with the share of incidents reached within 15 minutes, the average response
    time in seconds and the number of incidents. The publisher reports the 15 minute share for Code 1 only,
    so it is blank on Code 2 rows.
- q: What is the Total UCLs row?
  a: The publisher's own total across all urban centres of more than 7,500 people, kept as published.
- q: Why is there a row that repeats the column names?
  a: The publisher's file holds the Code 1 table and then the Code 2 table, and repeats the header row
    between them. That row is kept as published, with its number columns null.
- q: Why is the share within 15 minutes text?
  a: The publisher writes it with a percent sign, such as 91.35%, and it is kept as written.
summary: The share of Code 1 ambulance incidents reached within 15 minutes, the average response time and
  the number of incidents in each Victorian town and city of more than 7,500 people in 2017-18.
description: Ambulance Victoria's response time performance by Urban Centre and Locality (UCL) for 2017-18,
  covering the centres of more than 7,500 people for which the publisher sets its 90% target. Each row is
  one centre and dispatch code, with the share of Code 1 incidents reached within 15 minutes, the average
  response time in seconds and the number of incidents. The portal's 2018-19 file is no longer served by
  the publisher, so 2017-18 is the newest year here.
