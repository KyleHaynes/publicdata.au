faq:
- q: What does each row hold?
  a: Each row is one mapped shape of a place or object on the Victorian Heritage Register, the State's
    list of its most significant heritage places and objects protected under the Heritage Act 2017. It
    carries the register number, such as H2381, the site name and the identifiers the publisher uses, with
    the shape in the GeoParquet, GeoJSON, GeoPackage and PMTiles files. A place mapped in separate parts
    has a row for each part under one register number, and the Coliban Water Supply, H1021, has 50.
- q: How do I find the statement of significance for a place?
  a: The register number in each row is the number the Victorian Heritage Database uses, so a search there
    for the number gives the place's full listing. This layer holds the boundaries and names only.
- q: What is the heritage object flag?
  a: The publisher marks a row Y where the listing is a heritage object rather than a place, and N for a
    place. Both are kept as published.
- q: Does it include places protected only by a council heritage overlay?
  a: No. Places in a local planning scheme's heritage overlay are listed by councils and are not in this
    layer unless they are also on the State register.
summary: The mapped boundaries of about 2,400 places and objects on the Victorian Heritage Register, in
  about 2,700 shapes, each with its register number and name, from the Vicmap heritage_register layer.
description: The Victorian Heritage Register layer from Vicmap, one row per mapped shape of a registered place or
  object, with its register number, site name and the publisher's feature identifiers. The register lists the
  places and objects protected under the Heritage Act 2017 at State level. Shapes are in GDA2020 as the
  publisher serves them.
