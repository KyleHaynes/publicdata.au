faq:
- q: What does each row hold?
  a: The volume of water, in megalitres, held in one reservoir at the end of one month, for every reservoir
    the department reports across Melbourne, Geelong, Ballarat, Bendigo and the regional systems, from January
    2010. The reservoir's total capacity and system are in the companion dataset of Victorian water storages,
    so a percentage full can be worked out by joining the two.
- q: Why are some cells null?
  a: The publisher leaves a cell blank where a reservoir's volume was not available for that month, and a
    reservoir that entered the report later has no earlier rows. The blanks are kept as null.
- q: How often does it change?
  a: The department adds a month to the spreadsheet about a month after it ends. Each release replaces the
    file, so each version here is one release, and the portal record may lag the file by a few weeks.
summary: The volume held in each of about 65 Victorian reservoirs at the end of every month since January
  2010, in megalitres, one row per reservoir and month. Updated monthly.
description: Monthly water storage levels from the Department of Energy, Environment and Climate Action,
  one row per reservoir and month end from 31 January 2010, with the volume held in megalitres. The
  reservoirs belong to 16 supply systems, from Melbourne, Geelong, Ballarat and Bendigo to regional
  systems such as the Goulburn, Murray, Loddon, Glenelg-Wimmera and Latrobe. The spreadsheet's second
  sheet, the list of storages with system and capacity, is served as its own dataset.
