faq:
- q: What is in each row?
  a: One council area, with the publisher's counts of new households housed and their characteristics in the columns named.
- q: What does n.p. mean?
  a: The publisher replaces every count for a council area with n.p. where the area has one to three new households housed. Those
    cells are nulls here, flagged as suppressed.
- q: Are the counts exact?
  a: No. The publisher rounds counts to the nearest multiple of 5, so rows and columns may not add to the totals.
    The publisher's Total and percentage of total rows are kept as published at the end of the table, and
    because the percentage row holds fractions, every count column is typed as a number.
- q: Which date does the table cover?
  a: The newest file the publisher has released, 2020-21 at the first version. The files for 2019-20 stay on the portal,
    and each new file becomes a version here.
summary: The number of households newly housed in public housing in each South Australian council area in the financial year, with greatest need, composition and main source of income.
description: New households housed in public housing by Local Government Area from the South Australian Housing Trust, from South Australia's contribution to the national Public Housing data collection. Each row is one council area with the number of households housed in the year and their members, the households in greatest need and those housed within six months, Aboriginal households and households with a person with disability, those paying less than market rent, and counts by household composition, children and older members and main source of income.
