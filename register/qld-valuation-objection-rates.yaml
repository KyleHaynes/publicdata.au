faq:
- q: What is the objection rate?
  a: It is the share of the valuations issued in a local government area at the 2019 annual valuation
    that drew an objection, given by the publisher as a fraction. A figure of 0.006 means 0.6 per cent.
- q: Why only 2019?
  a: The publisher has a file for each year from 2012 to 2019, in CSV and Excel with column names that
    change between years. This entry holds the 2019 file, the newest. The earlier files stay on the publisher's
    page.
summary: The share of 2019 statutory land valuations in each Queensland local government area that drew
  an objection.
description: 'One row per Queensland local government area, with its code and the rate of objections to
  the 2019 annual land valuation, as a fraction of the valuations issued there. The file lists all 62 areas
  the Valuer-General values and does not say which were valued in 2019. The land valuation trends table
  shows the 18 areas valued that year, and they are the 18 with a rate above 0.


  The publisher releases one file for each year, and the newest is for 2019. This entry is that file,
  read by its fixed address.'
