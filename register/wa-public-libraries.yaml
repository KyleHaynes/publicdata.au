faq:
- q: What is in each row?
  a: One public library in Western Australia, with its name, street and postal address, phone number,
    latitude and longitude in decimal degrees, and its elevation above sea level in metres.
- q: How current is it?
  a: The file is the State Library's list dated February 2021, which is the newest the portal holds.
    Libraries that opened, moved or closed since then are not reflected. This site checks the portal
    for a new file and adds a dated version when it changes.
summary: The 235 public libraries in Western Australia in the State Library's February 2021 list, one
  row per library, with street and postal address, phone number, coordinates and elevation.
description: The State Library of Western Australia's list of public libraries in the state, dated
  February 2021. Each row carries the library's name, street address, suburb, state and postcode, postal
  address, phone number, latitude and longitude in decimal degrees and its elevation above sea level in
  metres.
