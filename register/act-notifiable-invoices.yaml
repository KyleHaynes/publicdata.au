faq:
- q: What is in each row?
  a: One invoice of 25,000 dollars or more paid by an ACT Government entity, with the supplier's name and
    ABN, the entity that reported it, a description of the goods, services or works, the date the invoice
    was received, the payment date, the amount and the contract number where there is one.
- q: Why is the date received blank in older rows?
  a: The publisher began recording the date an invoice was received for reporting from 1 July 2017, so
    most earlier invoices have none.
- q: How current is it?
  a: The publisher adds each month's invoices within 21 days of the end of the month in which they were
    paid. This site checks the register weekly and adds a dated version when it changes.
summary: Every invoice of 25,000 dollars or more paid by the ACT Government and its entities since July
  2015, one row per invoice with the supplier, description, payment date and amount.
description: The register the ACT Government publishes under the Government Procurement Act 2001 of
  notifiable invoices, those of 25,000 dollars or more for goods, services or works paid by the Territory
  or a Territory entity. Each row carries the supplier name and ABN, the reporting entity, the description
  of the invoice, the date it was received (from July 2017), the payment date, the payment amount and the
  contract number where the publisher gives one.
