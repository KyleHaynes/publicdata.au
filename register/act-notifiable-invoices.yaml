collection_description: |
  The ACT Government publishes its contracts and the large invoices it pays so the community can see what it buys and from whom.

  The collection holds two tables. The notifiable invoices register lists every invoice of 25,000 dollars or more that a Territory entity has paid since July 2015, and is updated monthly. The contracts register table is the portal's copy of the ACT Government Contracts Register, last changed in July 2017. The current contracts register is on the Tenders ACT website.
