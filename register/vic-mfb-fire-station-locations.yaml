faq:
- q: What does each row hold?
  a: One Metropolitan Fire Brigade station as listed in May 2013, with its zone, station number, street
    address and postcode, and the fire appliances based there.
- q: Is this the current list of Melbourne fire stations?
  a: No. The file was published in 2013 and has not changed since. Fire Rescue Victoria replaced the
    Metropolitan Fire Brigade on 1 July 2020, so stations, numbers and appliances may differ today.
- q: Why does one row have no station number?
  a: The publisher split the address of station 49 over two rows, so the second row holds only the end of
    that address. It is kept as published.
summary: The 47 Metropolitan Fire Brigade stations across Melbourne as listed in May 2013, with their zone,
  station number, address and fire appliances.
description: A list of Metropolitan Fire Brigade (MFB) fire stations published in May 2013, one row per
  station, grouped into Central, Northern, Southern and Western zones. Each row gives the station
  number, its street address with suburb and postcode, and the appliances based there. The MFB became part
  of Fire Rescue Victoria on 1 July 2020, and this file is kept as a record of the 2013 list.
