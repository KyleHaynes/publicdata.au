faq:
- q: Which crashes are included?
  a: The crashes reported to NSW Police on a public road in the five reporting years of the release, in
    which a person was killed or injured or a vehicle was towed away. Each row is one crash, with its location,
    road and conditions and the number of people killed or injured.
- q: Why does each version cover only five years?
  a: Transport for NSW publishes a rolling five years each October and adds the release as a new file. This
    entry follows the newest file, so each version is one release. Earlier releases stay here as earlier
    versions.
- q: Can I count the road toll from this?
  a: The killed column counts people who died within 30 days of the crash, as the publisher reports them.
    Add it across the crashes of a year to get the deaths the publisher counted for that year.
summary: Every road crash reported to NSW Police that killed or injured someone or needed a tow, one row
  per crash, with date, location, road conditions and the number killed and injured.
description: NSW Crash Data from Transport for NSW, one row per crash for the latest five reporting years.
  Each crash has its degree, year, month, day of week and two-hour band, street, town, council area and
  coordinates, the road and lighting conditions, the road user movement and definitions for crash type
  codes, the vehicles involved and the number of people killed and injured by severity.
