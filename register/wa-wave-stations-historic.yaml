faq:
- q: What is in each row?
  a: One deployment of a Department of Transport wave rider buoy, with its location name and identifier,
    the dates its data covers, its latitude, longitude and depth, the publisher's links to the data
    readme and deployment metadata, a yearly data download for about half of the deployments, the
    licence the publisher attaches to the record, the date the record was produced and its status. The
    live readings column is empty for every past deployment.
- q: Are the wave readings included?
  a: No. The publisher serves each deployment's readings as a zip of yearly workbooks linked from the
    download column where the row has one, which this site does not copy. Each row here describes a
    buoy deployment.
- q: Where is the publisher's file?
  a: There is none for the station list. This site reads every feature of the publisher's public map
    service layer in pages, in WGS84, and keeps them as one GeoJSON file, which is the source file
    beside every version.
summary: Past deployments of Department of Transport wave rider buoys off the Western Australian coast since 1974, one row per deployment, with location, depth, dates and links to its data.
description: The Department of Transport's list of past wave rider buoy deployments, from the Wave Stations Historic layer of DOT-024 on the Western Australian Government's public map service. Each row carries the location name and identifier, the dates its data covers, its coordinates and depth, and the publisher's links to its readme, deployment metadata and yearly processed data where one is offered.
