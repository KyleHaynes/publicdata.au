faq:
- q: What is in each row?
  a: One motorcycle, moped, motor tricycle or sidecar on the Queensland register on 10 October 2022, with
    its registration category, term and purpose of use, body shape, year of manufacture, make, model,
    colour, fuel, cylinders, seats, the weights the register holds and the first five characters of its
    VIN. No plate, owner or address is included.
- q: Why are the weights mostly empty?
  a: The register holds weights for few motorcycles, so most of those cells are blank in the department's
    file and null here.
summary: Every motorcycle, moped and motor tricycle registered in Queensland on 10 October 2022, one row
  per vehicle, with make, model, year, body shape, fuel and purpose of use.
description: The motorcycle part of the Department of Transport and Main Roads extract of the Queensland
  vehicle register as at 10 October 2022, one row per registered motorcycle, moped, motor tricycle or
  sidecar. Each row has the registration category, term and purpose of use, the body shape, year of manufacture,
  make, model and colour, the fuel type, cylinders and seats, the recorded weights and the VIN prefix.
  Seasonal registrations are left out.
