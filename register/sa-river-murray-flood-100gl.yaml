faq:
- q: What is in each row?
  a: One polygon of land the model predicts is under water when the River Murray flows at 100 gigalitres
    (100,000 megalitres) a day at the South Australian border. Every row carries the same flood name, and the
    shapes are in the GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: Is this a record of a real flood?
  a: No. It is a modelled scenario from a study the Department ran for flood preparedness and risk management.
    The extent of the 2022 to 2023 flood, which was mapped from imagery, is a separate dataset in this
    collection.
summary: The area of the River Murray floodplain in South Australia predicted to be under water at a flow of
  100 gigalitres a day at the border, from the Department for Environment and Water's flood study.
description: The predicted flood extent of the River Murray in South Australia for a flow of 100,000 megalitres a
  day measured at the border, one of ten scenarios from 100 to 341 gigalitres a day that the Department for
  Environment and Water modelled to help with flood preparedness and risk management. Each row is one polygon of
  the extent.
