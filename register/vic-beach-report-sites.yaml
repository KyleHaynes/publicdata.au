faq:
- q: What does each row hold?
  a: One beach EPA Victoria samples for its Beach Report, with its site number, name, the water body it is
    on and its latitude and longitude.
- q: What datum are the coordinates in?
  a: The publisher gives decimal degrees without naming a datum. They are published as given and taken
    as WGS84 for mapping, which differs from GDA2020 by under two metres.
