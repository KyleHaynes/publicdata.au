faq:
- q: What is in each row?
  a: One month since January 2015, with the number of births, deaths and marriages the Registry registered
    in that month.
- q: Are these the births and deaths that happened in the month?
  a: No. The Registry counts the registrations it completed in the month. A birth or death can be registered
    weeks after it happened, so a month's count is not the number of events that occurred in it.
- q: How often is it updated?
  a: The Registry adds the latest month to the file every month.
summary: The number of births, deaths and marriages registered in New South Wales each month since January
  2015. Updated monthly.
description: The REGISTERED Monthly Births, Deaths, and Marriages table from the NSW Registry of Births Deaths
  and Marriages. Each row is one month, with the number of births, deaths and marriages registered in
  it. The figures count registrations completed by the Registry, which can be later than the events they
  record.
