faq:
- q: What is in each row?
  a: One swim site that Beachwatch monitors, with its name, the current pollution forecast and when it
    was issued, the latest water quality result and its rating, the date of that sample, and the site's
    longitude and latitude.
- q: How often does it change?
  a: Beachwatch issues pollution forecasts daily and samples sites on a schedule. This entry is read as
    a live feed, and each day the feed changes is one version, so earlier days stay here as earlier versions.
- q: What does forecast not available mean?
  a: Beachwatch issues a daily forecast only for some sites and seasons. Other sites show forecast not
    available as published.
summary: Every NSW swim site that Beachwatch monitors, with today's pollution forecast, the latest water
  quality result and the site's location. Read daily as a live feed.
description: The Beachwatch public sites feed from the NSW Department of Climate Change, Energy, the Environment
  and Water, one row per monitored swim site. Each site has its
  Beachwatch ID and name, the pollution forecast with its timestamp, and the latest water quality result
  with its rating and observation date. Timestamps are kept as the ISO 8601 text the feed gives.
