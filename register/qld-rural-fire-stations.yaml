faq:
- q: What is in each row?
  a: One rural fire station of the Rural Fire Service Queensland, with its name, address, locality, an
    alternative address where given and its coordinates in GDA94 and GDA2020.
- q: Does every rural brigade have a station?
  a: No. The publisher notes that not all rural brigades have fire stations, so a brigade may be missing
    from this list.
summary: Every rural fire station of the Rural Fire Service Queensland, with address and coordinates in
  GDA94 and GDA2020. Updated monthly.
description: The rural fire stations of the Rural Fire Service Queensland, part of the Queensland Fire
  Department, one row per station, with its address, locality, alternative address and longitude and latitude
  in both GDA94 and GDA2020. The department uploads the file automatically each month.
