faq:
- q: What is counted?
  a: Victims of assault, sexual assault, homicide and related offences, and kidnapping or abduction that
    police recorded as family and domestic violence related, by state and territory, sex and year from 2014, as the number of victims
    and as a victimisation rate per 100,000, compiled by the Institute from the ABS Recorded Crime, Victims
    collection. Not every state records the family and domestic violence flag for every offence, and the
    Institute writes n.a. where data is not available and n.p. where it is not published.
- q: Where is this table from?
  a: The Institute's Family, domestic and sexual violence data tables workbook, which gathers tables from
    several national collections. This dataset is one sheet of it. The data in this sheet is compiled
    by the Institute from a government source it names, and the ABS and AIC publish their own material
    under CC BY 4.0 as well.
- q: Why does the attribution say "based on" AIHW material?
  a: The Institute publishes its data tables under CC BY 4.0 and asks that material adapted from them,
    which republishing in other formats is, carry the words "Based on Australian Institute of Health and
    Welfare material". Every file here carries them. The Institute has not endorsed this site.
summary: Victims of family and domestic violence related assault, sexual assault, homicide and kidnapping
  recorded by police, by state and territory, sex and year since 2014, as counts and rates. Updated with the AIHW
  data tables.
description: Table RCV 1 of the Australian Institute of Health and Welfare's Family, domestic and sexual
  violence data tables, victims of family and domestic violence crimes by sex, 2014 to the latest year,
  one row per sex, year, offence, state or territory and unit. Values are the number of victims or the
  victimisation rate per 100,000 people, compiled from the ABS Recorded Crime, Victims collection.
