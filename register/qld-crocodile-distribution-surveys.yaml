faq:
- q: What is in each row?
  a: Each row is one crocodile seen on a departmental survey of a Queensland river between 2000 and 2012, with
    the river, the date, the species, how it was seen, its estimated size, where it was in the channel, the
    habitat, the bank and its coordinates.
- q: What do the codes mean?
  a: The sighting, location and habitat columns use the publisher's codes, which are explained in the legend
    workbook on the same portal page. They are kept as published.
- q: Why does one river appear under several names?
  a: The surveyors wrote river names in different ways, such as Hull_River and Hull_R., and the file keeps
    each spelling. Add the spellings together for a river's full count.
- q: Why do some points fall north of the equator?
  a: Rows from Gulf of Carpentaria rivers, such as the Norman and the Staaten, give the latitude without
    its minus sign. The coordinates are kept as published.
summary: Each crocodile recorded on Queensland Government river surveys from 2000 to 2012, with species, estimated
  size, habitat and coordinates.
description: 'One row per crocodile recorded on the Queensland environment department''s crocodile distribution
  surveys of rivers from 2000 to 2012. Each row gives the river, the survey date, the species, how the animal
  was seen, its estimated size in feet or metres, its position in the channel, the habitat, the bank and its
  latitude and longitude. The coded columns follow the publisher''s legend workbook, published beside the data.

  '
