faq:
- q: What is in each row?
  a: One ACT Policing station, with its name, its street address and its coordinates.
- q: Is it current?
  a: The publisher has not changed the list for several years, so a station opened, moved or closed
    since then is not shown. Check ACT Policing's own website before relying on an address.
- q: Where is the publisher's file?
  a: The portal serves the list as a table with each location as text. This site reads the portal's
    GeoJSON export of the same rows and keeps that file as the source of every version.
summary: The six ACT Policing stations the Australian Federal Police lists on the ACT portal, one row
  per station with its address and coordinates.
description: The locations of ACT Policing stations as the Australian Federal Police published them on
  the ACT open data portal. Each row carries the station name, the street address and the point's
  longitude and latitude.
