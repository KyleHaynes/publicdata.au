faq:
- q: Why does the series start in December 2023?
  a: NT Police moved to a new records system, SerPro, in November 2023. The publisher says figures from
    December 2023 onwards should not be compared directly with earlier figures, and its current release
    starts there.
- q: Are recent months final?
  a: No. The publisher marks recent months as provisional because offences are entered later in an investigation
    under SerPro, so a month can take several months to settle. Each monthly release is kept here as its
    own version, so a later version can revise an earlier month.
- q: What does a dash mean in the alcohol and domestic violence columns?
  a: The publisher records alcohol and domestic violence involvement for assault offences only. Other offences
    carry a dash, which is kept as published.
summary: Offences recorded by NT Police each month since December 2023, by offence category and type,
  region and statistical area, with alcohol and domestic violence involvement for assaults.
description: Counts of offences recorded by NT Police in each month since December 2023, by offence category
  and type, reporting region and, outside the main towns, Statistical Area 2. Assault offences are split
  by alcohol involvement and domestic violence involvement. The publisher releases a new dataset each month,
  and this entry follows the newest.
