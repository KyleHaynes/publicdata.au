faq:
- q: What is in each row?
  a: One contract QLeave, the authority that runs portable long service leave schemes in Queensland, awarded
    or varied in 2025-26, with the description, award date, value, supplier name and address, whether
    it was varied, the procurement method, form of contract and number of offers sought.
- q: What is a contract disclosure report?
  a: Queensland Government agencies must publish details of each contract they award worth $10,000 or
    more, including GST. Contracts over $500,000 should also carry fields such as the evaluation criteria
    and deliverables. In this report those two columns are blank for every contract.
- q: Why is this year only?
  a: QLeave publishes each financial year as a separate portal dataset with its own name, so this table
    is the 2025-26 report and later years need their own entries.
- q: Why do some rows have no contract or an odd date?
  a: The workbook holds eight rows that give the agency and nothing else, and they are kept as published.
    Four contracts carry award dates in May and June 2025, before the financial year began, and one carries
    the date 18/15/2025, which is not a real date. The award date is kept as text because of it.
summary: Every contract worth $10,000 or more awarded by QLeave in the 2025-26 financial year, with supplier,
  value, date and procurement method.
description: The contract disclosure report of QLeave for the 2025-26 financial year, read from the upload
  template sheet of its workbook, one row per contract, with the agency, description, award date, value,
  supplier name and address, variation, confidentiality, procurement method, limited tender reason, form
  of contract, offers sought and the fields required for larger contracts.
