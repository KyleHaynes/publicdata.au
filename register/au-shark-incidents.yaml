faq:
- q: What is an incident?
  a: Any recorded interaction in Australian waters where a shark bit or attempted to bite a person, or
    a person's equipment with the person present, from 1791 to today, with the outcome, location, activity,
    species and the conditions where they are known. The database is maintained by Taronga with Flinders
    University and the NSW Department of Primary Industries, and grew out of the Australian Shark Attack
    File kept since 1984.
- q: Why are so many cells blank?
  a: The record for an old incident may hold no more than a date, a place and an outcome, and even recent
    records are compiled from reports that vary in detail. A blank cell means the detail was not recorded.
- q: Where does the file come from?
  a: The database is published on Zenodo under CC BY 4.0, with a new version roughly twice a year. Each
    version here follows the newest Zenodo version of the concept record, and its DOI is in the provenance.
summary: Every recorded shark incident in Australian waters since 1791, about 1,300 rows, with date, state,
  location and coordinates, the shark species and size, the person's activity and injury, and the conditions.
  Updated with each Zenodo release.
description: The public version of the Australian Shark-Incident Database, one row per incident from 1791,
  maintained by Taronga Conservation Society Australia with Flinders University and the NSW Department
  of Primary Industries. Each row records the month and year, injury outcome, state, location and coordinates,
  site category, shark species and length, whether provoked, the victim's activity, injury location and
  severity, gender and age, clothing and equipment, the time, depth, distance to shore, water and weather
  conditions, and the source of the record.
