faq:
- q: What is in each row?
  a: One place on the Commonwealth Heritage List, which holds heritage places owned or controlled by the
    Australian Government, with its place ID and file number, name, class (Indigenous, natural or historic),
    listing status, state, address, area in hectares, the date it was entered on the list and the date its
    record was updated. Its boundary is
    in the GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: Is every listed place here?
  a: The department leaves out places subject to confidentiality agreements, and nominations under
    assessment, rejected, ineligible, removed or destroyed. A few places are made of several parcels. The
    status column marks the few nominated places the file does carry and the parts within a listed place.
- q: What are the Shape area and length columns?
  a: They are the area and perimeter the map service works out in its own coordinates, kept as published.
    The area in hectares is the department's own figure.
summary: The 372 places on the Commonwealth Heritage List and a few nominated places, each with its boundary,
  class, state, address and listing date, from the Department of Climate Change, Energy, the Environment and Water.
description: The public Commonwealth Heritage List spatial database, read from the department's map service.
  Each row is one listed place with its identifiers, name, class, status, state, area, listing and update
  dates and address, and its boundary as a polygon.
