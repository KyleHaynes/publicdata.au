faq:
- q: What does one row count?
  a: The number of people killed or injured in one combination of year, police region, severity, age
    group, gender and road user type. Add rows to get a total. A crash with three injured people appears
    as three casualties, not one.
summary: Casualties from Queensland road crashes counted by year, police region, severity, age group,
  gender and road user type.
description: Aggregate counts of people killed or injured in reported Queensland road crashes from 1 January
  2001. Each row is one combination of year, police region, casualty severity, age group, gender and road
  user type, with the number of casualties.
