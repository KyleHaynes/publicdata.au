faq:
- q: What is in each row?
  a: The number of dogs or cats recorded as at home on Dogs and Cats Online in one council area that share a sex,
    registration status, microchip status and desexing status.
- q: What does registered mean here?
  a: The publisher counts an animal as registered if its owner paid the registration fee for the financial year, or
    where the council charges no fee, confirmed or updated the animal's details. All others are unregistered.
- q: Which council is it?
  a: The council where the animal is housed, which may differ from the council where its owner lives.
- q: Which year does the table cover?
  a: The newest extract from Dogs and Cats Online, taken on 30 May 2025 at the first version. The publisher releases
    a new portal dataset each year, and each extract becomes a version here.
summary: The number of dogs and cats on South Australia's Dogs and Cats Online register in each council, by
  species, sex, registration, microchip and desexing status. Updated yearly.
description: Animal counts from Dogs and Cats Online (DACO), from the Department for Environment and Water. Each row
  is one council, species, sex, registration status, microchip status and desexing status, with the number of
  animals recorded with the status At Home. The publisher notes that an animal's status stays At Home unless it is
  updated as deceased, lost, surrendered or impounded.
