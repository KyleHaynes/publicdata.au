collection_description: Counts from Dogs and Cats Online, South Australia's register of dogs and cats, released each
  year by the Department for Environment and Water. One table counts the animals by council, species, sex,
  registration, microchip and desexing. Another counts their owners by council, sex, age and how many animals they
  keep, and a third counts reported dog and cat incidents.
