faq:
- q: What does each row hold?
  a: The number of new vehicles registered in Victoria in the month that share one make, model, body
    colour and year of manufacture. Boats and trailers are not included.
- q: Which month is it?
  a: Each version is the newest month the department has released, named on the portal. The portal also
    lists each earlier month of 2025 and 2026 as its own file, and 2023 and 2024 as zip files.
- q: What do the codes mean?
  a: Make and model are the register's codes of up to six characters and colour a three letter code, as
    the register holds them.
summary: The number of new vehicles registered in Victoria in the month by make, model, body colour and
  year of manufacture.
