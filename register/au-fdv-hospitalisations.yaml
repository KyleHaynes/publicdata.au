faq:
- q: What is counted?
  a: Hospital admissions for assault injuries where the perpetrator was recorded as a spouse or domestic
    partner, a parent or another family member, by financial year from 2020-21, age group and sex, as
    the number of hospitalisations and the rate per 100,000 people, compiled by the Institute from the
    National Hospital Morbidity Database. The Institute writes n.p. where a figure is not published.
- q: Where is this table from?
  a: The Institute's Family, domestic and sexual violence data tables workbook, which gathers tables from
    several national collections. This dataset is one sheet of it. The data in this sheet is compiled
    by the Institute from a government source it names, and the ABS and AIC publish their own material
    under CC BY 4.0 as well.
- q: Why does the attribution say "based on" AIHW material?
  a: The Institute publishes its data tables under CC BY 4.0 and asks that material adapted from them,
    which republishing in other formats is, carry the words "Based on Australian Institute of Health and
    Welfare material". Every file here carries them. The Institute has not endorsed this site.
summary: Hospital admissions for family and domestic violence assault injuries by financial year, age
  group, sex and the perpetrator's relationship, as counts and rates per 100,000, from 2020-21. Updated
  with the AIHW data tables.
