faq:
- q: What is in each row?
  a: One traffic enforcement camera or mobile speed camera site, with its camera type, its location codes,
    its coordinates, a description of the place and the date it was decommissioned if it has been.
- q: Are decommissioned cameras included?
  a: Yes. The publisher keeps every location, including those no longer in use, and gives the date a
    camera was decommissioned.
- q: Does every location have coordinates?
  a: No. Some older mobile sites have no latitude or longitude, and three rows carry only the
    publisher's text of the coordinates with no camera type or code. They are kept as published, and one
    row that is blank in every column is left out.
- q: How do I link it to the fines?
  a: The camera location code matches the camera location in the ACT traffic and camera fines tables in
    this collection. The publisher says some cleaning may be needed for the codes to match.
summary: Every traffic enforcement camera and mobile speed camera site in the ACT, including those
  decommissioned, one row per location with its type and coordinates.
description: The locations of the ACT's traffic enforcement cameras as Access Canberra lists them, with
  fixed speed cameras, red light and speed cameras, point to point cameras and mobile speed camera sites.
  Each row carries the camera type, the camera location code, the location code, the latitude and
  longitude, a description of the location, the publisher's own text of the coordinates and the date the
  camera was decommissioned where that applies.
