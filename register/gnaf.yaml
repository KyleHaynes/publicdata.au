summary: 'Every physical address in Australia with its geocode, street, locality, postcode and mesh block,
  as Geoscape''s quarterly G-NAF release: 37 related tables with about 131 million rows in all, including
  about 17 million addresses, served as one DuckDB database and one Parquet file per table.'
description: |-
  G-NAF is the Geocoded National Address File, the address database Geoscape Australia builds from the address data of the states, territories and the Commonwealth and publishes each quarter on data.gov.au. Each release is a set of pipe-separated files that make up a relational database: addresses, the sites and geocodes behind them, aliases, streets, localities, states and the ABS mesh block each address falls in, with lookup tables for every code.

  This site serves each release as one DuckDB database holding every table, the keys and references between them and Geoscape's own address view, which joins an address to its street, locality, state and default geocode. The same tables are also served as one Parquet file each. The database attaches read-only over HTTPS, so a query over addresses runs without downloading the release. Coordinates are GDA2020.
faq:
- q: What is the condition on use?
  a: 'The Open G-NAF End User Licence Agreement is CC BY 4.0 with one condition added: the data must not
    be used to generate an address, or a compilation of addresses, for the sending of mail unless each
    address has been verified as capable of receiving mail by reference to a secondary source. Geoscape''s
    fact sheet on the restriction is on the source page. Everything else CC BY 4.0 allows, this licence
    allows, with the attribution kept.'
- q: Which coordinate system is it in?
  a: GDA2020. Geoscape publishes a GDA94 release beside it, which this site does not serve.
- q: Where do I start?
  a: The address_view view is one row per address with its street, locality, state, postcode and default
    geocode already joined, from Geoscape's own script. The address_detail table is the same addresses
    with every field and the keys into the other tables. Every code column has a lookup table ending in
    _aut.
- q: Why is there no CSV or Excel file?
  a: A release is 37 tables and about 131 million rows, which is not one spreadsheet. The DuckDB file
    holds every table and attaches over HTTPS, and each table is also a Parquet file that pandas, R, Spark
    and DuckDB read directly. The publisher's pipe-separated files are beside every version as source.zip.
- q: Does it include G-NAF Core?
  a: No. G-NAF Core is a flattened single-table cut Geoscape publishes on its own site. The address view
    here serves the same purpose from the full release.
