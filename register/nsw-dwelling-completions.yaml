faq:
- q: What is in each row?
  a: One quarter since June 1985, with the publisher's figure for the number of residential dwellings
    completed in New South Wales in a year per 1,000 people.
- q: Is this a count of dwellings?
  a: No. The publisher gives a rate per 1,000 people and does not give the count or the population it
    used in the file. The value is published as the department calculated it.
summary: The number of residential dwellings completed in New South Wales each year per 1,000 people,
  at each quarter since June 1985, as the Department of Planning, Housing and Infrastructure reports it.
  Updated quarterly.
description: The Dwelling completions indicator from the NSW Department of Planning, Housing and Infrastructure,
  the number of NSW residential dwellings completed per 1,000 people annually. Each row is one quarter,
  dated by the first day of the quarter's last month as the publisher dates it, with the annual completions
  per 1,000 people at that quarter.
