faq:
- q: Why are there two tables?
  a: The publisher reports a break in the series from 2017-18 because of system changes and reporting conventions.
    Table 3.2 covers 1996-97 to 2016-17 and table 3.3 covers 2017-18 onwards. The table column says which
    one a row comes from.
- q: What does a suppressed value mean?
  a: The publisher shows fewer than 5 visas as "<5", and a small negative figure as "> -5". Each is kept
    here as a null value with a suppressed flag, and never as 0 or 5.
summary: Permanent visas granted under the Migration Program each financial year since 1996-97, by stream
  and country of citizenship.
description: The Migration Program outcome for each financial year since 1996-97, by stream and country
  of citizenship, from tables 3.2 and 3.3 of Historical Migration Statistics. Each row is one year, stream
  and citizenship, including the publisher's totals.
