faq:
- q: What is in each row?
  a: Each row is one council's library service for the financial year the file covers. It gives the population
    served, grants, spending by category, the size of the physical and digital collection, items bought and
    withdrawn, visits, loans of each kind, members, staff in full-time equivalents, programs and attendance,
    public internet and Wi-Fi use, and the publisher's own per capita figures.
- q: Are the per capita columns calculated here?
  a: No. The per capita columns are in the publisher's file and are kept as published.
- q: Which year does this cover?
  a: The publisher adds one file per financial year. This entry follows the newest council file, which is 2024/2025
    at the time of review, and each new year becomes a new version.
summary: Spending, collections, loans, visits, members, staff and programs of each Queensland council's public
  library service for the latest financial year.
description: 'One row per council library service in Queensland for one financial year, from the annual statistics
  the State Library of Queensland collects from councils. Columns cover the population served, the State Library
  and First 5 Forever grants, expenditure by category, the collection by format, acquisitions and withdrawals,
  physical and web visits, reference enquiries, reservations, loans and digital use, members, staff, programs
  and their attendance by audience, public internet devices and Wi-Fi sessions. The publisher''s per capita
  figures are included as published.


  The publisher adds a new file for each financial year. This entry follows the newest.

  '
