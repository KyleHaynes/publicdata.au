faq:
- q: What is in each row?
  a: One service station on one day, with the station's brand, region, suburb, postcode and coordinates
    and the price in cents per litre of each fuel it sold, as reported to the MyFuel NT scheme. The
    publisher writes 0 where a station does not sell a fuel or did not report a price, and the word null in
    one row; those cells are null here.
- q: Why does the series stop in 2024?
  a: The Northern Territory Government published a workbook for each month from November 2017 to
    November 2024 and has released none since. The 84 workbooks are read as one table. A day at the
    boundary of two months appears in both workbooks and is kept once, and one workbook the publisher
    uploaded twice under two months' names is counted once. The publisher gives no station identifier,
    so two stations at one coordinate on one day can be told apart only by their prices.
- q: Are any days missing?
  a: The series has no rows for 17 days, which are 5 to 8 May 2020, 2 to 4 July 2020 and 11 to 20 May 2022.
    On 9 May 2020 and 21 May 2022 it has a row for one station only.
summary: The daily price of every fuel at every Northern Territory service station from November 2017
  to November 2024, one row per station and day, from the MyFuel NT workbooks. About 580,000 rows,
  closed series.
description: Daily fuel prices reported under the Northern Territory's MyFuel NT scheme, one row per
  service station and day from 1 November 2017 to 1 December 2024, with brand, region, suburb, postcode,
  latitude and longitude and the price in cents per litre of diesel, premium 98 and 95, unleaded 91,
  premium diesel, LPG, low aromatic fuel, E85, E10 and B20. The Department of Treasury and Finance
  published the series as 84 monthly workbooks across 29 portal datasets, read here as one table.
